<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>אורנה · עוזרת</title>
<style>
:root{--bg:#0e1117;--card:#161b24;--line:#242a36;--txt:#e8ebf0;--dim:#8b93a3;--acc:#1f9d8b;--accSoft:rgba(31,157,139,.16)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
 font:15px/1.55 -apple-system,'Segoe UI',Roboto,'Heebo',sans-serif;height:100%}
#app,#login{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;padding:10px 2px}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8fe3d6,var(--acc));flex:none}
h1{font-size:18px;margin:0}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#login{margin-top:18vh}
#login input{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);
 background:var(--bg);color:var(--txt);font-size:16px}
#login button,#composer button{margin-top:10px;padding:12px 16px;border-radius:10px;border:0;
 background:var(--acc);color:#fff;font-size:15px;font-weight:600;width:100%}
#loginStat{color:var(--dim);font-size:12.5px;margin-top:8px;min-height:1em}
#app{display:none;flex-direction:column;height:100dvh}
#thread{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.msg{margin:8px 0;display:flex}
.msg .bubble{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.me{justify-content:flex-start}
.me .bubble{background:var(--accSoft);border:1px solid rgba(31,157,139,.3)}
.her{justify-content:flex-end}
.her .bubble{background:var(--card);border:1px solid var(--line)}
.meta{display:block;margin-top:6px;color:var(--dim);font-size:11.5px}
#composer{display:flex;gap:8px;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
#composer textarea{flex:1;resize:none;padding:12px;border-radius:12px;border:1px solid var(--line);
 background:var(--card);color:var(--txt);font-size:16px;max-height:110px}
#composer button{width:auto;margin:0;padding:0 18px}
#composer button:disabled{opacity:.5}
#mic{background:var(--card);border:1px solid var(--line);color:var(--txt);width:auto;padding:0 14px}
#mic.rec{background:#c0392b;border-color:#c0392b;color:#fff;animation:micPulse 1.1s infinite}
@keyframes micPulse{0%,100%{opacity:1}50%{opacity:.55}}
.empty{color:var(--dim);text-align:center;margin-top:24px;font-size:13.5px}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
#chips button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:13.5px;width:auto;margin:0}
</style>
</head>
<body>

<!-- ORNA (David, 19.10 — "לבנות לאורנה את היכולת לעזרה כמו שבניתי לאריק"): the YAELI page, for Orna's own code.
     Same server, same scoped-guest law; her role (operations: Priority contacts and suppliers, orders entered,
     English mail to suppliers and the accountant, her own task list and day report) is told to the kernel by her
     code's name (accessCodes.GUEST_ROLES.orna). Was: YAELI alpha (David, 31.8): the mobile entry. One column, chat only, real
     data — every answer comes from the SAME deployed command-center kernel
     the LIA panel uses. No secrets here: the access code is verified
     server-side, exactly like lia.html's login. -->

<div id="login" class="card">
 <header><span class="orb"></span><div><h1>אורנה · עוזרת</h1>
  <div class="sub">פריוריטי, מיילים ומשימות · נתוני אמת דרך Fresco LIA</div></div></header>
 <input id="code" type="password" autocapitalize="characters" autocomplete="current-password" placeholder="קוד גישה (FR-…)">
 <button onclick="login()">כניסה</button>
 <div id="loginStat"></div>
</div>

<div id="app">
 <header><span class="orb"></span><div><h1>אורנה · עוזרת</h1>
  <div class="sub" id="sub">אלפא · מחוברת</div></div></header>
 <main id="thread"><p class="empty">שאלי אותי על ספקים, אנשי קשר והזמנות בפריוריטי, בקשי ממני לנסח מייל, או תגידי "תזכירי לי…".</p>
 <div id="chips"><button data-q="מה פתוח אצלי היום?">מה פתוח אצלי</button><button data-q="האם כל הזמנות הרכש מהשבוע נקלטו בפריוריטי? מה לא נמצא?">הזמנות שנקלטו</button><button data-q="מה המייל והטלפון של הספק ">איש קשר בפריוריטי</button><button data-q="נסחי מייל באנגלית לספק ">מייל באנגלית לספק</button><button data-q="דוח סוף יום">דוח סוף יום</button></div></main>
 <footer id="composer">
  <textarea id="note" rows="1" placeholder="כתבי לי…"></textarea>
  <button id="mic" onclick="toggleMic()" title="דברי אליי">🎤</button>
  <button id="send" onclick="send()">שלח</button>
 </footer>
</div>

<script>
const API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
const CC='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/command-center?api=1';
let CODE=localStorage.getItem('orna_code')||'';
let HIST=[];            // [{q,a}] — the last exchanges, sent with each ask
let INFLIGHT=0;         // ask-in-a-row (David, 1.9): questions never wait for each other
/* MEMORY UNDER ARIK'S OWN NAME (David, 18.10 — the Arik pilot). The conversation is no longer this tab's
   memory: every question and answer is stored on the server under the identity of the code that sent it
   (chat_sync + the durable kernel turn), so it survives a reload, follows Arik across devices, and never
   appears in David's conversation list — the server files it by user_id, not by this page. */
let CONV='';
const DEVICE=(()=>{let d='';try{d=localStorage.getItem('orna_device')||'';}catch(e){}
 if(!/^[0-9a-zA-Z-]{8,64}$/.test(d)){d='od-'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('orna_device',d);}catch(e){}}
 return d;})();
function rid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function post(url,body){
 const r=await fetch(url,{method:'POST',
  headers:{'Content-Type':'application/json','x-fresco-code':CODE},
  body:typeof body==='string'?body:JSON.stringify(body)});
 return {status:r.status,json:await r.json().catch(()=>null)};
}

async function login(){
 CODE=document.getElementById('code').value.trim();
 const st=document.getElementById('loginStat');
 st.textContent='בודקת…';
 try{
  const {status}=await post(API,'{"action":"state"}');
  if(status===401){st.textContent='קוד שגוי';return;}
  if(status<200||status>=300){st.textContent='השרת לא זמין כרגע ('+status+') — נסה שוב עוד רגע';return;}
  localStorage.setItem('orna_code',CODE);
  boot();
 }catch(e){st.textContent='אין חיבור — נסה שוב';}
}
function boot(){
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 restore();
}
/* the stored conversation comes back on every boot — the server's copy, not the tab's */
async function restore(){
 try{
  const {status,json}=await post(CC,{action:'chat_sync',device_id:DEVICE,messages:[]});
  if(status!==200||!json||!json.conversation_id)return;
  CONV=String(json.conversation_id);
  const msgs=(json.messages||[]).filter(m=>m&&m.content);
  if(!msgs.length)return;
  document.getElementById('thread').innerHTML='';
  let q='';
  for(const m of msgs){
   bubble(m.role==='me'?'me':'her',m.content);
   if(m.role==='me')q=m.content;else if(q){HIST.push({q,a:m.content});q='';}
  }
  if(HIST.length>12)HIST=HIST.slice(-12);
 }catch(e){/* history is a help — the page still asks without it */}
}
async function storeMine(text){
 if(!CONV)await restore();
 if(!CONV)return false;
 const {status,json}=await post(CC,{action:'chat_sync',device_id:DEVICE,conversation_id:CONV,
  messages:[{message_id:rid('ym'),role:'me',content:text,created_at:new Date().toISOString()}]});
 if(status===200&&json&&json.conversation_id)CONV=String(json.conversation_id);
 return status===200&&!!(json&&json.accepted);
}

function bubble(role,text,meta){
 const th=document.getElementById('thread');
 const e=th.querySelector('.empty');if(e)e.remove();
 const d=document.createElement('div');
 d.className='msg '+(role==='me'?'me':'her');
 d.innerHTML='<div class="bubble">'+esc(text)
  +(meta?'<span class="meta">'+esc(meta)+'</span>':'')+'</div>';
 th.appendChild(d);th.scrollTop=th.scrollHeight;
 return d;
}

/* Ask-in-a-row: every question gets its own "חושבת…" bubble the moment it is
   sent, and ITS answer replaces THAT bubble — so a second (or third) question
   can go out while the first is still thinking, and answers stay glued to
   their questions whatever order they return in. */
function fillBubble(w,text,meta){
 const b=w.querySelector('.bubble');
 b.innerHTML=esc(text)+(meta?'<span class="meta">'+esc(meta)+'</span>':'');
 const th=document.getElementById('thread');th.scrollTop=th.scrollHeight;}
async function send(text){
 const ta=document.getElementById('note');
 const t=String(text!==undefined?text:ta.value).trim();if(!t)return;
 if(text===undefined)ta.value='';
 bubble('me',t);
 const w=bubble('her','חושבת…');
 INFLIGHT++;
 try{
  const saved=await storeMine(t).catch(()=>false);
  const turn=rid('yt');
  const ask={action:'kernel',body:t,history:HIST.slice(-6),turn_id:turn,conversation_id:CONV,device_id:DEVICE};
  let {status,json}=await post(CC,saved&&CONV?ask:{action:'kernel',body:t,history:HIST.slice(-6)});
  if(status===401){localStorage.removeItem('orna_code');location.reload();return;}
  /* a long answer is still being worked on server-side: the same turn_id is asked again, and it never runs twice */
  for(let i=0;status===202&&i<60;i++){
   await new Promise(r=>setTimeout(r,4000));
   ({status,json}=await post(CC,ask));
  }
  const r=json||{};
  const ans=String(r.answer||r.text||'לא התקבלה תשובה.');
  const src=(r.sources||[]).length;
  fillBubble(w,ans,src?('מקורות: '+src):null);
  HIST.push({q:t,a:ans});if(HIST.length>12)HIST=HIST.slice(-12);
 }catch(e){
  fillBubble(w,'לא הצלחתי להגיע למערכת ('+(e&&e.message||'רשת')+') — נסה שוב.');
 }
 INFLIGHT=Math.max(0,INFLIGHT-1);
}

/* ── the microphone (Arik, 1.9): two engines, one behaviour ──────────────
   The browser's OWN speech recognition (he-IL) is the default — no upload,
   no recording kept. A browser without it (iPhone Safari) records and sends
   the audio to the server's existing transcribe route, which forwards to
   Whisper and keeps nothing. Either way the words land as a normal question
   and are sent — a talk, not a form. */
let REC=null,MEDIA=null,CHUNKS=[],MICON=false;
function micBtn(){return document.getElementById('mic');}
function setRec(on){MICON=on;micBtn().classList.toggle('rec',on);micBtn().textContent=on?'■':'🎤';}
function toggleMic(){MICON?stopMic():startMic();}
function startMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){
  REC=new SR();REC.lang='he-IL';REC.interimResults=false;REC.maxAlternatives=1;
  REC.onresult=ev=>{const t=(ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript||'').trim();
   setRec(false);if(t)send(t);};
  REC.onerror=()=>{setRec(false);recFallback();};
  REC.onend=()=>{if(MICON)setRec(false);};
  try{REC.start();setRec(true);return;}catch(e){/* fall through */}
 }
 recFallback();
}
async function recFallback(){
 if(!navigator.mediaDevices||!window.MediaRecorder){
  bubble('her','אין למכשיר הזה זיהוי דיבור זמין — כתוב לי במקום.');return;}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  MEDIA=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  CHUNKS=[];
  MEDIA.ondataavailable=ev=>{if(ev.data&&ev.data.size)CHUNKS.push(ev.data);};
  MEDIA.onstop=async()=>{
   stream.getTracks().forEach(tr=>tr.stop());
   const blob=new Blob(CHUNKS,{type:MEDIA.mimeType||mime||'audio/webm'});
   if(!blob.size){setRec(false);return;}
   const w=bubble('her','מתמללת…');
   try{
    const r=await fetch(API+'&transcribe',{method:'POST',
     headers:{'x-fresco-code':CODE,'x-audio-type':blob.type||'audio/webm'},body:blob});
    const j=await r.json().catch(()=>null);
    w.remove();
    const t=(j&&j.text||'').trim();
    if(t)send(t);
    else bubble('her',(j&&j.message)||'לא זיהיתי דיבור — נסה שוב קרוב יותר למיקרופון.');
   }catch(e){w.remove();bubble('her','התמלול לא הצליח ('+(e&&e.message||'רשת')+').');}
  };
  MEDIA.start();setRec(true);
 }catch(e){bubble('her','אין גישה למיקרופון — אשר הרשאה בדפדפן ונסה שוב.');setRec(false);}
}
function stopMic(){
 setRec(false);
 if(REC){try{REC.stop();}catch(e){}REC=null;}
 if(MEDIA&&MEDIA.state==='recording'){try{MEDIA.stop();}catch(e){}}
}
document.getElementById('note').addEventListener('keydown',ev=>{
 if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}});
if(CODE){post(API,'{"action":"state"}').then(({status})=>{if(status>=200&&status<300)boot();
 else if(status===401)localStorage.removeItem('orna_code');}).catch(()=>{});}
/* the five things Orna does most (David, 19.10): one tap asks; a chip that ends with a space waits for her to finish it */
document.querySelectorAll('#chips button').forEach(function(b){b.onclick=function(){var q=b.getAttribute('data-q');var n=document.getElementById('note');n.value=q;if(/\s$/.test(q)){n.focus();}else{send();}};});
</script>
</body>
</html>
