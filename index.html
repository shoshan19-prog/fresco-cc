<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fresco Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="lia-icon-192.png">
<link rel="apple-touch-icon" href="lia-icon-180.png">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fresco">
<!--
  Fresco Command Center (David, 28.9) — the orientation surface of LIA.

  Static page, no credential of any kind inside: it holds only the public API
  URL. Access is gated by the code David types, verified server-side against a
  SHA-256 hash in an RLS-locked table (the same code the chat uses, so a login
  in one is a login in both).

  THE TRUTH MODEL. This screen is NOT a source of truth. WORK is the durable
  execution state, the source systems hold the facts, the Camera holds the
  evidence; this page only orients. So every visible state is derived from
  fields the WORK row already carries, and where the row cannot prove a state
  the screen says so instead of guessing:
    · a package is MOVING only with evidence of current activity (a live lease
      and a fresh heartbeat) — a RUNNING label without one is STALE, not active;
    · a completion is GREEN only when it was verified (an independent PASS or
      complete completion evidence) — never because a row says DONE;
    · a percentage is shown only when the package has real sub-items; otherwise
      the stage it is on, as text;
    · a blocker written on a row is shown as the persisted label it is, not as
      a verified fact.
  Nothing here writes WORK. The three actions that remain (approve / rephrase /
  reject a recommendation, acknowledge an alert) are the tower's own, unchanged.
-->
<style>
/* ── tokens: mirrored from lia.html :root — one visual language (test-command-center pins the drift) */
:root{
 --bg:#f7f8fa;--bg2:#ffffff;
 --card:#ffffff;--card2:#f2f4f7;
 --line:#e4e7ec;--line2:#d0d5dd;
 --txt:#16181d;--dim:#667085;
 --acc:#2f6bff;--acc2:#2f6bff;--accSoft:#eaf0ff;
 --ok:#12a150;--warn:#c77700;--me:#eaf0ff;
 --r:18px;--rs:14px;
 --glow:0 0 0 3px rgba(47,107,255,.13);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,'Segoe UI',Arial,sans-serif;
 min-height:100dvh;overflow-x:hidden;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.dim{color:var(--dim);font-size:13px}
.orb{position:relative;flex:0 0 auto;border-radius:50%;
 background:radial-gradient(closest-side at 34% 30%,#9db6ff 0%,#5b7cff 45%,#2f6bff 100%)}
.orb.sm{width:24px;height:24px}
.orb.md{width:34px;height:34px}

/* ── login: the same card as the chat's */
#login{max-width:380px;margin:22vh auto 0;padding:16px}
#login .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#login .brandRow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#login h1{font-size:23px;letter-spacing:-.4px}
#login input{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
#login button{width:100%;margin-top:10px;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;border-radius:12px;padding:12px 20px}

/* ── the shell: header on a grid, quiet domain nav, one column, bottom nav */
#app{display:none;min-height:100dvh;flex-direction:column}
#app.on{display:flex}
#topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
 padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;direction:ltr;text-align:left}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--acc),#9db6ff);flex:0 0 auto;position:relative}
.brand .mark::after{content:'';position:absolute;inset:8px 7px;border-radius:3px;background:rgba(255,255,255,.85)}
.brand b{display:block;font-size:19px;line-height:1.1;letter-spacing:-.3px}
.brand span{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.3px}
#when{text-align:center;font-variant-numeric:tabular-nums;line-height:1.15;min-width:0}
#when .d{font-size:11.5px;color:var(--dim);white-space:nowrap}
#when .t{font-size:19px;font-weight:600;letter-spacing:-.3px}
.tools{display:flex;align-items:center;gap:2px}
.tools button,.tools a{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);position:relative}
.tools button.on{color:var(--acc);background:var(--accSoft)}
.badge{position:absolute;top:4px;inset-inline-end:2px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;
 font-size:10.5px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
.badge.ok{background:var(--ok)}
#search{display:none;padding:8px 16px 0;background:var(--bg2)}
#search.on{display:block}
#search input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--txt)}
#search input:focus{outline:0;border-color:var(--acc);box-shadow:var(--glow)}

#domains{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line);
 position:sticky;top:0;z-index:5}
#domains button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:7px 2px 6px;border-radius:var(--rs);
 color:var(--dim);font-size:12px;line-height:1.2;white-space:nowrap}
#domains button.on{color:var(--acc);background:var(--accSoft);font-weight:600}

main{flex:1;padding:14px 16px calc(84px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px}
.sec h2{font-size:17px;letter-spacing:-.2px}
.sec .dim{font-size:12.5px}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--rs);padding:14px;color:var(--dim);font-size:14px;text-align:center}
.note{color:var(--dim);font-size:12.5px;margin:6px 2px 0}

/* summary: four numbers, read in one glance */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum button{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 10px 9px;text-align:start;min-height:78px;
 display:flex;flex-direction:column;justify-content:space-between;color:var(--txt)}
.sum b{font-size:24px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;display:block}
.sum .k{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.25}
.sum .bar{height:4px;border-radius:2px;background:var(--card2);margin-top:7px;overflow:hidden}
.sum .bar i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.sum .warn b{color:var(--warn)}.sum .warn .bar i{background:var(--warn)}
.sum .ok b{color:var(--ok)}.sum .ok .bar i{background:var(--ok)}
.sum .quiet .bar i{background:var(--line2)}

/* the one thing that needs him — tinted card, blue edge (David's edge in the chat) */
.feat{background:var(--accSoft);border:1px solid #d6e2ff;border-inline-start:3px solid var(--acc);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:10px;
 display:grid;grid-template-columns:auto 1fr auto;gap:12px;cursor:pointer;text-align:start;width:100%}
.feat .ic{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.feat .sig{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:12.5px;font-weight:600}
.feat .sig::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--warn)}
.feat .ttl{font-size:17px;font-weight:700;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat .sub{font-size:13.5px;color:var(--dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat .pct{font-size:22px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;align-self:start}
.feat .stage{font-size:12px;color:var(--acc);background:#fff;border-radius:20px;padding:3px 9px;align-self:start;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--dim);margin-top:2px}
.feat .go{background:#fff;color:var(--acc);font-weight:600;border-radius:10px;padding:8px 14px;font-size:14px;white-space:nowrap}

/* milestones: only from real sub-items, never invented */
.ms{grid-column:1/-1;display:flex;align-items:flex-start;margin:6px 0 2px;overflow:hidden}
.ms .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.ms .m::before{content:'';position:absolute;top:8px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line2)}
.ms .m:first-child::before{display:none}
.ms .m.done::before{background:var(--acc)}
.ms .m i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);background:#fff;position:relative;z-index:1;display:block}
.ms .m.done i{background:var(--acc);border-color:var(--acc)}
.ms .m.cur i{border-color:var(--acc);border-width:3px}
.ms .m span{font-size:10.5px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.ms .m.cur span{color:var(--txt);font-weight:600}

/* work rows: compact, one glance, tap opens the detail */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px;margin-bottom:8px;width:100%;text-align:start;
 display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;color:var(--txt);min-height:64px}
.row .ic{width:40px;height:40px;border-radius:11px;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.row.warn .ic{background:#fdf3e3;color:var(--warn)}
.row.hist .ic{background:var(--card2);color:var(--dim)}
.row .ttl{font-size:15.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .sub{font-size:13px;color:var(--dim);margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row .st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.row .st .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:0 0 auto}
.row .st.ok .dot{background:var(--ok)}.row .st.ok .lbl{color:var(--ok);font-weight:600}
.row .st.warn .dot{background:var(--warn)}.row .st.warn .lbl{color:var(--warn);font-weight:600}
.row .st .sep{opacity:.5}
.row .pr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:64px}
.row .pr .bar{width:64px;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.row .pr .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.row .pr b{font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.row .pr .stage{font-size:11.5px;color:var(--dim);background:var(--card2);border-radius:20px;padding:3px 8px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--line2)}
.row.done{grid-template-columns:auto 1fr auto auto}
.row.done .ic{border-radius:50%;width:38px;height:38px}
.row.done.ok .ic{background:#eaf7ee;color:var(--ok)}
.row.done .when{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.ok{color:var(--ok);border-color:var(--ok)}

/* recommendations and alerts that need him — the tower's own actions, unchanged */
.appr{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.appr .claim{font-size:15px;font-weight:600;line-height:1.4}
.appr .why{font-size:13px;color:var(--dim);margin-top:4px}
.btns{display:flex;gap:7px;margin-top:10px}
.btns button{flex:1;border-radius:10px;padding:10px 6px;font-size:14px;font-weight:600;min-height:42px}
.b-ok{background:var(--acc);color:#fff}.b-ed{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.b-no{background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.btns button:disabled{opacity:.5}

/* a domain's own strip: what the tower holds for its departments — compact */
.dept{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.dept .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dept .nm{font-size:15.5px;font-weight:700}
.mets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.met{background:var(--card2);border-radius:10px;padding:6px 10px;flex:1 1 auto;min-width:84px}
.met .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.met .v.na{font-size:12.5px;color:var(--dim);font-weight:600}
.met .k{font-size:11px;color:var(--dim);margin-top:1px}
.dept .ln{font-size:13px;color:var(--dim);margin-top:6px}
.dept .ln b{color:var(--txt);font-weight:600}
.dept .ceo{color:var(--warn)}
.foot{text-align:center;color:var(--dim);font-size:12px;padding:16px 0 4px}

/* the detail: a full page over the list, the page itself scrolls (no nested scroller) */
#detail{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#detail.on{display:block}
#detail .bar{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
 padding:calc(8px + env(safe-area-inset-top)) 10px 8px;z-index:2}
#detail .bar button{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--dim)}
#detail .bar .h{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#detail .body{padding:14px 16px;max-width:760px;margin:0 auto}
#detail h1{font-size:21px;line-height:1.3;letter-spacing:-.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h3{font-size:11px;letter-spacing:1.8px;font-weight:700;color:var(--dim);margin-bottom:8px}
.card p{font-size:15px;line-height:1.6}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.card .kv span{color:var(--dim);white-space:nowrap}
.card .li{padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.card .li:first-of-type{border-top:0;padding-top:0}
.card .li .t{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.card .li.ok b{color:var(--ok)}.card .li.no b{color:var(--warn)}
.stline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--dim)}
.stline .dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.stline.ok .dot{background:var(--ok)}.stline.ok .lbl{color:var(--ok);font-weight:600}
.stline.warn .dot{background:var(--warn)}.stline.warn .lbl{color:var(--warn);font-weight:600}
.chatLink{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;margin-top:4px}

/* bottom nav: Chat · Command Center · History · Settings — nothing else */
#bottom{position:fixed;inset-inline:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);z-index:10;
 padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#bottom .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:760px;margin:0 auto}
#bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:7px 4px 5px;border-radius:var(--rs);color:var(--dim);font-size:11.5px;line-height:1.2;white-space:nowrap}
#bottom a.on{color:var(--acc);background:var(--accSoft);font-weight:600}

@media(min-width:800px){
 #topbar{padding-inline:calc((100% - 760px)/2 + 16px)}
 #domains{padding-inline:calc((100% - 760px)/2 + 10px)}
}
@media(max-width:430px){
 .sum{gap:6px}.sum button{padding:9px 8px 8px;min-height:74px}.sum b{font-size:22px}
 .row{padding:11px 10px 10px;gap:8px}
 .row .pr{min-width:56px}.row .pr .bar{width:56px}.row .pr .stage{max-width:84px}
 .feat{padding:12px 12px 10px;gap:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>

<div id="login"><div class="card"><div class="brandRow"><span class="orb sm"></span><h1>Fresco</h1></div>
<p class="dim" id="lt">קוד הכניסה של מרכז הפיקוד</p>
<input id="code" type="password" placeholder="קוד">
<button id="lb">כניסה</button>
<p class="dim" id="le" style="margin-top:8px"></p></div></div>

<div id="app">
<header id="topbar">
 <a class="brand" href="index.html" aria-label="Fresco Command Center"><span class="mark"></span><div><b>Fresco</b><span>Command Center</span></div></a>
 <div id="when"><div class="d" id="whenD"></div><div class="t" id="whenT"></div></div>
 <div class="tools">
  <button id="searchBtn" title="חיפוש" aria-label="חיפוש"></button>
  <button id="bellBtn" title="דורש אותך" aria-label="דורש אותך"></button>
  <a href="lia.html" title="LIA — שיחה" aria-label="LIA — שיחה"><span class="orb md"></span></a>
 </div>
</header>
<div id="search"><input id="q" type="search" placeholder="חיפוש בעבודה הפעילה…" aria-label="חיפוש"></div>
<nav id="domains" aria-label="תחומים"></nav>
<main id="m"></main>
<nav id="bottom" aria-label="ניווט"><div class="in" id="bottomIn"></div></nav>
</div>

<div id="detail" role="dialog" aria-modal="true">
 <div class="bar"><button id="back" aria-label="חזרה"></button><div class="h" id="dh"></div></div>
 <div class="body" id="db"></div>
</div>

<script>
var API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/command-center?api=1';
var CHAT='lia.html';
var CC_BUILD='2026-09-28.3';
var B=function(q){return document.querySelector(q)};
/* One code for both surfaces: the chat stores it as lia_code and sends it on the
   same header to the same function, so a login there is a login here. */
var CODE_FROM='';
function code(){
  try{var s=sessionStorage.getItem('fc');if(s){CODE_FROM='fc';return s;}
      var l=localStorage.getItem('lia_code');if(l){CODE_FROM='lia_code';return l;}}catch(e){}
  CODE_FROM='';return '';
}
function api(b,auth){
  var h={'Content-Type':'application/json'};
  if(auth!==false)h['x-fresco-code']=code();
  b=Object.assign({surface:'command-center',client_build:CC_BUILD},b||{});
  return fetch(API,{method:'POST',headers:h,body:JSON.stringify(b)}).then(function(r){
    if(r.status===401){try{sessionStorage.removeItem('fc');if(CODE_FROM==='lia_code')localStorage.removeItem('lia_code');}catch(e){}location.reload();}
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.json();});
}
// Same command-center capability router the chat uses (action:'cap') — one
// state, read the same way from either interface.
function cap(name,args){return api({action:'cap',name:name,args:args||{}});}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,function(c){
  return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':'&quot;';});}

/* ── icons: one stroke set, currentColor ─────────────────────────────────── */
var I={
 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
 sales:'<path d="M5 20v-6M11 20V6M17 20v-9"/><path d="M3 20h18"/>',
 marketing:'<path d="M3 10v4h3l8 5V5L6 10H3z"/><path d="M17 9a4 4 0 0 1 0 6"/>',

/* ── DOMAINS: which department keys and package kinds each one gathers ─────
   Attribution comes from the tower (a department's own goal-word match on the
   package, the project a package is linked to) and from the package's kind;
   a row that none of them claims stays in the overview only, and the overview
   says how many those are — it never guesses a domain. */
var DOMAINS=[
 {key:'overview',he:'סקירה',icon:'home'},
 {key:'sales',he:'מכירות',icon:'sales',depts:['sales']},
 {key:'marketing',he:'שיווק',icon:'marketing',depts:['marketing','branding','advertising']},
 {key:'matriya',he:'מטריאה',icon:'matriya',depts:['rnd']},
 {key:'operations',he:'תפעול',icon:'operations',depts:['operations','purchasing','capital'],kinds:['engineering','maintenance','stabilization']}
];

/* ── TRUTHFUL STATE — pure derivation over the fields the row already carries.
   (test-command-center.mjs extracts everything between CC_STATE_BEGIN and
   CC_STATE_END and drives it directly.) */
/* CC_STATE_BEGIN */
var STATE_HE={QUEUED:'בתור',RUNNING:'רץ',WAITING_INTERNAL:'ממתין — פנימי',WAITING_EXTERNAL:'ממתין לגורם חיצוני',
 WAITING_APPROVAL:'מחכה להכרעה שלך',DONE:'הושלם',FAILED:'נכשל',CANCELLED:'בוטל'};
var DISP_HE={NEEDS_DAVID_DECISION:'חונה להכרעת דוד',PLANNER_NOT_CONVERGED:'חונה — התכנון לא התכנס'};
var LEGACY={RETRYING:'WAITING_INTERNAL',BLOCKED:'WAITING_INTERNAL',OPEN:'QUEUED',PENDING:'QUEUED',NEW:'QUEUED',PAUSED:'WAITING_INTERNAL',
 PARKED:'WAITING_INTERNAL',SUPERSEDED:'CANCELLED',DUPLICATE:'CANCELLED',STALE:'CANCELLED',FIXED:'DONE',COMPLETED:'DONE',CLOSED:'DONE'};
function stateOf(r){
  var s=String((r&&r.state)||'').toUpperCase().trim();
  if(STATE_HE[s])return s;
  var raw=String((r&&r.status)||'').toUpperCase().trim();
  return STATE_HE[raw]?raw:(LEGACY[raw]||'UNKNOWN');
}
function isTerminal(st){return st==='DONE'||st==='FAILED'||st==='CANCELLED';}
/* THE CLOSURE IS THE SERVER'S (Work Product Contract, 28.9). Runtime owns truth,
   work_status exposes it as row.closure, this page renders it: the DONE word,
   whether the product exists, who verified it and whether that was required,
   the honest N/M, what David receives. The page infers none of it — a row
   without a closure (an older server) shows "הושלם" and says the verification
   state did not arrive, never a guess. EXECUTION COMPLETE (the product read
   back) is not VERIFIED COMPLETE (someone other than the worker checked it). */
function closureOf(r){return (r&&r.closure&&typeof r.closure==='object'&&r.closure.key)?r.closure:null;}
var CLOSURE_TONE={DONE_VERIFIED:'ok',DONE_COMPLETE:'dim',DONE_UNVERIFIED:'warn',DONE_HOLLOW:'warn'};
var CLOSURE_NOTE={DONE_COMPLETE:'התוצר קיים · לא נדרש אימות עצמאי ולא נרשם',DONE_UNVERIFIED:'התוצר קיים · נדרש אימות עצמאי ולא נרשם'};
function verifiedOf(r){var c=closureOf(r);return !!(c&&c.key==='DONE_VERIFIED');}
function needsDavidOf(r){
  if(!r)return false;
  return stateOf(r)==='WAITING_APPROVAL'||r.approval_required===true||r.parked_for_david===true||r.waiting_on==='david';
}
function tms(s){var n=Date.parse(s||'');return isNaN(n)?0:n;}
function lastActivityMs(r){
  if(!r)return 0;
  return Math.max(tms(r.updated_at),tms(r.heartbeat_at),tms(r.last_checkpoint),tms(r.lease&&r.lease.acquired_at),tms(r.completed_at),tms(r.created_at));
}
function waitText(r){
  var w=r&&r.waiting_on;
  if(typeof w==='string'&&w&&w!=='david'&&w!=='internal'&&w!=='external')return w;
  if(w&&typeof w==='object'){var p=[w.ref,w.condition].filter(Boolean).join(' · ');if(p)return p;}
  return (r&&r.blocker)||null;
}
function deriveRow(r){
  var st=stateOf(r);
  var out={state:st,key:st,label:STATE_HE[st]||'מצב לא ידוע',tone:'dim',needs:false,moving:false,stale:false,verified:null,persisted:false,historical:false,note:null};
  if(isTerminal(st)){
    if(st==='DONE'){var c=closureOf(r);
      if(!c){out.key='DONE_UNKNOWN';out.label='הושלם';out.verified=null;out.note='מצב האימות והתוצר לא הגיע מהשרת';}
      else{var ok=c.key==='DONE_VERIFIED';out.key=ok?'VERIFIED':c.key;out.label=c.label||STATE_HE.DONE;out.tone=CLOSURE_TONE[c.key]||'dim';out.verified=ok;
        if(!ok)out.note=(c.key==='DONE_HOLLOW'?c.presence_detail:CLOSURE_NOTE[c.key])||c.presence_detail||null;}}
    else{out.note=r.outcome||r.blocker||null;}
    return out;
  }
  /* a live label on a retired object is a historical record, not the present */
  if(r&&r.object_state==='EXPIRED'){out.historical=true;}
  if(needsDavidOf(r)){
    out.key='NEEDS_DAVID';out.label='דורש את ההכרעה שלך';out.tone='warn';out.needs=true;
    out.note=(r.parked_for_david&&r.disposition)?(DISP_HE[String(r.disposition).toUpperCase()]||('חונה: '+r.disposition)):(r.blocker||waitText(r)||null);
  }else if(st==='RUNNING'){
    if(r.lease_alive===true&&r.worker_quiet!==true){out.key='MOVING';out.label='בתנועה';out.tone='ok';out.moving=true;out.note=null;}
    else if(r.lease_alive===true){out.key='QUIET';out.label='רץ · אין פעימה מהעובד';out.stale=true;out.note='העובד מחזיק את החבילה ולא דיווח לאחרונה';}
    else{out.key='STALE';out.label='רשום כרץ · אין סימן חיים';out.stale=true;out.note='אין חוזה חי על החבילה — דורש התאמה למציאות';}
  }else if(st==='QUEUED'){
    out.key='QUEUED';out.label=r.blocker?'בתור · חסם רשום':'בתור';out.note=r.blocker||null;out.persisted=!!r.blocker;
  }else if(st==='WAITING_EXTERNAL'){
    out.note=waitText(r);
  }else if(st==='WAITING_INTERNAL'){
    out.note=r.blocker||(r.liveness&&r.liveness.why)||waitText(r)||null;out.persisted=!!r.blocker;
  }else{
    out.key='UNKNOWN';out.label='מצב לא ידוע';out.note='הסטטוס השמור: '+String((r&&r.status)||'—');
  }
  if(out.historical)out.label+=' · רשומה היסטורית';
  return out;
}
/* PROGRESS: N/M only from the closure's real denominator — acceptance criteria,
   or plan steps a worker actually maintains (the server decides which). No
   denominator → the stage it is on, as text — never an invented number. */
function progressOf(r){
  var c=closureOf(r),p=c&&c.progress;
  if(p&&typeof p.total==='number'&&p.total>0&&typeof p.done==='number'){
    var pct=Math.max(0,Math.min(100,Math.round(p.done/p.total*100)));
    return {pct:pct,text:p.done+'/'+p.total,source:String(p.source||'')};
  }
  return null;
}
function stageOf(r){
  var s=String((r&&r.current_step)||'').replace(/\s+/g,' ').trim();
  if(s)return s.length>48?s.slice(0,47)+'…':s;
  var st=stateOf(r);
  return STATE_HE[st]||null;
}
function milestonesOf(r){
  var p=progressOf(r);if(!p)return [];
  var acc=p.source==='ACCEPTANCE';
  var it=(Array.isArray(r&&r.items)?r.items:[]).filter(function(x){var id=String((x&&x.id)||'');var s=String((x&&x.status)||'').toUpperCase();
    return acc?id.indexOf('acc:')===0:(id.indexOf('acc:')!==0&&s!=='SUPERSEDED');});
  if(it.length<2||it.length>8)return [];
  var cur=-1;
  var out=it.map(function(x,i){var s=String((x&&x.status)||'').toUpperCase();var done=!(s===''||s==='OPEN'||s==='PENDING');
    if(!done&&cur<0)cur=i;return {label:String((x&&(x.title||x.label||x.id))||'').slice(0,14),done:done,cur:false};});
  if(cur>=0)out[cur].cur=true;
  return out;
}
function ago(ms,now){
  var d=(now-ms)/1000;
  if(!ms||!isFinite(d)||d<0)return '';
  if(d<60)return 'עכשיו';
  var m=Math.round(d/60);if(m<60)return 'לפני '+m+' דק׳';
  var h=Math.round(m/60);if(h<24)return 'לפני '+h+' שע׳';
  var dd=Math.round(h/24);if(dd===1)return 'אתמול';if(dd===2)return 'לפני יומיים';
  return 'לפני '+dd+' ימים';
}
/* ATTRIBUTION: department keys per package (from the tower's own matching and
   the project link), then the domain buckets. */
function attribution(tower){
  var dept={},proj={};
  ((tower&&tower.departments)||[]).forEach(function(d){
    var aw=d&&d.management&&d.management.active_work;if(!aw)return;
    var ids=Array.isArray(aw.ids)?aw.ids:(aw.top||[]).map(function(t){return t&&t.id8;});
    ids.forEach(function(id8){if(!id8)return;(dept[id8]=dept[id8]||[]).push(d.key);});
  });
  ((tower&&tower.projects)||[]).forEach(function(p){
    var dom=String((p&&p.domain)||'UNCLASSIFIED');if(dom==='UNCLASSIFIED')return;
    (((p&&p.work)&&p.work.linked)||[]).forEach(function(w){proj[String(w||'').slice(0,8)]=dom;});
  });
  return {dept:dept,proj:proj};
}
function bucketsOf(r,att){
  var id8=String((r&&r.work_id)||'').slice(0,8);
  var depts=((att&&att.dept&&att.dept[id8])||[]).slice();
  var pd=att&&att.proj&&att.proj[id8];if(pd)depts.push(pd);
  var kind=String((r&&r.kind)||'').toLowerCase();
  var out=[];
  DOMAINS.forEach(function(d){
    if(!d.depts)return;
    var byDept=d.depts.some(function(k){return depts.indexOf(k)>=0;});
    var byKind=!!(d.kinds&&d.kinds.indexOf(kind)>=0);
    if(byDept||byKind)out.push(d.key);
  });
  return out;
}
var ORDER={NEEDS_DAVID:0,MOVING:1,QUIET:2,STALE:2,WAITING_EXTERNAL:3,WAITING_INTERNAL:3,QUEUED:4,UNKNOWN:5};
function sortRows(rows){
  return rows.slice().sort(function(a,b){
    var da=deriveRow(a),dbb=deriveRow(b);
    var oa=ORDER[da.key]==null?6:ORDER[da.key],ob=ORDER[dbb.key]==null?6:ORDER[dbb.key];
    if(oa!==ob)return oa-ob;
    return lastActivityMs(b)-lastActivityMs(a);
  });
}
function startOfToday(now){var d=new Date(now);d.setHours(0,0,0,0);return d.getTime();}
/* THE SUMMARY: active · needs him · moving · finished today (verified) */
function summarize(alive,closed,extraNeeds,now){
  var live=(alive||[]).filter(function(r){return !isTerminal(stateOf(r));});
  var needs=0,moving=0,stale=0;
  live.forEach(function(r){var d=deriveRow(r);if(d.needs)needs++;if(d.moving)moving++;if(d.stale)stale++;});
  var t0=startOfToday(now),doneToday=0,doneUnverified=0;
  (closed||[]).forEach(function(r){if(stateOf(r)!=='DONE')return;if(tms(r.completed_at)<t0)return;if(verifiedOf(r))doneToday++;else doneUnverified++;});
  return {active:live.length,needs:needs+(extraNeeds||0),moving:moving,stale:stale,done_today:doneToday,done_today_unverified:doneUnverified};
}
/* CC_STATE_END */

/* ── state ───────────────────────────────────────────────────────────────── */
var D={tower:null,alive:[],closed:[],at:0,att:{dept:{},proj:{}}};

function rowsOf(x){return (x&&Array.isArray(x.rows))?x.rows:[];}
function isoDaysAgo(n){return new Date(Date.now()-n*864e5).toISOString();}
function fetchAll(){
  return Promise.all([api({action:'tower'}),cap('work_status'),cap('work_status',{closed_since:isoDaysAgo(7)})]).then(function(a){

/* ── render ──────────────────────────────────────────────────────────────── */
function matchesQ(r){
  if(!Q)return true;var q=Q.toLowerCase();
  return [r.objective,r.goal,r.current_step,r.next_step,r.blocker,r.kind].some(function(s){return String(s||'').toLowerCase().indexOf(q)>=0;});
}
function inView(r){
  if(VIEW==='overview')return true;
  return bucketsOf(r,D.att).indexOf(VIEW)>=0;
}
function render(){
  if(!D.tower)return;
  var now=Date.now(),T=D.tower;
  var alive=D.alive.filter(function(r){return !isTerminal(stateOf(r));}).filter(inView).filter(matchesQ);
  var closed=D.closed.filter(inView).filter(matchesQ).sort(function(a,b){return tms(b.completed_at)-tms(a.completed_at);});
  var approvals=VIEW==='overview'?(T.approvals||[]):[];
  var alerts=VIEW==='overview'?(T.alerts||[]).filter(function(al){return al.state!=='resolved';}):[];
  var needsRows=alive.filter(function(r){return deriveRow(r).needs;});
  var needsCount=needsRows.length+approvals.length+alerts.length;
  var sum=summarize(alive,closed,approvals.length+alerts.length,now);
  var dom=DOMAINS.filter(function(d){return d.key===VIEW;})[0]||DOMAINS[0];
  var h='';

  /* bell: what needs him right now */
  var allNeeds=D.alive.filter(function(r){return deriveRow(r).needs;}).length+(T.approvals||[]).length+(T.alerts||[]).filter(function(al){return al.state!=='resolved';}).length;
  B('#bellBtn').innerHTML=ic('bell')+(allNeeds?'<span class="badge">'+allNeeds+'</span>':'');

  /* 1. the summary */
  var tot=Math.max(sum.active,1);
  h+='<div class="sum">'
    +tile('active',sum.active,'פעילות',1,'')
    +tile('needs',sum.needs,'דורשות אותך',sum.needs/tot,sum.needs?'warn':'quiet')
    +tile('moving',sum.moving,'בתנועה',sum.moving/tot,sum.moving?'ok':'quiet')
    +tile('done',sum.done_today,'הושלמו היום · אומת',sum.done_today?1:0,sum.done_today?'ok':'quiet')
    +'</div>';
  if(sum.stale)h+='<p class="note">'+sum.stale+(sum.stale===1?' חבילה רשומה כרצה ללא סימן חיים':' חבילות רשומות כרצות ללא סימן חיים')+' — אינן נספרות כתנועה</p>';
  if(sum.done_today_unverified)h+='<p class="note">+'+sum.done_today_unverified+' הושלמו היום ללא אימות — לא בירוק</p>';

  /* 2. the domain's own strip (drill-down only) */
  if(dom.depts){
    var depts=(T.departments||[]).filter(function(d){return dom.depts.indexOf(d.key)>=0;});
    if(depts.length){
      h+='<div class="sec"><h2>מצב התחום</h2><span class="dim">'+esc(depts.map(function(d){return d.name;}).join(' · '))+'</span></div>';
      h+=depts.map(deptCard).join('');
    }
    var projs=(T.projects||[]).filter(function(p){return dom.depts.indexOf(String(p.domain||''))>=0;});
    if(projs.length){
      h+='<div class="sec"><h2>פרויקטים</h2><span class="dim">'+projs.length+'</span></div>';
      h+=projs.map(function(p){return '<div class="dept"><div class="top"><div class="nm">'+esc(p.name)+'</div><span class="tag">'+esc(p.state||'—')+'</span></div>'
        +(p.goal?'<div class="ln"><b>מטרה</b> · '+esc(p.goal)+'</div>':'')
        +(p.next_action?'<div class="ln"><b>הבא</b> · '+esc(p.next_action)+'</div>':'')
        +(p.waiting_on&&p.waiting_on!=='—'?'<div class="ln ceo">ממתין ל: '+esc(p.waiting_on)+'</div>':'')+'</div>';}).join('');
    }
  }

  /* 3. NEEDS DAVID — the section exists only while something is his */
  if(needsCount){
    h+='<div class="sec" id="needs"><h2>דורש את ההכרעה שלך</h2><span class="dim">'+needsCount+'</span></div>';
    h+=sortRows(needsRows).map(function(r){return featCard(r,now);}).join('');
    h+=approvals.map(function(r,i){
      return '<div class="appr" id="ap'+i+'"><div class="claim">'+esc(r.claim)+'</div>'
        +'<div class="why">'+esc(r.project_name||'')+(r.confidence_label?' <span class="tag">'+esc(r.confidence_label)+'</span>':'')+'</div>'
        +(r.why_now?'<div class="why">'+esc(r.why_now)+'</div>':'')
        +'<div class="btns"><button class="b-ok" data-a="approved" data-i="'+i+'">אשר</button>'
        +'<button class="b-ed" data-a="edit" data-i="'+i+'">תקן</button>'
        +'<button class="b-no" data-a="rejected" data-i="'+i+'">דחה</button></div></div>';
    }).join('');
    h+=alerts.map(function(al){
      return '<div class="appr"><div class="claim">'+esc(al.title)+'</div>'
        +(al.detail?'<div class="why">'+esc(al.detail)+'</div>':'')
        +'<div class="why"><span class="tag warn">'+esc(al.severity||'')+'</span> <span class="tag">'+esc(al.state)+'</span></div>'
        +(al.state==='acknowledged'?'':'<div class="btns"><button class="b-ed alertAck" data-id="'+esc(al.alert_id)+'">אישרתי</button></div>')
        +'</div>';
    }).join('');
  }

  /* 4. active work */
  var active=sortRows(alive.filter(function(r){return !deriveRow(r).needs;}));
  h+='<div class="sec"><h2>עבודה פעילה</h2><span class="dim">'+active.length+(needsRows.length?' + '+needsRows.length+' למעלה':'')+'</span></div>';
  if(!active.length)h+='<div class="empty">'+(Q?'אין עבודה פעילה שתואמת את החיפוש':needsRows.length?'כל העבודה הפעילה בתחום מחכה להכרעה שלך':'אין עבודה פעילה'+(VIEW==='overview'?'':' בתחום הזה'))+'</div>';
  else h+=active.map(function(r){return workRow(r,now);}).join('');
  if(VIEW==='overview'){
    var un=D.alive.filter(function(r){return !isTerminal(stateOf(r))&&!bucketsOf(r,D.att).length;}).length;
    if(un)h+='<p class="note">'+un+(un===1?' חבילה ללא שיוך לתחום':' חבילות ללא שיוך לתחום')+' — מוצגות כאן בלבד</p>';
  }

  /* 5. recently completed — green only when verified */
  h+='<div class="sec"><h2>הושלמו לאחרונה</h2><span class="dim">7 ימים · '+closed.length+'</span></div>';
  if(!closed.length)h+='<div class="empty">לא נסגרה עבודה בשבעת הימים האחרונים'+(VIEW==='overview'?'':' בתחום הזה')+'</div>';
  else h+=closed.slice(0,12).map(function(r){return doneRow(r,now);}).join('');

  h+='<p class="foot">עודכן '+esc(new Date(D.at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}))+' · מהמצב השמור, לא מהשיחה · build '+CC_BUILD+'</p>';
  B('#m').innerHTML=h;

  Array.prototype.forEach.call(B('#m').querySelectorAll('[data-open]'),function(b){b.onclick=function(){openDetail(b.getAttribute('data-open'));};});
  Array.prototype.forEach.call(B('#m').querySelectorAll('.btns button[data-a]'),function(b){b.onclick=function(){decide(b.getAttribute('data-a'),Number(b.getAttribute('data-i')),b);};});
  Array.prototype.forEach.call(B('#m').querySelectorAll('.alertAck'),function(b){b.onclick=function(){ackAlert(b.getAttribute('data-id'),b);};});
  Array.prototype.forEach.call(B('#m').querySelectorAll('.sum button'),function(b){b.onclick=function(){var t=document.getElementById(b.getAttribute('data-to'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});};});
}
function tile(k,n,label,frac,tone){
  var to=k==='needs'?'needs':k==='done'?'done':'active';
  return '<button class="'+tone+'" data-to="'+to+'"><div><b>'+n+'</b><div class="k">'+esc(label)+'</div></div>'
    +'<div class="bar"><i style="width:'+Math.round(Math.max(0,Math.min(1,frac||0))*100)+'%"></i></div></button>';
}
function stLine(d,r,now){
  var when=ago(lastActivityMs(r),now);
  return '<div class="st '+d.tone+'"><span class="dot"></span><span class="lbl">'+esc(d.label)+'</span>'
    +(when?'<span class="sep">·</span><span>עודכן '+esc(when)+'</span>':'')+'</div>';
}
function prCell(r){
  var p=progressOf(r);
  if(p)return '<div class="pr"><b>'+p.pct+'%</b><div class="bar"><i style="width:'+p.pct+'%"></i></div></div>';
  var s=stageOf(r);
  return s?'<div class="pr"><span class="stage" title="'+esc(s)+'">'+esc(s)+'</span></div>':'<div class="pr"></div>';
}
function workRow(r,now){
  var d=deriveRow(r);
  return '<button class="row'+(d.tone==='warn'?' warn':'')+(d.historical?' hist':'')+'" data-open="'+esc(r.work_id)+'">'
    +'<div class="ic">'+ic(kindIcon(r.kind))+'</div>'
    +'<div><div class="ttl">'+esc(r.objective||r.goal||r.work_id)+'</div>'
    +(d.note||r.goal?'<div class="sub">'+esc(d.note||r.goal)+'</div>':'')
    +stLine(d,r,now)+'</div>'
    +prCell(r)+'<div class="chev">'+ic('chev',20)+'</div></button>';
}
function featCard(r,now){
  var d=deriveRow(r),p=progressOf(r),ms=milestonesOf(r);
  return '<button class="feat" data-open="'+esc(r.work_id)+'">'
    +'<div class="ic">'+ic(kindIcon(r.kind))+'</div>'
    +'<div><div class="sig">דורש את ההכרעה שלך</div><div class="ttl">'+esc(r.objective||r.goal||r.work_id)+'</div>'
    +(r.goal&&r.goal!==r.objective?'<div class="sub">'+esc(r.goal)+'</div>':(r.current_step?'<div class="sub">'+esc(r.current_step)+'</div>':''))+'</div>'
    +(p?'<div class="pct">'+p.pct+'%</div>':(stageOf(r)?'<div class="stage">'+esc(stageOf(r))+'</div>':'<div></div>'))
    +(ms.length?'<div class="ms">'+ms.map(function(m){return '<div class="m'+(m.done?' done':'')+(m.cur?' cur':'')+'"><i></i><span>'+esc(m.label)+'</span></div>';}).join('')+'</div>':'')
    +'<div class="foot"><span>'+esc(['עודכן '+ago(lastActivityMs(r),now),d.note].filter(Boolean).join(' · '))+'</span><span class="go">פתח</span></div>'
    +'</button>';
}
function doneRow(r,now){
  var d=deriveRow(r),t=tms(r.completed_at);
  var when=t?(t>=startOfToday(now)?new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})):'';
  return '<button class="row done'+(d.verified?' ok':'')+'" data-open="'+esc(r.work_id)+'">'
    +'<div class="ic">'+(d.verified?ic('check'):ic('circle'))+'</div>'
    +'<div><div class="ttl">'+esc(r.objective||r.goal||r.work_id)+'</div>'
    +'<div class="st '+d.tone+'"><span class="dot"></span><span class="lbl">'+esc(d.label)+'</span></div></div>'
    +'<div class="when">'+esc(when)+'</div><div class="chev">'+ic('chev',20)+'</div></button>';
}
function deptCard(d){
  var m=d.management||{};
  var mets=(d.metrics||[]).map(function(x){var na=(x.value==='MISSING'||x.value==='לא-מדיד');
    return '<div class="met"><div class="v'+(na?' na':'')+'">'+esc(x.value)+'</div><div class="k">'+esc(x.label)+'</div></div>';}).join('');
  return '<div class="dept"><div class="top"><div class="nm">'+esc(d.name)+'</div><span class="tag">'+esc(d.state)+'</span></div>'
    +'<div class="mets">'+mets+'</div>'
    +(m.blocker?'<div class="ln"><b>חסם</b> · '+esc(m.blocker)+'</div>':'')
    +(m.next_action?'<div class="ln"><b>הבא</b> · '+esc(m.next_action)+'</div>':'')
    +(m.needs_david?'<div class="ln ceo">דורש החלטה שלך: '+esc(m.needs_david)+'</div>':'')
    +'</div>';
}

/* ── detail: goal · milestones · current step · evidence · blockers · history · next · artifacts */
function findRow(id){
  var all=D.alive.concat(D.closed);
  for(var i=0;i<all.length;i++)if(all[i].work_id===id)return all[i];
  return null;
}
function fmt(s){if(!s)return '—';var t=tms(s);return t?new Date(t).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):String(s);}
function openDetail(id){
  var r=findRow(id);if(!r)return;
  var d=deriveRow(r),p=progressOf(r),ms=milestonesOf(r),now=Date.now();
  var sc=r.scope||{};
  var h='<h1>'+esc(r.objective||r.goal||r.work_id)+'</h1>'
    +'<div class="stline '+d.tone+'"><span class="dot"></span><span class="lbl">'+esc(d.label)+'</span><span>·</span><span>'+esc(r.kind||'')+'</span>'
    +(ago(lastActivityMs(r),now)?'<span>·</span><span>עודכן '+esc(ago(lastActivityMs(r),now))+'</span>':'')+'</div>';
  if(d.note)h+='<p class="note" style="margin-top:6px">'+esc(d.note)+(d.persisted?' <span class="tag">תווית שמורה על השורה</span>':'')+'</p>';

  h+='<div class="card"><h3>המטרה</h3><p>'+esc(sc.original_goal||r.goal||r.objective||'—')+'</p>'
    +(r.success_condition?'<p class="dim" style="margin-top:6px">תנאי הצלחה: '+esc(r.success_condition)+'</p>':'')+'</div>';

  h+='<div class="card"><h3>איפה זה עומד</h3>';
  if(p)h+='<p><b>'+p.pct+'%</b> · '+esc(p.text)+(p.source==='ACCEPTANCE'?' קריטריוני קבלה אומתו':' צעדים הושלמו')+'</p>';
  else h+='<p class="dim">אין אחוז — אין מכנה אמיתי (קריטריוני קבלה או צעדים שמתוחזקים); מוצג השלב.</p>';
  if(ms.length)h+='<div class="ms" style="margin-top:10px">'+ms.map(function(m){return '<div class="m'+(m.done?' done':'')+(m.cur?' cur':'')+'"><i></i><span>'+esc(m.label)+'</span></div>';}).join('')+'</div>';
  h+='<div class="kv" style="margin-top:10px"><span>השלב הנוכחי</span><div>'+esc(r.current_step||'—')+'</div>'
    +'<span>הפעולה הבאה</span><div>'+esc(r.next_step||sc.next||'—')+'</div>'
    +'<span>בעלים</span><div>'+esc(r.owner||'—')+(r.worker?' · '+esc(r.worker):'')+'</div></div></div>';

  var req=Array.isArray(sc.required)?sc.required:[],rem=Array.isArray(sc.remaining)?sc.remaining:[],bl=Array.isArray(sc.blocked)?sc.blocked:[];
  if(req.length>1||bl.length){
    h+='<div class="card"><h3>מידות המטרה</h3>';
    h+=req.map(function(x){var open=rem.indexOf(x)>=0;var b=bl.filter(function(y){return y.dimension===x;})[0];
      return '<div class="li'+(b?' no':open?'':' ok')+'"><b>'+(b?'חסום':open?'פתוח':'הושלם')+'</b> · '+esc(x)+(b?'<div class="t">'+esc(b.reason)+'</div>':'')+'</div>';}).join('');
    if(sc.scope_drift)h+='<p class="dim" style="margin-top:6px">סטיית היקף: '+esc(sc.why||'')+'</p>';
    h+='</div>';
  }

  var bls=[];if(r.blocker)bls.push({t:r.blocker,src:'blocker'});
  var wt=waitText(r);if(wt&&wt!==r.blocker)bls.push({t:wt,src:'waiting_on'});
  if(r.liveness&&r.liveness.missing&&r.liveness.missing.length)bls.push({t:'חסר: '+r.liveness.missing.join(', '),src:'liveness'});
  if(bls.length||d.stale)h+='<div class="card"><h3>חסמים</h3>'+bls.map(function(b){return '<div class="li">'+esc(b.t)+'<div class="t">'+esc(b.src)+(d.persisted&&b.src==='blocker'?' · תווית שמורה, לא אומתה':'')+'</div></div>';}).join('')
    +(d.stale?'<div class="li no"><b>ללא סימן חיים</b> · '+esc(d.note)+'</div>':'')+'</div>';

  h+='<div class="card"><h3>ראיות</h3>';
  var ev=[];
  (r.verifications||[]).forEach(function(v){ev.push({ok:String(v.result||'').toUpperCase()==='PASS',t:'אימות עצמאי · '+esc(v.verifier||'')+' · '+esc(v.result||''),s:[v.kind,v.evidence_ref,fmt(v.at)].filter(Boolean).join(' · ')});});
  if(r.completion_evidence)ev.push({ok:r.completion_evidence.complete===true,t:'ראיית השלמה · '+(r.completion_evidence.complete===true?'שלמה':'לא שלמה'),s:[r.completion_evidence.detail,r.completion_evidence.deliverable_ref,fmt(r.completion_evidence.checked_at)].filter(Boolean).join(' · ')});
  if(r.lease)ev.push({ok:r.lease_alive===true,t:'חוזה על החבילה · '+(r.lease_alive===true?'חי':'פג'),s:[r.lease.worker,r.lease.expires_at?'עד '+fmt(r.lease.expires_at):''].filter(Boolean).join(' · ')});
  if(r.heartbeat_at)ev.push({ok:r.worker_quiet!==true,t:'פעימה אחרונה · '+fmt(r.heartbeat_at),s:''});
  if(r.last_checkpoint)ev.push({ok:true,t:'נקודת ביקורת אחרונה · '+fmt(r.last_checkpoint),s:''});
  if(r.verification_required&&!(r.verifications||[]).length)ev.push({ok:false,t:'נדרש אימות עצמאי — טרם נרשם',s:''});
  if(!ev.length)h+='<p class="dim">אין ראיות על השורה.</p>';
  else h+=ev.map(function(e){return '<div class="li '+(e.ok?'ok':'no')+'"><b>'+(e.ok?'✓':'○')+'</b> '+e.t+(e.s?'<div class="t">'+esc(e.s)+'</div>':'')+'</div>';}).join('');
  h+='</div>';

  var cl=closureOf(r);
  if(cl&&stateOf(r)==='DONE'){
    var dl=cl.delivery||{},pr=cl.product||{};
    var NOTICE_HE={SENT:'נמסרה לך הודעה',PENDING:'ההודעה ממתינה למסירה',FAILED_RETRY:'המסירה נכשלה — תנוסה שוב',NONE:'לא נשלחה הודעה'};
    var VER_HE={ACCEPTANCE:'אומת מול קריטריוני הקבלה',INDEPENDENT:'אומת באימות עצמאי',NONE:'לא אומת באימות עצמאי'};
    h+='<div class="card"><h3>התוצר</h3><div class="kv">'
      +'<span>ביקשת</span><div>'+esc(sc.original_goal||r.goal||r.objective||'—')+'</div>'
      +'<span>הופק</span><div>'+esc(dl.result||(cl.presence==='PRESENT'?'':'—'))+(cl.presence!=='PRESENT'?' <span class="tag">'+esc(cl.presence_detail||'אין תוצר')+'</span>':'')+'</div>'
      +'<span>איפה</span><div>'+(dl.ref?esc(String(dl.ref_kind||pr.kind||'')+': '+dl.ref):esc(pr.declared?'תוצאת החבילה':'תוצאת החבילה / הסיכום שלה'))+'</div>'
      +'<span>אימות</span><div>'+esc((VER_HE[cl.verified_by]||'—')+(cl.verification_required?' · נדרש':' · לא נדרש'))+(cl.evidence_ref?'<div class="t" dir="ltr">'+esc(cl.evidence_ref)+'</div>':'')+'</div>'
      +'<span>מסירה</span><div>'+esc(NOTICE_HE[dl.notice]||'—')+'</div>'
      +'</div></div>';
  }else{
    var art=[];if(r.result)art.push(r.result);if(r.outcome&&r.outcome!==r.result)art.push(r.outcome);
    if(art.length)h+='<div class="card"><h3>תוצרים</h3>'+art.map(function(a){return '<div class="li">'+esc(a)+'</div>';}).join('')+'</div>';
  }

  var steps=Array.isArray(r.steps)?r.steps:[];
  h+='<div class="card"><h3>היסטוריה</h3>';
  if(!steps.length)h+='<p class="dim">אין צעדים רשומים.</p>';
  else h+=steps.slice().reverse().map(function(s){return '<div class="li'+(s.ok===false?' no':'')+'">'+esc(s.step)+(s.note?' — '+esc(s.note):'')+'<div class="t">'+esc(fmt(s.at))+'</div></div>';}).join('')
    +(typeof r.steps_total==='number'&&r.steps_total>steps.length?'<p class="dim" style="margin-top:6px">מוצגים '+steps.length+' מתוך '+r.steps_total+'</p>':'');
  h+='</div>';

  h+='<div class="card"><h3>פרטים</h3><div class="kv">'
    +'<span>נפתח</span><div>'+esc(fmt(r.created_at))+(r.requested_by?' · '+esc(r.requested_by):'')+'</div>'
    +'<span>התחיל</span><div>'+esc(fmt(r.started_at))+'</div>'
    +'<span>נסגר</span><div>'+esc(fmt(r.completed_at))+'</div>'
    +'<span>מזהה</span><div dir="ltr" style="text-align:end">'+esc(String(r.work_id||'').slice(0,8))+'</div>'
    +(r.object_state?'<span>רשומה</span><div>'+(r.object_state==='ACTIVE'?'פעילה':esc(r.object_state)+' · היסטורית')+'</div>':'')
    +'</div></div>';
  h+='<a class="chatLink" href="'+CHAT+'">'+ic('chat',18)+'<span>להמשיך בשיחה עם LIA</span></a>';
  B('#dh').textContent=r.objective||r.goal||'';
  B('#db').innerHTML=h;
  B('#detail').classList.add('on');B('#detail').scrollTop=0;
  document.body.style.overflow='hidden';
}
function closeDetail(){B('#detail').classList.remove('on');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&B('#detail').classList.contains('on'))closeDetail();});

/* ── the tower's own actions, unchanged ─────────────────────────────────── */
function ackAlert(id,btn){
  if(!id)return;
  if(btn){btn.disabled=true;btn.textContent='…';}
  cap('alert_ack',{alert_id:id,action:'acknowledge'})
    .then(fetchAll).then(render)
    .catch(function(e){if(btn){btn.disabled=false;btn.textContent='אישרתי';}alert('שגיאה: '+e.message);});
}
function decide(action,idx,btn){
  var r=(D.tower.approvals||[])[idx];if(!r)return;
  var body={action:'decide',target:'recommendation',id:r.id,decision:action};
  if(action==='edit'){
    var nv=prompt('נסח מחדש את ההמלצה:',r.claim);
    if(nv===null)return;
    nv=nv.trim();
    if(!nv){alert('טקסט ריק — לא נשמר');return;}
    body.claim=nv;
  }
  var row=B('#ap'+idx),all=row?row.querySelectorAll('button'):[];
  for(var i=0;i<all.length;i++)all[i].disabled=true;
  btn.textContent='…';
  api(body).then(fetchAll).then(render)
    .catch(function(e){for(var j=0;j<all.length;j++)all[j].disabled=false;alert('שגיאה: '+e.message);});
}
</script>
