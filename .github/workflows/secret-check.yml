# One-shot diagnostic (26.8): does THIS repo hold LIA_PANEL_CODE?
# Prints secret/variable NAMES only — values are auto-masked. Deleted after use.
name: secret-check
on:
  push:
    branches: [tmp/secret-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: names visible here
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          echo "$ALL_SECRETS" | python3 -c 'import json,sys; print("secret names:", sorted(json.load(sys.stdin).keys()))'
          echo "${ALL_VARS:-{}}" | python3 -c 'import json,sys; print("var names:", sorted((json.load(sys.stdin) or {}).keys()))'
