name: live-probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://shoshan19-prog.github.io/fresco-cc/orna.html?nc=$(date +%s)")
            main=$(curl -s "https://raw.githubusercontent.com/shoshan19-prog/fresco-cc/main/orna.html")
            a=$(echo "$live" | sha256sum | cut -c1-8); b=$(echo "$main" | sha256sum | cut -c1-8)
            echo "live=$a main=$b filePick=$(echo "$live" | grep -c filePick) name=$(echo "$live" | grep -c 'אמה · העוזרת של אורנה')"
            [ "$a" = "$b" ] && exit 0
            sleep 30
          done
          exit 1
