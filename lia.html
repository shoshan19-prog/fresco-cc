<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>LIA · פנקס</title><style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a303c;--txt:#e8eaf0;--dim:#8b93a5;--acc:#5b9dff;--ok:#3fbf7f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,'Segoe UI',sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:20px;margin-bottom:2px}.dim{color:var(--dim);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
textarea,input{width:100%;background:#12151b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer;margin-inline-start:6px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.obj{border-top:1px solid var(--line);padding:10px 0}.obj:first-child{border-top:0}
.badge{font-size:11px;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--dim)}
.badge.CANONICAL{color:var(--ok);border-color:var(--ok)}.badge.CORROBORATED{color:var(--acc);border-color:var(--acc)}
.quote{margin:4px 0;font-size:15px}.meta{font-size:12px;color:var(--dim)}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stat b{font-size:22px;display:block}
pre{background:#12151b;border-radius:8px;padding:10px;font-size:11px;overflow-x:auto;direction:ltr;text-align:left}
#login{max-width:360px;margin:80px auto}</style></head><body>
<div id="login" class="card"><h1>LIA</h1><p class="dim">קוד הכניסה של מרכז הפיקוד</p>
<div class="row"><input id="code" type="password" placeholder="קוד"><button onclick="login()">כניסה</button></div></div>
<div id="app" style="display:none">
<h1>LIA · פנקס ההצעות</h1><p class="dim" id="sub">Build 1 · פרודקשן</p>
<div class="card"><b>ספר ל-LIA</b><p class="dim">משפט חופשי — הבטחה, החלטה, משימה. נשמר לתור ומעובד בריצת inbox הבאה במחשב.</p>
<textarea id="note" rows="2" placeholder="דיברתי עם … אמרתי שאשלח … עד יום …"></textarea>
<div class="row"><button onclick="sendNote()">שמור פתק</button><span class="dim" id="noteStat"></span></div></div>
<div class="card"><b>התקנת ה-Bridge במחשב</b><p class="dim">הורד פעם אחת, שמור, ולחץ פעמיים. הוא מוצא את תיקיית פרסקו לבד ומתקין.</p><div class="row"><button onclick="getInstaller()">הורד את המתקין</button><span class="dim" id="instStat"></span></div></div>
<div class="card"><div class="stats" id="stats"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>התור הפעיל</b>
<span><button class="ghost" onclick="runExpire()">נקה פגי-תוקף</button><button class="ghost" onclick="load()">רענן</button></span></div>
<div id="queue"></div></div>
<div class="card" id="auditCard" style="display:none"><b>ראיות ומסלול</b><pre id="audit"></pre></div>
</div><script>
const API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
let CODE=localStorage.getItem('lia_code')||'';
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-fresco-code':CODE},body:JSON.stringify(b)});if(r.status===401){localStorage.removeItem('lia_code');location.reload();}return r.json();}
async function login(){CODE=document.getElementById('code').value.trim();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-fresco-code':CODE},body:'{"action":"state"}'});if(r.ok){localStorage.setItem('lia_code',CODE);boot(await r.json());}else alert('קוד שגוי');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function boot(st){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render(st);if(!window._liaPoll){window._liaPoll=setInterval(()=>{if(CODE)load().catch(()=>{});},8000);}}
async function load(){try{render(await api({action:'state'}));}catch(e){}}
function render(st){
 const S=document.getElementById('stats');
 S.innerHTML='<div class="stat"><b>'+st.counts.active+'</b><span class="dim">פעילים</span></div>'
 +'<div class="stat"><b>'+st.counts.canonical+'</b><span class="dim">מאושרים</span></div>'
 +'<div class="stat"><b>'+st.counts.pending_notes+'</b><span class="dim">פתקים לעיבוד</span></div>'
 +'<div class="stat"><b>'+st.counts.expired+'</b><span class="dim">פגו (audit נשמר)</span></div>';
 const Q=document.getElementById('queue');
 Q.innerHTML=st.queue.length?'':'<p class="dim" style="margin-top:8px">התור ריק — ספר ל-LIA משהו, או הרץ inbox במחשב.</p>';
 for(const o of st.queue){const d=(o.payload.fields||{}).deadline||(o.payload.fields||{}).due;
  Q.innerHTML+='<div class="obj"><span class="badge '+o.verification_state+'">'+o.verification_state+'</span> '
  +'<span class="badge">'+o.object_type+'</span>'+(d?' <span class="badge">עד '+d+'</span>':'')
  +'<p class="quote">„'+esc(o.payload.quote)+'”</p>'
  +'<div class="row"><button onclick="confirmObj(\''+o.id+'\')">אישור</button>'
  +'<button class="ghost" onclick="showAudit(\''+o.id+'\')">ראיות</button>'
  +'<span class="meta">'+o.id.slice(0,8)+' · '+(o.payload.speaker||'')+'</span></div></div>';}
}
async function confirmObj(id){await api({action:'confirm',id});await load();}
async function runExpire(){const r=await api({action:'expire'});document.getElementById('sub').textContent=r.expired+' הועברו ל-EXPIRED (audit נשמר)';await load();}
async function showAudit(id){const r=await api({action:'audit',id});document.getElementById('auditCard').style.display='block';document.getElementById('audit').textContent=JSON.stringify(r,null,1);}
async function sendNote(){const t=document.getElementById('note').value.trim();if(!t)return;await api({action:'note',text:t});document.getElementById('note').value='';document.getElementById('noteStat').textContent='נשמר לתור ✓';await load();}
async function getInstaller(){const s=document.getElementById('instStat');s.textContent='מוריד…';
const r=await fetch(API+'&install=1',{headers:{'x-fresco-code':CODE}});
if(!r.ok){s.textContent='שגיאה';return;}const b=await r.blob();const u=URL.createObjectURL(b);
const a=document.createElement('a');a.href=u;a.download='install-david-bridge.bat';document.body.appendChild(a);a.click();
a.remove();URL.revokeObjectURL(u);s.textContent='ירד ✓ שמור ולחץ פעמיים';}
if(CODE){api({action:'state'}).then(boot).catch(()=>{});}
</script></body></html>
