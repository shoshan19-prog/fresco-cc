<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIA</title>
<link rel="manifest" href="lia.webmanifest">
<link rel="icon" type="image/png" href="lia-icon-192.png">
<link rel="apple-touch-icon" href="lia-icon-180.png">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LIA"><style>
/* ── LIA — Executive AI Operating System ─────────────────────────────────────
   Shell only. Every id, class and handler the logic touches is preserved; what
   changed is structure, colour, depth and rhythm.

   TWO PRODUCTS, ONE FILE (David, 25.8): the desktop is a COMMAND CENTER —
   three zones, today on the right-lead, the conversation in the middle, live
   systems and activity on the far side — and the phone is an EXECUTIVE
   ASSISTANT: one column, compact answer, sticky composer, evidence in a bottom
   sheet. The previous pass stretched the phone layout across the desktop and it
   read as a log viewer. It no longer does. */
:root{
 --bg:#f7f8fa;--bg2:#ffffff;
 --card:#ffffff;--card2:#f2f4f7;
 --line:#e4e7ec;--line2:#d0d5dd;
 --txt:#16181d;--dim:#667085;
 --acc:#2f6bff;--acc2:#2f6bff;--accSoft:#eaf0ff;
 --ok:#12a150;--warn:#c77700;--me:#eaf0ff;
 --r:18px;--rs:14px;
 --glow:0 0 0 3px rgba(47,107,255,.13);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);
 font:16px/1.6 system-ui,'Segoe UI',Arial,sans-serif;margin:0;width:100%;
 display:flex;flex-direction:column;height:100dvh;overflow:hidden;
 -webkit-tap-highlight-color:transparent}
h1{font-size:26px;line-height:1.25;margin-bottom:4px;letter-spacing:-.4px;color:var(--txt)}
.dim{color:var(--dim);font-size:13px}

/* ── LIA's identity: one calm mark, no glow, no spinning ring ───────────── */
.orb{position:relative;flex:0 0 auto;border-radius:50%;
 background:radial-gradient(closest-side at 34% 30%,#9db6ff 0%,#5b7cff 45%,#2f6bff 100%)}
.orb.sm{width:24px;height:24px}
.orb.lg{width:60px;height:60px}

/* ── the shell: identity bar, three zones, one composer ─────────────────── */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:11px 16px;flex:0 0 auto;
 background:var(--bg2);border-bottom:1px solid var(--line)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:1.6px}
#osName{display:none;color:var(--dim);font-size:12.5px;letter-spacing:2.4px;font-weight:600}
#clock{color:var(--dim);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Three zones on a real desktop canvas; one column on a phone. The rails are
   display:none below the breakpoint, so the DOM order never fights the phone. */
#shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);
 grid-template-rows:minmax(0,1fr) auto}
/* No grid-area OUTSIDE the desktop query: a named area with no matching
   template generates phantom rows, and the composer lands above the thread. */
#center{min-height:0;display:flex;flex-direction:column}
.rail{display:none;min-height:0;flex-direction:column;gap:14px;overflow-y:auto;
 overscroll-behavior:contain;padding:16px 2px 10px;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.railCard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.railHead{display:flex;align-items:center;justify-content:space-between;
 font-size:10.5px;letter-spacing:2.2px;font-weight:700;color:var(--dim);margin-bottom:12px}
/* TODAY — three numbers, read in one glance, from data already on screen */
.todayGrid{display:flex;flex-direction:column;gap:11px}
.tStat{display:flex;align-items:baseline;gap:10px}
.tStat b{font-size:27px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tStat span{font-size:13px;color:var(--dim)}
.tStat.hot b{color:var(--warn)}
.tStat.stop b{color:#ff6b6b}
.tSum{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
 font-size:13px;color:var(--dim)}
/* PRIORITIES — ranked, compact, never a wall */
.prio{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;
 line-height:1.5;cursor:pointer;transition:opacity .2s}
.prio:first-of-type{border-top:0}
.prio:hover{opacity:.75}
.prio .n{flex:0 0 auto;width:19px;height:19px;border-radius:6px;font-size:11px;font-weight:700;
 display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim)}
.prio.late .n{background:rgba(255,107,107,.16);color:#ff8f8f}
.prio.dec .n{background:var(--accSoft);color:#b3a2ff}
.prio .t{flex:1;min-width:0}
.prio .w{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.railEmpty{font-size:12.5px;color:var(--dim);opacity:.75;padding:2px 0}
/* מאז שהיית כאן — a strip above the thread, not a modal: David reads it on the
   way in and it never stands between him and the composer. */
#sinceHere{margin:10px 12px 0;padding:10px 12px;border-radius:12px;
 background:var(--card,#141821);border:1px solid var(--line,#242a36);font-size:13.5px}
#sinceHere .sinceHead{font-weight:600;margin-bottom:6px}
#sinceHere .sinceList{margin:4px 0 6px;padding-inline-start:18px;line-height:1.55}
#sinceHere .sinceList.dim{opacity:.72}

@media(min-width:1100px){
 #topbar{padding:14px 26px 13px;gap:16px}
 #topbar .brand{font-size:23px}
 #osName{display:inline}
 #shell{grid-template-columns:300px minmax(0,1fr);
  grid-template-areas:"l c" "f f";
  column-gap:26px;width:100%;max-width:1280px;margin:0 auto;padding:0 26px}
 #railL{grid-area:l;display:flex}
 #center{grid-area:c}
 #composer{grid-area:f}
 /* A conversation is still a column of text: it gets air around it, not a
    2000px measure. The rails own the width; the centre owns the reading. */
 #thread{padding:26px 6px 14px;gap:22px}
 #thread>*{width:100%;max-width:840px;margin-inline:auto}
 .hero{padding:54px 2px 10px;justify-content:center;gap:26px}
 .hero h1{font-size:34px}
 .hero p{font-size:16.5px}
 #composer{padding:10px 0 16px}
 #composer .line,#composer .row,#composer #attachBar,#composer #noteStat{
  max-width:1060px;margin-inline:auto}
}
@media(min-width:1500px){
 #shell{grid-template-columns:320px minmax(0,1fr)}
}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
 letter-spacing:1.2px;color:var(--ok)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
@keyframes blink{0%,100%{opacity:1}55%{opacity:.28}}
#ctxLine{color:var(--dim);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar button{background:none;border:0;color:var(--dim);font-size:15px;padding:6px 8px;cursor:pointer;
 border-radius:10px;transition:color .2s,background .2s}
#topbar button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.wordmark{font-size:11px;letter-spacing:4px;color:var(--dim);font-weight:600;white-space:nowrap}

/* The expert-system pills were removed 25.8 (David): a control that looks live
   but does nothing is worse than no control. They come back only when each one
   opens a real context, fires a capability, or shows real status. */

#thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 padding:14px 16px 10px;display:flex;flex-direction:column;gap:18px}
/* home state: greeting + the big orb, only while nothing has been said yet */
.hero{display:flex;align-items:center;gap:16px;padding:22px 2px 6px;
 animation:rise .5s ease both}
.hero .heroTxt{flex:1;min-width:0}
.hero p{color:var(--dim);font-size:15px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.msg{display:flex;flex-direction:column;gap:6px;animation:rise .32s ease both}
.msg .who{font-size:11px;letter-spacing:.6px;color:var(--dim);padding:0 6px}
.msg .bubble{border-radius:var(--rs);font-size:16.5px;line-height:1.85;
 white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-start;max-width:86%}
.msg.me .bubble{background:var(--me);border:1px solid #d6e2ff;
 border-radius:var(--rs);padding:12px 15px}
.msg.lia{align-self:stretch;max-width:100%}
/* LIA answers as a dark-glass panel, not a chat bubble */
.msg.lia .bubble{background:none;border:0;padding:0;color:var(--txt)}
.ansCard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
 padding:20px 20px 16px}
.secHead{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;
 color:var(--txt);margin-bottom:9px}
.secHead .ic{font-size:13px;color:var(--acc)}
.sec{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.sec .secBody{font-size:15.5px;line-height:1.8;color:var(--dim)}
/* the found facts, on the card, read from the same array the drawer reads */
.secBody.facts{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.facts .fact{position:relative;padding-inline-start:15px;font-size:15px;line-height:1.65;
 color:var(--txt);opacity:.93}
.facts .fact::before{content:'';position:absolute;inset-inline-start:0;top:.72em;
 width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.75}
.nextPill{display:flex;align-items:center;gap:12px;background:var(--accSoft);
 border:1px solid #d6e2ff;border-radius:14px;padding:12px 14px}
.nextPill .mark{width:32px;height:32px;flex:0 0 auto;border-radius:10px;
 display:flex;align-items:center;justify-content:center;font-size:14px;
 background:var(--acc);color:#fff}
.nextPill .txt{flex:1;min-width:0;font-size:15px;line-height:1.5}
/* two small round icon buttons, nothing that looks like a toolbar */
.msg .acts{display:flex;gap:6px;align-items:center;margin-top:12px}
.msg .acts .det{width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;line-height:1;
 display:inline-flex;align-items:center;justify-content:center;
 background:transparent;border:1px solid var(--line);color:var(--dim);
 transition:background .18s,color .18s,border-color .18s}
.msg .acts .det:hover{background:var(--card2);color:var(--txt);border-color:var(--line2)}
/* Evidence left the conversation card (David, 25.8): thirty lines unfolding
   inside a reply is what made this read as a log viewer. It opens in its own
   surface now — a side drawer on the desktop, a bottom sheet on the phone —
   and detailsHtml() is unchanged, so the evidence logic is exactly the one
   that was already trusted. */
#evDrawer{position:fixed;z-index:24;background:var(--bg2);border:1px solid var(--line);
 display:none;flex-direction:column;box-shadow:0 -8px 40px -22px rgba(16,24,40,.35)}
#evDrawer.on{display:flex}
#evHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
#evHead b{font-size:14px;letter-spacing:.4px}
#evBody{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 22px}
#evBody ul{margin:4px 12px 0;padding:0}
#evBody .deep{animation:rise .25s ease both}
#evScrim{position:fixed;inset:0;z-index:23;background:rgba(16,24,40,.28);display:none}
#evScrim.on{display:block;animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* phone: bottom sheet */
#evDrawer{inset:auto 0 0 0;max-height:76dvh;border-radius:22px 22px 0 0;
 padding-bottom:env(safe-area-inset-bottom);animation:sheet .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
/* desktop: side drawer on the inline-start edge, next to the conversation */
@media(min-width:1100px){
 #evDrawer{inset:0 auto 0 0;width:min(460px,38vw);max-height:none;border-radius:0 22px 22px 0;
  animation:slidein .3s cubic-bezier(.2,.8,.2,1) both}
 @keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
}
.thinking .bubble{color:var(--dim)}
/* thinking: a signal line that actually moves, plus a skeleton of the card */
.wave{display:inline-flex;align-items:flex-end;gap:3px;height:16px;vertical-align:-3px;margin-left:8px}
.wave i{width:3px;border-radius:2px;background:linear-gradient(180deg,var(--acc2),var(--acc));
 animation:wv 1.1s ease-in-out infinite}
.wave i:nth-child(1){height:6px;animation-delay:0s}.wave i:nth-child(2){height:14px;animation-delay:.13s}
.wave i:nth-child(3){height:9px;animation-delay:.26s}.wave i:nth-child(4){height:15px;animation-delay:.39s}
.wave i:nth-child(5){height:7px;animation-delay:.52s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.skel{height:12px;border-radius:8px;margin-top:10px;
 background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));
 background-size:220% 100%;animation:sk 1.4s linear infinite}
.skel.s2{width:78%}.skel.s3{width:52%}
@keyframes sk{to{background-position:-220% 0}}

/* ── composer: one premium input, mic and send inside the same shape ────── */
#composer{flex:0 0 auto;background:var(--bg);
 padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#composer .line{display:flex;gap:8px;align-items:flex-end;
 background:var(--card);border:1px solid var(--line2);border-radius:26px;
 padding:6px 6px 6px 8px;transition:border-color .2s,box-shadow .2s}
#composer .line:focus-within{border-color:var(--acc);box-shadow:var(--glow)}
#composer #note{flex:1;resize:none;max-height:32vh;border:0;background:none;
 border-radius:20px;padding:11px 12px;font-size:16px}
#composer #note:focus{outline:none}
#composer .line button{flex:0 0 auto;border-radius:50%;width:44px;height:44px;padding:0;
 display:inline-flex;align-items:center;justify-content:center;font-size:17px;
 transition:transform .18s,filter .2s,opacity .2s}
#composer .line button:active{transform:scale(.92)}
#composer #sendBtn{background:var(--acc);color:#fff;font-size:19px}
#composer #sendBtn:disabled{opacity:.4}
#composer #mic,#composer #clip{background:var(--card2);border:1px solid var(--line);color:var(--dim)}
#composer .row{margin-top:8px}
#seal{flex:0 0 auto;text-align:center;font-size:11px;color:var(--dim);opacity:.6;
 padding:0 0 calc(6px + env(safe-area-inset-bottom))}
/* evidence chips: what David is about to show LIA, removable until he sends —
   same feature as before, wearing the new material */
#attachBar{display:none;flex-wrap:wrap;gap:8px;margin:0 4px 8px}
#attachBar.on{display:flex}
.att{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);
 border-radius:14px;padding:5px 10px;max-width:100%;font-size:13px}
.att img{width:34px;height:34px;object-fit:cover;border-radius:9px}
.att .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{border:none;background:none;color:var(--dim);cursor:pointer;padding:2px 4px;
 border-radius:8px;transition:color .2s}
.att .x:hover{color:var(--txt)}
.att.err{border-color:#a33}
.bubble .shots{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bubble .shots img{max-width:120px;max-height:120px;border-radius:12px;display:block}
.bubble .shots .fchip{background:var(--card2);border:1px solid var(--line);
 border-radius:12px;padding:5px 10px;font-size:12px}
#composer.drag .line{border-color:var(--acc);box-shadow:var(--glow)}
#panel{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:16px;display:none}
#panel.on{display:block;animation:rise .3s ease both}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.focus{border-color:var(--acc);box-shadow:var(--glow)}
.card h2{font-size:17px;margin-bottom:8px}
textarea,input{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);
 border-radius:12px;padding:12px;font:inherit}
textarea{resize:vertical}
textarea.heard{font-size:17px;line-height:1.7;max-height:44vh;overflow-y:auto}
button{background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;
 padding:12px 20px;font:inherit;cursor:pointer;transition:transform .18s,filter .2s,opacity .2s}
button:active{transform:scale(.97)}
button.big{font-size:17px;padding:14px 24px}
button.ghost{background:var(--card2);border:1px solid var(--line);color:var(--dim)}
button.ghost:hover{color:var(--txt);border-color:var(--line2)}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.obj{border-top:1px solid var(--line);padding:12px 0}.obj:first-child{border-top:0}
.badge{font-size:11px;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.CANONICAL{color:var(--ok);border-color:var(--ok)}.badge.CORROBORATED{color:var(--acc2);border-color:var(--acc2)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.quote{margin:4px 0;color:var(--dim);font-size:14px}
.stats{display:flex;gap:16px;flex-wrap:wrap}.stat b{font-size:20px;display:block}
.caught li{margin:6px 0}.caught b{color:var(--ok)}
.det{color:var(--dim);font-size:13px;cursor:pointer;background:none;border:0;padding:5px 2px;
 border-radius:8px;transition:color .2s}
.det:hover{color:var(--txt)}
pre{background:rgba(10,13,24,.8);border-radius:12px;padding:10px;font-size:11px;overflow-x:auto;direction:ltr;text-align:left}
.rec{width:12px;height:12px;border-radius:50%;background:#ff4d4f;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#recBar{display:none}
button#mic.on{background:#ff4d4f;border-color:#ff4d4f;color:#fff}
#login{max-width:380px;margin:22vh auto 0}
#login .brandRow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ansMain{font-size:19px;line-height:1.85}
.ansSec{font-size:16px;line-height:1.75;margin-top:10px}.ansSec b{color:var(--acc2)}
.masked{-webkit-text-security:disc}
@media(max-width:430px){
 h1{font-size:23px}
 .orb.lg{width:52px;height:52px}
 .ansCard{padding:16px 15px 12px;border-radius:18px}
 #thread{padding:12px 12px 8px;gap:15px}
 /* Installed to the home screen the page owns the whole window, so the bar
    pays for the notch itself. On a normal tab the inset is 0 and nothing moves. */
 #topbar{padding:calc(10px + env(safe-area-inset-top)) 13px 9px;gap:6px}
 /* on a phone the context line truncates to a single letter and earns nothing —
    the bar keeps identity and the two controls */
 #ctxLine{display:none}
 #topbar button{padding:8px 7px;font-size:16px}
 /* thumbs, not cursors: the two icon controls get a real tap target */
 .msg .acts{gap:10px;margin-top:14px}
 .msg .acts .det{width:38px;height:38px;font-size:16px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important}
}</style></head><body>

<div id="login" class="card"><div class="brandRow"><span class="orb sm"></span><h1>LIA</h1></div>
<p class="dim">קוד הכניסה של מרכז הפיקוד</p>
<div class="row"><input id="code" type="password" placeholder="קוד"><button onclick="login()">כניסה</button></div>
<p class="dim" id="loginStat" style="margin-top:8px"></p></div>

<div id="app" style="display:none">
<header id="topbar">
 <span class="brand">LIA<span class="live"><i></i>LIVE</span><span class="orb sm"></span></span>
 <span id="osName">FRESCO EXECUTIVE OS</span>
 <span id="ctxLine">פרסקו</span>
 <span id="clock"></span>
 <button onclick="newSession()" title="שיחה חדשה">✎</button>
 <button onclick="openPanel()" title="עוד">⋯</button>
</header>

<div id="shell">
<!-- LEFT: the day itself — built only from state/sales/decisions already fetched -->
<aside id="railL" class="rail" aria-label="היום">
 <section class="railCard">
  <div class="railHead"><span>TODAY</span><span id="tDate"></span></div>
  <div class="todayGrid" id="today"></div>
 </section>
 <section class="railCard">
  <div class="railHead"><span>PRIORITIES</span></div>
  <div id="prios"></div>
 </section>
</aside>

<div id="center">
<!-- מאז שהיית כאן: the shared action ledger, so the phone sees the computer's
     work. Hidden until it has something true to say. -->
<div id="sinceHere" style="display:none"></div>
<main id="thread"></main>
</div>


<footer id="composer">
 <div class="row" id="recBar" style="margin-top:0"><span class="rec"></span><b id="recTime">00:00</b>
 <span class="dim" id="recLabel">מקליט — לחץ ⏹ כשסיימת</span></div>
 <p class="dim" id="capHint" style="display:none"></p>
 <div id="attachBar"></div>
 <div class="line">
  <textarea id="note" rows="1" placeholder="שאל את LIA…"></textarea>
  <button class="ghost" id="clip" onclick="clipTap()" title="צרף תמונה או קובץ">📎</button>
  <button class="ghost" id="mic" onclick="micTap()" style="display:none">🎤</button>
  <button id="sendBtn" onclick="sendPrimary()" title="שלח">↑</button>
 </div>

<script>
const API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
let CODE=localStorage.getItem('lia_code')||'';
/* One network layer for both functions.

   The edge gateway returns the occasional 502 — three in the last 24h out of
   1,518 requests. Two things then went wrong. api() never checked r.ok, so it
   tried to JSON.parse an HTML error page and threw a raw SyntaxError. And
   login() treated any non-ok response as a bad password, which is how a
   momentary gateway hiccup told David his code was wrong and locked him out of
   his own assistant.

   So: retry a transient 5xx once, never parse a body that is not JSON, and keep
   "wrong code" (401) strictly separate from "server had a moment" (5xx). */
const TRANSIENT=[502,503,504,522,524];
async function post(url,body,tries){
 tries=tries||2;
 let last=null;
 for(let i=0;i<tries;i++){
  let r;
  try{
   r=await fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json','x-fresco-code':CODE,'x-lia-surface':SURFACE},
    body:typeof body==='string'?body:JSON.stringify(body)});
  }catch(e){ last={net:e}; await wait(600); continue; }        // dropped connection
  if(r.status===401)return {status:401,r:r};
  if(TRANSIENT.indexOf(r.status)>=0&&i<tries-1){ last={status:r.status}; await wait(600); continue; }
  return {status:r.status,r:r};
 }
 return {status:last&&last.status||0,r:null,net:last&&last.net};
}
function wait(ms){return new Promise(function(res){setTimeout(res,ms);});}
/* If it parses, it IS JSON. Do not gate the SUCCESS path on a content-type
   header: whether that header is readable depends on the browser, the origin
   and CORS exposure, and making a working login depend on it is a risk with no
   upside. A 502 error page fails JSON.parse on its own, which is the only thing
   the check was ever really for. */
async function asJson(r){
 if(!r)return null;
 try{return await r.json();}catch(e){return null;}
}
async function api(b){
 const {status,r}=await post(API,b);
 if(status===401){localStorage.removeItem('lia_code');location.reload();return null;}
 const j=await asJson(r);
 if(j===null)throw new Error('server '+(status||'unreachable'));
 return j;}
async function login(){
 CODE=document.getElementById('code').value.trim();
 const {status,r}=await post(API,'{"action":"state"}');
 const j=status===200?await asJson(r):null;
 if(j){localStorage.setItem('lia_code',CODE);boot(j);return;}
 /* Only a 401 means the code is wrong. Anything else is the server, and saying
    "קוד שגוי" for it sends David hunting for a password that was never the
    problem. */
 const msg=status===401?'קוד שגוי'
   :'לא הצלחתי להגיע לשרת כרגע ('+(status||'אין חיבור')+'). הקוד כנראה בסדר — נסה שוב בעוד רגע.';
 const el=document.getElementById('loginStat');
 if(el)el.textContent=msg; else alert(msg);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stat(s){document.getElementById('noteStat').textContent=s;}
function boot(st){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';
 openSession();setMode('idle');render(st);
 tickClock();loadRails().catch(()=>{});loadSinceLastHere().catch(()=>{});
 if(!window._liaPoll){window._liaPoll=setInterval(()=>{if(CODE)load().catch(()=>{});},8000);}
 /* The rails run on their own, slower beat: the queue rides the 8s state poll
    that already existed, and the three read-only calls behind TODAY refresh
    once a minute instead of riding it. */
 if(!window._liaRails){window._liaRails=setInterval(()=>{tickClock();loadRails().catch(()=>{});},60000);}}
let MODEL_ON=false;
/* One source of truth for connection wording, in David's terms: Fresco LIA runs
   on GPT, so that is what the panel says. The provider adapter underneath still
   supports Anthropic as an internal fallback — it just isn't David's vocabulary. */
function subLine(){
 document.getElementById('sub').textContent=
  MODEL_ON?'הפנקס של דוד · GPT מחובר':'הפנקס של דוד · בלי GPT — עונה על נושאים מוגדרים';
 const g=document.getElementById('gptStat');
 if(g)g.textContent=MODEL_ON?'GPT מחובר ל-LIA Fresco':'GPT עדיין לא מחובר';}
async function load(){try{render(await api({action:'state'}));}catch(e){}}
function openPanel(){document.getElementById('panel').classList.add('on');renderSessions();}
function closePanel(){document.getElementById('panel').classList.remove('on');}

/* ── ONE conversation session ────────────────────────────────────────────
   The turns David sees ARE the turns the kernel reasons over: the timeline
   renders SESSION.turns and the kernel history is derived from the same array
   (historyForKernel), so there is no second copy to drift. Stored per session
   in localStorage, which is what makes "refresh and it is still there" true —
   this is the working memory of the conversation, not decoration. */
const SKEY='lia_sessions', SCUR='lia_session_cur';
/* WHICH DEVICE THIS IS (David, 27.8: "כשאני נכנס לנייד אני לא רואה את הפעולות
   שהיו על המחשב"). The conversations above are per-browser on purpose — that is
   working memory, and there is a privacy switch over it. What David was missing
   is the ACTIONS, which were always server-side; they simply had no shared view.
   The panel now tells the server which device is acting, so the timeline can say
   "במחשב" rather than leaving him to guess, and remembers when THIS device was
   last here so "מאז שהיית כאן" means the right thing on each one. */
const SURFACE=(matchMedia&&matchMedia('(pointer:coarse)').matches)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)?'phone':'desktop';
const SEEN='lia_seen_at';
function lastSeen(){try{return localStorage.getItem(SEEN)||'';}catch(e){return '';}}
function markSeen(){try{localStorage.setItem(SEEN,new Date().toISOString());}catch(e){}}
let SESSION={id:'',title:'',ctx:'פרסקו',at:0,turns:[],retracted:[]};
function jget(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function openSession(id){
 const idx=jget(SKEY,[]);
 const want=id||localStorage.getItem(SCUR)||'';
 const found=want?jget('lia_s_'+want,null):null;
 SESSION=found||{id:uuid(),title:'',ctx:'פרסקו',at:Date.now(),turns:[],retracted:[]};
 if(!Array.isArray(SESSION.retracted))SESSION.retracted=[];   // sessions saved before this existed
 if(!Array.isArray(SESSION.sources))SESSION.sources=[];       // the evidence registry of this conversation
 localStorage.setItem(SCUR,SESSION.id);
 if(!idx.some(s=>s.id===SESSION.id))saveSession();
 renderThread();setCtx(SESSION.ctx);}
function saveSession(){
 SESSION.at=Date.now();
 if(!SESSION.title){const f=SESSION.turns.find(t=>t.role==='me');SESSION.title=f?clip(f.text,40):'שיחה';}
 jset('lia_s_'+SESSION.id,SESSION);
 const idx=jget(SKEY,[]).filter(s=>s.id!==SESSION.id);
 idx.unshift({id:SESSION.id,title:SESSION.title,at:SESSION.at,ctx:SESSION.ctx});
 /* Keep the last 20 conversations; drop the bodies of the ones that fall off so
    localStorage cannot grow without bound. */
 for(const s of idx.slice(20))localStorage.removeItem('lia_s_'+s.id);
 jset(SKEY,idx.slice(0,20));}
function newSession(){localStorage.removeItem(SCUR);openSession();closePanel();
 const ta=document.getElementById('note');if(ta)ta.focus();}
function renderSessions(){
 const el=document.getElementById('sessions');if(!el)return;
 const idx=jget(SKEY,[]).filter(s=>s.id!==SESSION.id);
 el.innerHTML=idx.length?idx.map(s=>'<div class="obj"><button class="det" onclick="openSession(\''+s.id+'\');closePanel()">'
   +esc(s.title||'שיחה')+'</button> <span class="dim">· '+new Date(s.at).toLocaleDateString('he-IL')+'</span></div>').join('')
  :'<p class="dim">אין עדיין שיחות קודמות.</p>';}
const CTX_RE=/(?:לקוח(?:ה)?|פרויקט|מוצר)\s+(?:ה)?([\u0590-\u05FFA-Za-z][\u0590-\u05FFA-Za-z0-9\-' ]{1,24})/;
function updateCtx(text){
 const m=String(text||'').match(CTX_RE);
 if(m&&m[1])setCtx('פרסקו · '+m[1].trim());}
function addTurn(role,text,res,atts){
 if(role==='me')updateCtx(text);
 /* atts = descriptors only, never bytes — localStorage holds a conversation,
    not a file system. The bytes live in ATT_BYTES for this tab only. */
 SESSION.turns.push({role,text:String(text||''),at:Date.now(),res:res||null,
                     atts:(atts&&atts.length)?atts:undefined});
 if(SESSION.turns.length>60)SESSION.turns=SESSION.turns.slice(-60);
 saveSession();renderThread();}
/* The kernel gets the same conversation, paired into the {q,a} shape it expects
   and bounded to the last few exchanges — derived, never maintained separately. */
/* A claim LIA withdrew stays withdrawn. She retracted "גרסת הייצור שונה מהקוד
   שבמאגר" when David pressed her on it, and then stated it again as fact one
   turn later — which tells him the correction was a formality. The kernel gates
   the claim; this is what carries the gate's verdict forward, so it cannot come
   back just because the subject did. */
function rememberRetracted(res){
 const list=(res&&res.retracted_claims)||[];
 if(!Array.isArray(list)||!list.length)return;
 const have=SESSION.retracted||(SESSION.retracted=[]);
 for(const c of list){
  const t=String(c||'').trim().slice(0,300);
  if(t&&have.indexOf(t)<0)have.push(t);
 }
 SESSION.retracted=have.slice(-8);
 saveSession();}
function retractedForKernel(){return (SESSION.retracted||[]).slice(-8);}
function historyForKernel(currentText){
 const out=[];let q=null;
 for(const t of SESSION.turns){
  if(t.role==='me')q=t.text;
  else if(q!=null&&t.text){out.push({q,a:t.text});q=null;}}
 /* An entity question that does not mention pictures gets a history with the
    image-description turns removed: on the old backend those turns pulled
    every answer back to the picture (the Orna loop's second carrier). The
    turns stay in the conversation — only this request's context is filtered. */
 const cur=String(currentText||'');
 const EQ=(typeof ENTITY_Q!=='undefined')?ENTITY_Q:null;   // declared with the attachment rules below
 if(EQ&&EQ.test(cur)&&!/תמונ|צילום|קובץ|מסמך/.test(cur)){
  return out.filter(p=>!/^בתמונה|בתמונה נרא|בתמונה מופיע/.test(String(p.a||'').trim())).slice(-4);}
 return out.slice(-4);}
function setCtx(s){SESSION.ctx=s||'פרסקו';
 const el=document.getElementById('ctxLine');if(el)el.textContent=SESSION.ctx;
 saveSession();}

/* ── the thread ──────────────────────────────────────────────────────────
   Chronological, David on one side, LIA on the other, technical detail folded
   away behind פרטים so the conversation itself stays plain Hebrew. */
function nearBottom(){const el=document.getElementById('thread');
 return el.scrollHeight-el.scrollTop-el.clientHeight<120;}
function scrollThread(force){const el=document.getElementById('thread');
 if(force||nearBottom())el.scrollTop=el.scrollHeight;}
function greet(){const hh=new Date().getHours();
 return hh<12?'בוקר טוב, דוד':hh<17?'צהריים טובים, דוד':'ערב טוב, דוד';}

/* ── the command centre rails ────────────────────────────────────────────────
   Everything here comes from calls THIS PANEL ALREADY MAKES — state (the open
   queue), sales (today's orders) and next_decision / company_changes, the same
   ones capFocus and capImportant have always used. No new endpoint, no new
   table, nothing invented: if a number is not in a response, the row is not
   drawn. The rails are desktop-only; the phone stays one column. */
let RAILS={sales:null,decisions:[],queue:[]};
function railsOn(){return window.matchMedia('(min-width:1100px)').matches;}
function pad2(n){return (n<10?'0':'')+n;}
function tickClock(){const el=document.getElementById('clock');if(!el)return;
 const d=new Date();
 el.textContent=d.getDate()+'.'+(d.getMonth()+1)+' · '+pad2(d.getHours())+':'+pad2(d.getMinutes());
 const t=document.getElementById('tDate');if(t)t.textContent=d.getDate()+'.'+(d.getMonth()+1);}
/* One ranking, one place. Overdue first, then what waits for David's decision,
   then the nearest deadline — the same order capFocus speaks out loud. */
function rankPriorities(queue,decisions,todayStr){
 const dated=(queue||[]).map(o=>({o:o,d:(o.payload&&o.payload.fields||{}).deadline||(o.payload&&o.payload.fields||{}).due||''}))
   .filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));
 const late=dated.filter(x=>x.d<todayStr),soon=dated.filter(x=>x.d>=todayStr);
 const out=late.map(x=>({kind:'late',text:subject(x.o),when:'באיחור · '+heDate(x.d)}));
 for(const d of (decisions||[]))out.push({kind:'dec',text:d.claim||'',when:'מחכה להחלטה שלך'});
 for(const x of soon)out.push({kind:'due',text:subject(x.o),when:'עד '+heDate(x.d)});
 return out.filter(x=>x.text).slice(0,5);}
function countAttention(queue,decisions,todayStr){
 const dated=(queue||[]).map(o=>(o.payload&&o.payload.fields||{}).deadline||(o.payload&&o.payload.fields||{}).due||'').filter(Boolean);
 const late=dated.filter(d=>d<todayStr).length;
 return {late:late,attention:dated.filter(d=>d<=todayStr).length+(decisions||[]).length};}
function renderRails(){
 if(!railsOn())return;
 const t=todayISO(),c=countAttention(RAILS.queue,RAILS.decisions,t);
 const s=RAILS.sales||{};
 const T=document.getElementById('today');
 if(T){
  const orders=(s&&!s.error&&typeof s.today_orders==='number')?s.today_orders:null;
  T.innerHTML=
   (orders===null?'<p class="railEmpty">פריוריטי לא ענה — אין מספר הזמנות להיום.</p>'
    :'<div class="tStat"><b>'+orders+'</b><span>הזמנות היום</span></div>')
   +'<div class="tStat'+(c.attention?' hot':'')+'"><b>'+c.attention+'</b><span>דורש תשומת לב</span></div>'
   +'<div class="tStat'+(c.late?' stop':'')+'"><b>'+c.late+'</b><span>באיחור</span></div>'
   +(orders&&s.today_amount?'<div class="tSum">'+money(s.today_amount)+' לפני מע"מ'
      +(s.biggest_order?' · הגדולה: '+esc(clip(s.biggest_order.customer||'',18)):'')+'</div>':'');}
 const P=document.getElementById('prios');
 if(P){
  const list=rankPriorities(RAILS.queue,RAILS.decisions,t);
  P.innerHTML=list.length?list.map((x,i)=>
    '<div class="prio '+x.kind+'" onclick="askAbout('+JSON.stringify(x.text).replace(/"/g,'&quot;')+')">'
    +'<span class="n">'+(i+1)+'</span><span class="t">'+esc(clip(x.text,74))
    +'<span class="w">'+esc(x.when)+'</span></span></div>').join('')
   :'<p class="railEmpty">אין באיחור ואין החלטות תלויות.</p>';}
}
/* A priority is a question, not a link: tapping it asks LIA about that item —
   the existing ask path, nothing new. */
function askAbout(text){
 const el=document.getElementById('note');
 if(!el)return;el.value='מה הסטטוס של: '+text;el.focus();}
/* "מאז שהיית כאן" — the one strip that closes David's blind spot (27.8).
   It reads the SHARED action ledger, not this browser's conversations, so
   opening the phone shows what the computer did. Nothing is invented: an empty
   ledger says so plainly rather than showing a reassuring blank.
   Failure is silent by design — a feed that cannot load must never block the
   panel David came here to use. */
async function loadSinceLastHere(){
 if(!CODE)return;
 const el=document.getElementById('sinceHere');if(!el)return;
 const seen=lastSeen();
 let r=null;
 try{r=await cap('activity',seen?{since:seen}:{hours:24});}catch(e){return;}
 const row=r&&r.rows&&r.rows[0];
 if(!row||!row.total){el.style.display='none';markSeen();return;}
 const needs=(row.needs_you||[]).slice(0,4);
 const loops=row.open_now||{};
 const drafts=(loops.drafts_waiting||[]).slice(0,3);
 const work=(loops.work_running||[]).slice(0,3);
 let h='<div class="sinceHead">'+esc(row.summary||'')+'</div>';
 if(needs.length)h+='<ul class="sinceList">'+needs.map(i=>
   '<li><b>'+esc(i.what)+'</b>'+(i.surface&&i.surface!=='unknown'?' <span class="dim">· '+esc(devHe(i.surface))+'</span>':'')+'</li>').join('')+'</ul>';
 if(drafts.length||work.length){
  h+='<ul class="sinceList dim">'
   +drafts.map(d=>'<li>טיוטה ממתינה לאישורך → '+esc(d.to||'')+'</li>').join('')
   +work.map(w=>'<li>משימה רצה → '+esc(w.status_line||w.status||'')+'</li>').join('')
   +'</ul>';}
 h+='<button class="det" onclick="askSince()">מה בדיוק קרה</button>'
   +' <button class="det" onclick="dismissSince()">הבנתי</button>';
 el.innerHTML=h;el.style.display='block';}
function devHe(s){return s==='phone'?'בנייד':s==='desktop'?'במחשב':s==='worker'?'בשרת':s==='whatsapp'?'בוואטסאפ':'';}
function dismissSince(){markSeen();const el=document.getElementById('sinceHere');if(el)el.style.display='none';}
/* "מה בדיוק קרה" asks LIA in David's own words rather than dumping the raw
   feed — the strip is the headline, the answer is the conversation. */
function askSince(){dismissSince();const ta=document.getElementById('note');
 if(ta){ta.value='מה קרה מאז שהייתי כאן — כולל מה שקרה במכשיר השני';send();}}
async function loadRails(){
 if(!railsOn()||!CODE)return;
 /* Two read-only calls, the ones TODAY and PRIORITIES actually need. The
    activity feed is gone, and so is the call that fed it. */
 const [sales,dec]=await Promise.all([
  api({action:'sales'}).catch(()=>({error:'unreachable'})),
  cap('next_decision').catch(()=>({rows:[]}))]);
 RAILS.sales=sales;
 RAILS.decisions=(dec&&dec.rows)||[];
 renderRails();}
function renderThread(){
 const el=document.getElementById('thread');if(!el)return;
 const stick=nearBottom();
 let h='';
 SESSION.turns.forEach((t,i)=>{
  if(t.role==='me'){
   let shots='';
   if(t.atts&&t.atts.length){
    shots='<div class="shots">'+t.atts.map(a=>{
     const b=ATT_BYTES.get(a.source_id);
     return (b&&b.preview)?'<img src="'+b.preview+'" alt="'+esc(a.filename)+'">'
      :'<span class="fchip">'+(a.kind==='image'?'🖼️':a.kind==='sheet'?'📊':'📄')+' '+esc(a.filename)+'</span>';
    }).join('')+'</div>';}
   h+='<div class="msg me"><div class="who">אתה</div><div class="bubble">'
    +esc(t.text)+shots+'</div></div>';return;}
  const r=t.res;
  /* The answer is a panel, not a wall of text (David's UI directive, 25.8 —
     "מה מצאתי / מה המשמעות / הפעולה הבאה / ראיות ופרטים"). What did NOT change:
     the answer itself is still the whole conversation, still in .bubble, and
     risks / sources / retractions stay folded under ראיות ופרטים. The
     one reversal is the next action: the mockup puts it on the card, so it is
     rendered — as its own labelled section, never as a line stapled to the
     prose. A section with nothing in it is not drawn at all, so a short reply
     stays a short reply.

     ONE TRUTH OBJECT (P0 fix, 25.8). "מה מצאתי" is rendered from r.facts — the
     SAME array the evidence drawer reads — so the card and the drawer cannot
     disagree. The prose is the sentence around the data, never a second source
     of it: when the prose claims nothing was checked while facts or sources
     exist, the DATA wins and the sentence moves into the drawer verbatim under
     "הניסוח שנפסל". Live case that forced this: the card said "עניתי על זה בלי
     לבדוק בפועל" while the drawer already held 14 orders, ₪42,687 and
     SO26001464 from ORDERS. */
  const structured=r&&!r.__plain;
  const facts=structured?(r.facts||[]).filter(Boolean):[];
  const denied=structured&&contradicts(t.text,r);
  h+='<div class="msg lia"><div class="who">LIA</div>';
  h+=structured?'<div class="ansCard">'
     +'<div class="secHead"><span class="ic">✦</span>מה מצאתי</div>':'';

 /* Evidence attached = a question about the evidence. It never files as a note,
    whatever the words look like — the paperclip already did the router's job. */
 if(atts.length){
  const id=beginTurn();if(!id)return;
  ATTACH=[];renderAttachBar();
  SESSION.sources=(SESSION.sources||[]).concat(atts.map(sourceDescriptor)).slice(-12);
  addTurn('me',t,null,atts.map(sourceDescriptor));
  ta.value='';ta.rows=1;VOICE={};setMode('thinking');
  doAsk(t,id,atts);return;}
 /* While she is waiting for "לשמור?", the send button used to file WHATEVER was
    in the box as a note — so a question typed at that moment, or a plain "כן",
    became a note and came back "לא זיהיתי פריט עסקי חדש בפתק הזה". Only the
    note actually under review, or a yes to it, may be filed. Anything else
    means David moved on, and falls through to normal routing. */
 if(MODE==='review'){
  const a=norm(t);
  if(t===PENDING_NOTE){sendNote(t);return;}
  if(PENDING_NOTE&&YES.indexOf(a)>=0){ta.value=PENDING_NOTE;sendNote(PENDING_NOTE);return;}
  /* "לא" is an answer to the question on the table, not a new request. It used
     to fall through to routing, so a rejection became a fresh note or query —
     the pending note stayed armed and the next "כן" could file it. Now it
     cancels: nothing is sent, the pending note is dropped, the box is cleared
     and she returns to idle. */
  if(PENDING_NOTE&&NO.indexOf(a)>=0){
   PENDING_NOTE='';ta.value='';ta.rows=1;VOICE={};
   addTurn('me',t);addTurn('lia','בסדר, ביטלתי. לא שמרתי כלום.');
   setMode('idle');return;}
  PENDING_NOTE='';
 }
 const intent=classify(t,SESSION.turns.length>0);
 if(intent==='SIMPLIFY'){addTurn('me',t);ta.value='';ta.rows=1;VOICE={};setMode('idle');explainLast();return;}
 if(intent==='ASK'||intent==='DO'){
  /* The turn is taken here, before the message is echoed to the thread: a
     second click of שלח (or Enter held down) gets null and returns, so it
     cannot produce a second bubble OR a second request. */
  const id=beginTurn();if(!id)return;
  addTurn('me',t);ta.value='';ta.rows=1;VOICE={};setMode('thinking');
  (intent==='ASK'?doAsk:doAct)(t,id);
 }else sendNote(t);}

const TYPE_HE={COMMITMENT:'התחייבות',DECISION:'החלטה',TASK:'משימה',DOCUMENT_REQUEST:'בקשת מסמך',
 OPPORTUNITY:'הזדמנות',RISK:'סיכון',TECHNICAL_QUESTION:'שאלה טכנית',COMMERCIAL_QUESTION:'שאלה מסחרית',
 IDEA:'רעיון',FOLLOW_UP:'מעקב',PERSON:'איש קשר',PRODUCT:'מוצר',PROJECT_SIGNAL:'סימן פרויקט'};

function clip(s,n){s=(s||'').trim();return s.length>n?s.slice(0,n)+'…':s;}
function subject(o){const f=o.payload.fields||{};
 let w=f.what||f.decision||o.payload.quote||'';
 if(o.object_type==='COMMITMENT'&&f.promised_to_whom&&f.promised_to_whom!=='UNKNOWN')w+=' ל'+f.promised_to_whom;
 if(o.object_type==='DOCUMENT_REQUEST'&&f.requested_by&&f.requested_by!=='UNKNOWN')w+=' (ביקש '+f.requested_by+')';
 return clip(w,140);}
function deadlineOf(o){const f=o.payload.fields||{};const d=f.deadline||f.due;
 if(d)return heDate(d);
 if(f.deadline_status==='AMBIGUOUS'&&f.deadline_phrase)return f.deadline_phrase+' — לא ברור איזה תאריך';

  return '• '+(TYPE_HE[o.object_type]||o.object_type)+': '+subject(o)+(d?' (עד '+d+')':'');});

/* One submission_id per press of Save. A double-tap, a flaky network or a replayed
   request reuses it and is swallowed server-side; the SAME sentence sent again next
   week gets a fresh id and is correctly a new note. The id is cleared only on
   success, so a failed send retries as the same submission, not a second one. */
let SUBMIT_ID=null,SENDING=false;
function uuid(){if(crypto.randomUUID)return crypto.randomUUID();
 return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
  const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});}
async function sendNote(text){
 const ta=document.getElementById('note'),btn=document.getElementById('sendBtn');
 const t=String(text!==undefined?text:ta.value).trim();if(!t||SENDING)return;
 if(!SUBMIT_ID)SUBMIT_ID=uuid();
 SENDING=true;if(btn)btn.disabled=true;
 try{
  const b={action:'note',text:t,submission_id:SUBMIT_ID,
    ...(VOICE.model?{source:'voice_note',transcription:VOICE}:{source:'typed'})};
  const res=await api(b);
  if(!res||res.ok!==true)throw new Error('rejected');
  SUBMIT_ID=null;VOICE={};ta.value='';ta.rows=1;setMode('idle');stat('');
  addTurn('me',t);
  WAITING={before:LAST_IDS.slice(),t:Date.now(),said:false};
  await load();
 }catch(e){stat('השליחה נכשלה — לחץ שוב');}

/* -- voice note ---------------------------------------------------------
   Two engines, one behaviour. The browser's OWN speech recognition is the
   default: no key, no upload, no recording at all - the phone hears the words
   and hands back text, exactly like the keyboard's dictation button. Only a
   browser without recognition of its own falls back to recording and sending
   the audio to Whisper (which needs OPENAI_API_KEY on the server).
   Either way: the microphone opens ONLY on an explicit tap, a red dot and a
   timer are visible the entire time, everything stops on stop / the 2-minute
   cap / an error / hiding or leaving the page, and no recording is ever kept. */
const MAX_REC_MS=120000;
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let MR=null,CHUNKS=[],STREAM=null,SR=null,T0=0,TIMER=null,BASE='',VOICE={},SERVER_VOICE=false;
let SUBMITTED=false;   // reset per recording; guards against a double user turn
function recorderSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function micSupported(){return !!SRC||(recorderSupported()&&SERVER_VOICE);}
function recording(){return !!SR||!!(MR&&MR.state==='recording');}
/* The ONLY way the microphone opens. Not a callback, not a timer, not the end
   of an utterance — a tap. While she is thinking or talking it says so and
   does nothing, which is the whole of rules 1 and 3 at the door. */
function micTap(){
 if(recording()){stopRec('user');return;}
 if(!micAllowed()){stat(TTS||TURN==='SPEAKING'?'רגע — אני עוד מדברת. לחץ שוב כשאסיים.':'רגע — אני עוד בודקת.');return;}
 setTurn('LISTENING');
 if(SRC)startSR();else startRecorder();}
/* Stop anything that is listening, right now, WITHOUT submitting what it heard.
   Killing a recognizer is not a user finishing a sentence: _killed makes both
   its onend and its onerror return before they can start a turn. */
function killRecognizer(why){
 if(SR){const r=SR;r._killed=true;SR=null;try{(r.abort||r.stop).call(r);}catch(e){}uiStop();}
 if(MR&&MR.state==='recording'){MR._killed=true;MR._why=why||'kill';try{MR.stop();}catch(e){releaseMic();}}}
function uiStart(label){T0=Date.now();stat('');SUBMITTED=false;BASE=document.getElementById('note').value.trim();
 document.getElementById('recLabel').textContent=label||'מקליט — לחץ ⏹ כשסיימת';
 const b=document.getElementById('mic');if(b){b.textContent='⏹ עצור';b.classList.add('on');}
 document.getElementById('recBar').style.display='flex';
 TIMER=setInterval(()=>{const el=Math.floor((Date.now()-T0)/1000);
  document.getElementById('recTime').textContent=String(Math.floor(el/60)).padStart(2,'0')+':'+String(el%60).padStart(2,'0');
  if(Date.now()-T0>=MAX_REC_MS)stopRec('limit');},250);}
function uiStop(){if(TIMER){clearInterval(TIMER);TIMER=null;}
 /* Label stays the icon alone: the composer already says what it is, and a
    second "דבר עם LIA" control next to the field was the same action twice. */
 const b=document.getElementById('mic');if(b){b.textContent='🎤';b.classList.remove('on');}
 document.getElementById('recBar').style.display='none';document.getElementById('recTime').textContent='00:00';
 /* The microphone closed. Unless a turn has already taken over (afterTranscript
    moves straight to PROCESSING), we are back to doing nothing. */
 if(TURN==='LISTENING')setTurn('IDLE');}
function stopRec(why){
 if(SR){try{SR.stop();}catch(e){SR=null;uiStop();}return;}
 if(MR&&MR.state==='recording'){MR._why=why;try{MR.stop();}catch(e){releaseMic();}}else releaseMic();}
/* engine 1: the browser transcribes. Nothing is recorded, so nothing can leak. */
/* Voice input must become ONE clean utterance.

   Some Android/Chrome speech services finalize an utterance PROGRESSIVELY:
   every result carries the whole sentence so far, not just the new words. The
   previous rebuild appended them, which is exactly what produced the string
   David saw in production — "איךאיך אנחנואיך אנחנו מתקדמים".

   So: merge, never append. A segment that extends what we already have replaces
   it; one already contained (or replayed verbatim by the recognition service)
   is dropped; only genuinely new speech is added. Pure, so test-speech.mjs can
   run it against the real corrupted transcript. */
function mergeSpeech(segments){
 let out='';
 for(const raw of segments||[]){
  const seg=(raw||'').trim();
  if(!seg)continue;
  if(!out){out=seg;continue;}
  if(seg===out)continue;                    // the same result replayed
  if(seg.startsWith(out)){out=seg;continue;} // a growing restatement of one utterance
  if(out.startsWith(seg))continue;           // an older, shorter state arriving late
  if(out.endsWith(seg))continue;             // already sitting at the tail
  out=out+' '+seg;                           // genuinely the next thing said
 }
 return out;
}
function startSR(){
 let r;try{r=new SRC();}catch(e){startRecorder();return;}
 r.lang='he-IL';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
 let finals='';const conf=[];
 /* Rebuild the text from the WHOLE result list on every event. Accumulating
    instead (finals += …) duplicated every word: Chrome re-reports results that
    are already final, and resultIndex cannot be trusted to move past them.
    The SAME rule applies to the interim guess: some Android builds report
    several non-final entries for the SAME evolving utterance rather than one
    replacing the last, so summing them (interim += …) produced the repeated,
    garbled live text David saw on mobile. Only the LAST non-final entry is the
    current guess — take it, never add it to the ones before it. */
 r.onresult=e=>{const fins=[];let interimLast='';conf.length=0;
  for(let i=0;i<e.results.length;i++){const res=e.results[i];
   if(res.isFinal){fins.push(res[0].transcript);if(res[0].confidence>0)conf.push(res[0].confidence);}
   else interimLast=res[0].transcript;}
  finals=mergeSpeech(fins);
  /* The live guess goes through the same merge: on these services the interim
     is usually a superset of what is already final, so concatenating the two
     doubled the visible text mid-sentence. */
  document.getElementById('note').value=(BASE?BASE+'\n':'')+mergeSpeech([finals,interimLast]);};
 r.onerror=e=>{if(r._killed)return;const k=e.error;SR=null;uiStop();
  if((k==='language-not-supported'||k==='service-not-allowed'||k==='network')&&SERVER_VOICE&&recorderSupported()){startRecorder();return;}
  if(k==='no-speech'){setMode('failed');return;}
  if(k==='not-allowed'){stat('אין הרשאת מיקרופון — אשר בהגדרות הדפדפן');return;}
  /* Any other error (e.g. 'aborted', which Android's speech service can raise
     mid-recognition): never leave the live interim guess sitting in the box —
     it was never confirmed. Keep ONLY what actually finished recognizing; if
     nothing did, clear back to BASE so "דבר שוב" starts from a clean slate. */
  const ta=document.getElementById('note');
  if(finals.trim()){
   ta.value=(BASE?BASE+'\n':'')+finals.trim();
   const c=conf.length?conf.reduce((x,y)=>x+y,0)/conf.length:null;
   VOICE={model:'browser_speech',language:'he-IL',duration_s:Math.round((Date.now()-T0)/1000),low_confidence:true};
   stat('⚠ ההקלטה נעצרה באמצע ('+k+') — בדוק שהטקסט נכון');
   afterTranscript();
  }else{
   ta.value=BASE;
   setMode('failed');
  }};
 r.onend=()=>{if(r._killed||!SR)return;SR=null;uiStop();
  const secs=Math.round((Date.now()-T0)/1000);
  if(!finals.trim()){setMode('failed');return;}
  const ta=document.getElementById('note');ta.value=(BASE?BASE+'\n':'')+finals.trim();
  const c=conf.length?conf.reduce((x,y)=>x+y,0)/conf.length:null;
  VOICE={model:'browser_speech',language:'he-IL',duration_s:secs,low_confidence:c!==null&&c<0.6};
  if(VOICE.low_confidence)stat('⚠ חלק מהמילים לא ברורות — בדוק ותקן');
  afterTranscript();};
 SR=r;try{r.start();}catch(e){SR=null;startRecorder();return;}
 uiStart();}
/* engine 2: record and let Whisper transcribe. Used only where engine 1 is absent. */
async function startRecorder(){
 if(!recorderSupported()){stat('הדפדפן לא תומך בהקלטה');return;}
 if(!SERVER_VOICE){stat('התמלול לא מוגדר בשרת');return;}
 try{STREAM=await navigator.mediaDevices.getUserMedia({audio:true});}
 catch(e){stat(e&&e.name==='NotAllowedError'?'אין הרשאת מיקרופון — אשר בהגדרות הדפדפן':'המיקרופון לא זמין');return;}
 const mt=pickMime();CHUNKS=[];
 try{MR=mt?new MediaRecorder(STREAM,{mimeType:mt}):new MediaRecorder(STREAM);}
 catch(e){try{MR=new MediaRecorder(STREAM);}catch(e2){releaseMic();stat('ההקלטה לא נתמכת');return;}}
 MR.ondataavailable=e=>{if(e.data&&e.data.size)CHUNKS.push(e.data);};

function pickMime(){for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])
 {try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return '';}

async function finishRec(){
 const secs=Math.round((Date.now()-T0)/1000);
 /* Safari can report an empty mimeType - fall back to what the chunks say, so the
    file we hand Whisper is never named .webm while actually containing mp4. */
 const type=((MR&&MR.mimeType)||(CHUNKS[0]&&CHUNKS[0].type)||'audio/webm').split(';')[0];
 const why=MR&&MR._why,killed=MR&&MR._killed;MR=null;releaseMic();               // tracks off BEFORE any network call
 let blob=new Blob(CHUNKS,{type});CHUNKS=[];
 if(killed){blob=null;CHUNKS=[];return;}                  // stopped by the system, not finished by David
 if(why==='error'){blob=null;setMode('failed');return;}
 if(!blob.size||secs<1){blob=null;setMode('failed');return;}
 stat('מתמלל…');
 try{const r=await fetch(API+'&transcribe=1',{method:'POST',
   headers:{'x-fresco-code':CODE,'x-audio-type':type,'Content-Type':'application/octet-stream'},body:blob});
  blob=null;                                               // the recording ends its life here
  if(r.status===401){localStorage.removeItem('lia_code');location.reload();return;}
  const out=await r.json().catch(()=>({}));
  if(!r.ok||!out.text){setMode('failed');return;}
  const ta=document.getElementById('note');
  ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+out.text.trim();
  VOICE={model:out.model,language:out.language,duration_s:out.duration_s,
         avg_logprob:out.avg_logprob,low_confidence:out.low_confidence};
  if(out.low_confidence)stat('⚠ חלק מהמילים לא ברורות — בדוק ותקן');
  afterTranscript();
 }catch(e){blob=null;stat('התמלול נכשל (רשת) — לחץ דבר שוב');}}
/* -- voice confirmation: speak -> hear a short reflection -> say yes/no ---
   On a phone the hands are busy, so the normal flow needs no tap at all. The
   buttons never go away; they are the fallback, not the path. Three rules make
   this safe: LIA listens for a SHORT fixed window and then stops (never in the

  if(srcs.length&&!kernelSawSources(res)){

  {const prevAnswers=SESSION.turns.filter(t=>t.role==='lia').slice(-2).map(t=>t.text);
   if(isRepeatAnswer(res.answer,prevAnswers)){
    res=Object.assign({},res,{answer:'עצרתי: זו בפעם השנייה אותה תשובה בערך — משהו תקוע, ולא אשרוף לך עוד סיבוב עליה. '

  /* No key on the server. Take the deterministic road as before, but carry the

 const n=(r.facts||[]).length,m=(r.inferences||[]).length;
 let t='במילים פשוטות: '+sentences(r.answer,2);
 if(n||m)t+=' '+n+' מהדברים מגיעים ישירות מהמערכות, ו'+m+' הם הערכה שלי.';
 const risk=(r.risks_opportunities||[])[0];if(risk)t+=' מה שחשוב פה: '+risk+'.';
 if(r.recommended_next_action)t+=' מה שהייתי עושה: '+r.recommended_next_action;
 if(r.confidence==='ACTION_REQUIRES_APPROVAL')t+=' יש כאן החלטה שרק אתה יכול לקבל.';
 else if(r.confidence==='INSUFFICIENT_EVIDENCE')t+=' חסר לי מידע כדי להיות בטוחה.';
 return t;}
/* "תסבירי פשוט" answers as a NEW turn, so the original answer stays visible
   above it in the thread instead of being overwritten by its own explanation. */
function explainTurn(i){
 /* Not a new question, so it must not act like one: it reads the answer that
    is already on the table (plainWords is pure — no capability call, no model
    call, no database read) and it cannot start while a turn is running. */
 if(busy())return;
 const turn=SESSION.turns[i];if(!turn||!turn.res)return;
 /* Pressing it again is not a second request. If the explanation is already
    the last thing she said, say that one again rather than generating a
    second copy of it — this is what made repeated taps look like she was
    re-running the whole conversation. */
 let lastLia=null;
 for(let k=SESSION.turns.length-1;k>=0;k--)if(SESSION.turns[k].role==='lia'){lastLia=SESSION.turns[k];break;}
 if(lastLia&&lastLia.res&&lastLia.res.__explains===i){speakTurn(lastLia.text,true);return;}
 const t=plainWords(turn.res);
 addTurn('lia',t,Object.assign({},turn.res,{__plain:t,__explains:i}));
 speakTurn(t,true);}
function explainLast(){
 /* Skip explanations when looking for what to explain, or a second "תסבירי"
    would simplify the simplification and drift away from the answer. */
 for(let i=SESSION.turns.length-1;i>=0;i--){
  const t=SESSION.turns[i];
  if(t.role==='lia'&&t.res&&t.res.__explains===undefined)return explainTurn(i);}
 speakTurn('אין לי תשובה פתוחה להסביר.',true);}

/* ── DO: voice never changes permissions ──────────────────────────────── */
async function doAct(text,turnId){
 const id=turnId||beginTurn();
 if(!id)return;
 const reqId=id+':act';
 if(!issue(reqId))return;
 const outward=OUTWARD_RE.test(text);
 try{
  const res=await ccApi({action:'kernel',body:text,history:historyForKernel(text),
    retracted:retractedForKernel(),request_id:reqId});
  rememberRetracted(res);
  if(res.self_diagnosis){          // no model → record it for approval, do not pretend to draft
   await ccApi({action:'ask',kind:'change_request',body:text});
   const r2=said('רשמתי את הבקשה לאישור במסך. להכין ניסוח בעצמי אני צריכה GPT.',[],[],
     ['חיבור GPT']);
   LAST={q:text,res:r2};showAnswer(r2,'נרשם לאישור:');
   deliverText(r2.answer);return;}
  LAST={q:text,res:res};
  let spoken=spokenAnswer(res);
  if(outward){
   spoken+=' זו פעולה שיוצאת החוצה — אני לא מבצעת אותה באישור קולי. רשמתי אותה לאישור במסך.';
   await ccApi({action:'ask',kind:'change_request',body:text});
  }else{
   await ccApi({action:'ask',kind:'change_request',body:text});
   spoken+=' הכנתי את זה והשארתי לאישור שלך.';
  }
  res.__plain=spoken;showAnswer(res,outward?'מוכן לאישור במסך:':'הכנתי:');
  deliverText(spoken);
 }catch(e){stat('לא הצלחתי ('+e.message+')');deliverText('לא הצלחתי לבצע את זה.');}}
(function(){const ta=document.getElementById('note');
 const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,window.innerHeight*0.34)+'px';};
 ta.addEventListener('input',grow);
 ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendPrimary();}});
 /* LIA's eyes — three ways in, one pipeline: the picker, Ctrl+V, and drop.
    A pasted screenshot needs no save-to-disk detour; that is the whole point. */
 const fp=document.getElementById('filePick');
 fp.setAttribute('accept',ATT_ACCEPT);
 fp.addEventListener('change',()=>{addFiles(fp.files);fp.value='';});
 document.addEventListener('paste',e=>{
  const items=(e.clipboardData&&e.clipboardData.files)||[];
  if(items.length){e.preventDefault();addFiles(items);}});
 const comp=document.getElementById('composer');
 for(const ev of ['dragover','dragenter'])
  document.addEventListener(ev,e=>{e.preventDefault();comp.classList.add('drag');});
 for(const ev of ['dragleave','dragend'])
  document.addEventListener(ev,e=>{if(!e.relatedTarget)comp.classList.remove('drag');});
 document.addEventListener('drop',e=>{e.preventDefault();comp.classList.remove('drag');
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRec('hidden');});
window.addEventListener('pagehide',()=>stopRec('hidden'));
/* A silent catch here is how a boot failure becomes "LIA can't connect" with
   nothing on screen to act on. Fall back to the login form and say what
   happened; a stale/blank code is expected, anything else is worth seeing. */
if(CODE){api({action:'state'}).then(boot).catch((e)=>{
  const el=document.getElementById('loginStat');
  if(el)el.textContent='לא הצלחתי להתחבר אוטומטית ('+(e&&e.message||'')+'). הזן קוד ונסה שוב.';
});}
