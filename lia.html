:root{--bg:#0f1115;--card:#1a1e26;--line:#2a303c;--txt:#e8eaf0;--dim:#8b93a5;--acc:#5b9dff;--ok:#3fbf7f;--warn:#e0a63c;--me:#1d3557}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,'Segoe UI',sans-serif;margin:auto;max-width:820px;
 display:flex;flex-direction:column;height:100dvh;overflow:hidden}
h1{font-size:20px;margin-bottom:2px}.dim{color:var(--dim);font-size:13px}
/* ── the conversation IS the screen: header, scrolling thread, composer ── */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
#topbar .brand{font-weight:700;font-size:18px;letter-spacing:.5px}
#ctxLine{color:var(--dim);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar button{background:none;border:0;color:var(--dim);font-size:15px;padding:6px 8px;cursor:pointer}
#thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 padding:16px 14px 8px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:5px}
.msg .who{font-size:12px;color:var(--dim);padding:0 4px}
.msg .bubble{border-radius:16px;padding:12px 15px;font-size:17px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-start;max-width:86%}
.msg.me .bubble{background:var(--me);border:1px solid #24446b}
.msg.lia{align-self:flex-end;max-width:94%}
.msg.lia .bubble{background:var(--card);border:1px solid var(--line)}
.msg .acts{display:flex;gap:14px;padding:0 6px}
.msg .more{font-size:15px;line-height:1.75;margin-top:10px}
.msg .more b{color:var(--acc)}

.thinking .bubble{color:var(--dim);font-style:italic}
#composer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg);
 padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#composer .line{display:flex;gap:8px;align-items:flex-end}
#composer #note{flex:1;resize:none;max-height:34vh;border-radius:16px;padding:11px 14px}
#composer .line button{border-radius:16px;padding:11px 16px;flex:0 0 auto}
#panel{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:16px;display:none}
#panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.card.focus{border-color:var(--acc)}
.card h2{font-size:17px;margin-bottom:8px}
textarea,input{width:100%;background:#12151b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}
textarea{resize:vertical}
textarea.heard{font-size:17px;line-height:1.7;max-height:44vh;overflow-y:auto}
button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:12px 20px;font:inherit;cursor:pointer}
button.big{font-size:17px;padding:14px 24px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
button:disabled{opacity:.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.obj{border-top:1px solid var(--line);padding:12px 0}.obj:first-child{border-top:0}
.badge{font-size:11px;border-radius:20px;padding:2px 10px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.badge.CANONICAL{color:var(--ok);border-color:var(--ok)}.badge.CORROBORATED{color:var(--acc);border-color:var(--acc)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.quote{margin:4px 0;color:var(--dim);font-size:14px}
.stats{display:flex;gap:16px;flex-wrap:wrap}.stat b{font-size:20px;display:block}
.caught li{margin:6px 0}.caught b{color:var(--ok)}
.det{color:var(--dim);font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:0;padding:4px 0}
pre{background:#12151b;border-radius:8px;padding:10px;font-size:11px;overflow-x:auto;direction:ltr;text-align:left}
.rec{width:12px;height:12px;border-radius:50%;background:#ff4d4f;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#recBar{display:none}
button#mic.on{background:#ff4d4f}
#login{max-width:360px;margin:80px auto}
.ansMain{font-size:19px;line-height:1.85}
.ansSec{font-size:16px;line-height:1.75;margin-top:10px}.ansSec b{color:var(--acc)}
.masked{-webkit-text-security:disc}</style></head><body>

<div id="login" class="card"><h1>LIA</h1><p class="dim">קוד הכניסה של מרכז הפיקוד</p>
<div class="row"><input id="code" type="password" placeholder="קוד"><button onclick="login()">כניסה</button></div>

<div id="app" style="display:none">
<header id="topbar">
 <span class="brand">LIA</span>
 <span id="ctxLine">פרסקו</span>
 <button onclick="newSession()" title="שיחה חדשה">✎ חדשה</button>
 <button onclick="openPanel()" title="עוד">⋯</button>
</header>

<main id="thread"></main>

<footer id="composer">
 <div class="row" id="recBar" style="margin-top:0"><span class="rec"></span><b id="recTime">00:00</b>
 <span class="dim" id="recLabel">מקליט — לחץ ⏹ כשסיימת</span></div>
 <p class="dim" id="capHint" style="display:none"></p>
 <div class="line">
  <textarea id="note" rows="1" placeholder="שאל, ספר, או דבר…"></textarea>
  <button class="ghost" id="mic" onclick="micTap()" style="display:none">🎤</button>
  <button id="sendBtn" onclick="sendPrimary()">שלח</button>
 </div>

</footer>

<!-- everything that is not the conversation lives behind ⋯ -->
<div id="panel">
<div class="row" style="justify-content:space-between;margin:0">
 <b>LIA — הגדרות ופנקס</b><button class="ghost" onclick="closePanel()">סגור</button></div>
<p class="dim" id="sub" style="margin-top:6px">הפנקס של דוד</p>

<div class="card"><b>שיחות קודמות</b><div id="sessions" style="margin-top:8px"></div></div>

<div class="card"><div class="row" style="justify-content:space-between;margin:0">
<b id="queueTitle">מה פתוח</b>
<button class="det" onclick="toggleAdvanced()">פרטים</button></div>
<div id="queue"></div>
<div id="advanced" style="display:none">
 <div class="stats" id="stats" style="margin-top:14px"></div>
 <div class="row"><button class="ghost" onclick="runExpire()">נקה פגי-תוקף</button>
 <button class="ghost" onclick="load()">רענן</button>
 <button class="ghost" id="privBtn" onclick="togglePrivacy()">מצב פרטיות: כבוי</button>
 <button class="ghost" onclick="getInstaller()">הורד את המתקין למחשב</button>
 <span class="dim" id="instStat"></span></div>
 <p style="margin-top:14px"><b>חיבור GPT ל-LIA Fresco</b></p>
 <p class="dim" id="gptStat" style="margin:4px 0 8px">GPT עדיין לא מחובר</p>
 <div class="row" style="margin-top:0"><input id="mk" type="text" class="masked" placeholder="sk-proj-..."
  aria-label="OpenAI API Key"
  autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr" style="max-width:280px">
 <button class="ghost" onclick="pasteKey()">📋 הדבק</button>
 <button class="ghost" onclick="setModelKey()">חבר GPT</button></div>
 <p class="dim" id="mkStat" style="margin-top:6px"></p>
 <pre id="audit" style="display:none"></pre>
</div></div>
</div>
<script>
const API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
let CODE=localStorage.getItem('lia_code')||'';
/* One network layer for both functions.

   The edge gateway returns the occasional 502 — three in the last 24h out of
   1,518 requests. Two things then went wrong. api() never checked r.ok, so it
   tried to JSON.parse an HTML error page and threw a raw SyntaxError. And
   login() treated any non-ok response as a bad password, which is how a
   momentary gateway hiccup told David his code was wrong and locked him out of
   his own assistant.

   So: retry a transient 5xx once, never parse a body that is not JSON, and keep
   "wrong code" (401) strictly separate from "server had a moment" (5xx). */
const TRANSIENT=[502,503,504,522,524];
async function post(url,body,tries){
 tries=tries||2;
 let last=null;
 for(let i=0;i<tries;i++){
  let r;
  try{
   r=await fetch(url,{method:'POST',
    headers:{'Content-Type':'application/json','x-fresco-code':CODE},
    body:typeof body==='string'?body:JSON.stringify(body)});
  }catch(e){ last={net:e}; await wait(600); continue; }        // dropped connection
  if(r.status===401)return {status:401,r:r};
  if(TRANSIENT.indexOf(r.status)>=0&&i<tries-1){ last={status:r.status}; await wait(600); continue; }
  return {status:r.status,r:r};
 }
 return {status:last&&last.status||0,r:null,net:last&&last.net};
}
function wait(ms){return new Promise(function(res){setTimeout(res,ms);});}
/* If it parses, it IS JSON. Do not gate the SUCCESS path on a content-type
   header: whether that header is readable depends on the browser, the origin
   and CORS exposure, and making a working login depend on it is a risk with no
   upside. A 502 error page fails JSON.parse on its own, which is the only thing
   the check was ever really for. */
async function asJson(r){
 if(!r)return null;
 try{return await r.json();}catch(e){return null;}
}
async function api(b){
 const {status,r}=await post(API,b);
 if(status===401){localStorage.removeItem('lia_code');location.reload();return null;}
 const j=await asJson(r);
 if(j===null)throw new Error('server '+(status||'unreachable'));
 return j;}
async function login(){
 CODE=document.getElementById('code').value.trim();
 const {status,r}=await post(API,'{"action":"state"}');
 const j=status===200?await asJson(r):null;
 if(j){localStorage.setItem('lia_code',CODE);boot(j);return;}
 /* Only a 401 means the code is wrong. Anything else is the server, and saying
    "קוד שגוי" for it sends David hunting for a password that was never the
    problem. */
 const msg=status===401?'קוד שגוי'
   :'לא הצלחתי להגיע לשרת כרגע ('+(status||'אין חיבור')+'). הקוד כנראה בסדר — נסה שוב בעוד רגע.';
 const el=document.getElementById('loginStat');
 if(el)el.textContent=msg; else alert(msg);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stat(s){document.getElementById('noteStat').textContent=s;}
function boot(st){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';
 openSession();setMode('idle');render(st);
 if(!window._liaPoll){window._liaPoll=setInterval(()=>{if(CODE)load().catch(()=>{});},8000);}}
let MODEL_ON=false;
/* One source of truth for connection wording, in David's terms: Fresco LIA runs
   on GPT, so that is what the panel says. The provider adapter underneath still
   supports Anthropic as an internal fallback — it just isn't David's vocabulary. */
function subLine(){
 document.getElementById('sub').textContent=
  MODEL_ON?'הפנקס של דוד · GPT מחובר':'הפנקס של דוד · בלי GPT — עונה על נושאים מוגדרים';
 const g=document.getElementById('gptStat');
 if(g)g.textContent=MODEL_ON?'GPT מחובר ל-LIA Fresco':'GPT עדיין לא מחובר';}
async function load(){try{render(await api({action:'state'}));}catch(e){}}
function openPanel(){document.getElementById('panel').classList.add('on');renderSessions();}
function closePanel(){document.getElementById('panel').classList.remove('on');}

/* ── ONE conversation session ────────────────────────────────────────────
   The turns David sees ARE the turns the kernel reasons over: the timeline
   renders SESSION.turns and the kernel history is derived from the same array
   (historyForKernel), so there is no second copy to drift. Stored per session
   in localStorage, which is what makes "refresh and it is still there" true —
   this is the working memory of the conversation, not decoration. */
const SKEY='lia_sessions', SCUR='lia_session_cur';
let SESSION={id:'',title:'',ctx:'פרסקו',at:0,turns:[],retracted:[]};
function jget(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function openSession(id){
 const idx=jget(SKEY,[]);
 const want=id||localStorage.getItem(SCUR)||'';
 const found=want?jget('lia_s_'+want,null):null;
 SESSION=found||{id:uuid(),title:'',ctx:'פרסקו',at:Date.now(),turns:[],retracted:[]};
 if(!Array.isArray(SESSION.retracted))SESSION.retracted=[];   // sessions saved before this existed
 localStorage.setItem(SCUR,SESSION.id);
 if(!idx.some(s=>s.id===SESSION.id))saveSession();
 renderThread();setCtx(SESSION.ctx);}
function saveSession(){
 SESSION.at=Date.now();
 if(!SESSION.title){const f=SESSION.turns.find(t=>t.role==='me');SESSION.title=f?clip(f.text,40):'שיחה';}
 jset('lia_s_'+SESSION.id,SESSION);
 const idx=jget(SKEY,[]).filter(s=>s.id!==SESSION.id);
 idx.unshift({id:SESSION.id,title:SESSION.title,at:SESSION.at,ctx:SESSION.ctx});
 /* Keep the last 20 conversations; drop the bodies of the ones that fall off so
    localStorage cannot grow without bound. */
 for(const s of idx.slice(20))localStorage.removeItem('lia_s_'+s.id);
 jset(SKEY,idx.slice(0,20));}
function newSession(){localStorage.removeItem(SCUR);openSession();closePanel();
 const ta=document.getElementById('note');if(ta)ta.focus();}
function renderSessions(){
 const el=document.getElementById('sessions');if(!el)return;
 const idx=jget(SKEY,[]).filter(s=>s.id!==SESSION.id);
 el.innerHTML=idx.length?idx.map(s=>'<div class="obj"><button class="det" onclick="openSession(\''+s.id+'\');closePanel()">'
   +esc(s.title||'שיחה')+'</button> <span class="dim">· '+new Date(s.at).toLocaleDateString('he-IL')+'</span></div>').join('')
  :'<p class="dim">אין עדיין שיחות קודמות.</p>';}
const CTX_RE=/(?:לקוח(?:ה)?|פרויקט|מוצר)\s+(?:ה)?([\u0590-\u05FFA-Za-z][\u0590-\u05FFA-Za-z0-9\-' ]{1,24})/;
function updateCtx(text){
 const m=String(text||'').match(CTX_RE);
 if(m&&m[1])setCtx('פרסקו · '+m[1].trim());}
function addTurn(role,text,res){
 if(role==='me')updateCtx(text);
 SESSION.turns.push({role,text:String(text||''),at:Date.now(),res:res||null});
 if(SESSION.turns.length>60)SESSION.turns=SESSION.turns.slice(-60);
 saveSession();renderThread();}
/* The kernel gets the same conversation, paired into the {q,a} shape it expects
   and bounded to the last few exchanges — derived, never maintained separately. */
/* A claim LIA withdrew stays withdrawn. She retracted "גרסת הייצור שונה מהקוד
   שבמאגר" when David pressed her on it, and then stated it again as fact one
   turn later — which tells him the correction was a formality. The kernel gates
   the claim; this is what carries the gate's verdict forward, so it cannot come
   back just because the subject did. */
function rememberRetracted(res){
 const list=(res&&res.retracted_claims)||[];
 if(!Array.isArray(list)||!list.length)return;
 const have=SESSION.retracted||(SESSION.retracted=[]);
 for(const c of list){
  const t=String(c||'').trim().slice(0,300);
  if(t&&have.indexOf(t)<0)have.push(t);
 }
 SESSION.retracted=have.slice(-8);
 saveSession();}
function retractedForKernel(){return (SESSION.retracted||[]).slice(-8);}
function historyForKernel(){
 const out=[];let q=null;
 for(const t of SESSION.turns){
  if(t.role==='me')q=t.text;
  else if(q!=null&&t.text){out.push({q,a:t.text});q=null;}}
 return out.slice(-4);}
function setCtx(s){SESSION.ctx=s||'פרסקו';
 const el=document.getElementById('ctxLine');if(el)el.textContent=SESSION.ctx;
 saveSession();}

/* ── the thread ──────────────────────────────────────────────────────────
   Chronological, David on one side, LIA on the other, technical detail folded
   away behind פרטים so the conversation itself stays plain Hebrew. */
function nearBottom(){const el=document.getElementById('thread');
 return el.scrollHeight-el.scrollTop-el.clientHeight<120;}
function scrollThread(force){const el=document.getElementById('thread');
 if(force||nearBottom())el.scrollTop=el.scrollHeight;}
function renderThread(){
 const el=document.getElementById('thread');if(!el)return;
 const stick=nearBottom();
 let h='';
 SESSION.turns.forEach((t,i)=>{
  if(t.role==='me'){h+='<div class="msg me"><div class="who">אתה</div><div class="bubble">'
    +esc(t.text)+'</div></div>';return;}
  h+='<div class="msg lia"><div class="who">LIA</div><div class="bubble">'+esc(heb(t.text));
  const r=t.res;
  if(r&&!r.__plain){
   /* Nothing is appended under the answer any more. First the standing headings
      went; now the lines themselves. David's words: he does not need
      "הזדמנות:" / "סיכון:" / "לאשר:" on every reply — that belongs in פרטים,
      and in the conversation she should just talk to him. The kernel is told to
      put its whole conclusion in the answer, so a second line underneath was
      either a repetition of it or a report stapled to it. Everything is still
      one click away, and none of it is lost: detailsHtml() renders the same
      fields under פרטים. */
  }
  if(r)h+='<div class="deep" id="deep_'+i+'" style="display:none">'+detailsHtml(r)+'</div>';
  h+='</div>';
  if(r)h+='<div class="acts"><button class="det" onclick="toggleDeep('+i+')">פרטים</button>'
   +'<button class="det" onclick="explainTurn('+i+')">תסבירי פשוט</button></div>';
  h+='</div>';});
 el.innerHTML=h||'<div class="msg lia"><div class="who">LIA</div><div class="bubble">'
  +'שאל אותי משהו על פרסקו, או ספר לי מה סיכמת — אני זוכרת את השיחה.</div></div>';
 scrollThread(stick);}
function detailsHtml(r){
 const list=(t,a)=>a&&a.length?'<p class="dim" style="margin-top:8px"><b>'+t+'</b></p><ul>'+
   a.map(x=>'<li class="dim">'+esc(heb(String(x)))+'</li>').join('')+'</ul>':'';
 /* The recommendation and the retractions moved here when the report lines came
    out of the bubble — nothing was dropped, it just stopped being stapled to
    every reply. */
 return (list('עובדות (מהמערכות)',r.facts)+list('ההערכות שלי',r.inferences)
   +list('מה שהייתי עושה',r.recommended_next_action?[r.recommended_next_action]:null)
   +list('סיכונים והזדמנויות',r.risks_opportunities)+list('מה חסר לי',r.missing_information)
   +list('משכתי בחזרה',r.retracted_claims)
   +list('מה שמעתי',r.__heard?[r.__heard]:null)+list('מקורות',r.sources))
   ||'<p class="dim">אין פירוט נוסף.</p>';}
function toggleDeep(i){const e=document.getElementById('deep_'+i);
 if(e)e.style.display=e.style.display==='none'?'block':'none';}

/* ── the turn state machine ──────────────────────────────────────────────
   IDLE → LISTENING → PROCESSING → SPEAKING → IDLE

   There is deliberately NO edge from SPEAKING back to LISTENING. Every answer
   used to end with speak(text, () => listenFollowUp()), and listenFollowUp
   opened the microphone again with no gesture from David — then re-armed
   itself after each follow-up. Two things fell out of that: LIA's own voice
   landed in the open recognizer and came back as a question he never asked,
   and a second turn started on top of a live one. The machine below is the
   fix: the microphone opens from IDLE only, and only from a tap. */
let TURN='IDLE';        // the authority for "may the microphone open" and "may a request go out"
let TURN_ID=null;       // the id of the one live turn
let TTS=false;          // LIA's voice is on the speaker right now
const ISSUED=new Set(); // every request id ever sent — the same one never goes twice
function turnState(){return TURN;}
function setTurn(s){TURN=s;return s;}
function busy(){return TURN==='PROCESSING'||TURN==='SPEAKING'||TTS;}
/* The single gate in front of the microphone. Rule 3 lives in the !TTS half:
   while she is speaking the mic cannot open, so she can never hear herself. */
function micAllowed(){return TURN==='IDLE'&&!TTS;}
/* One live turn at a time. Returns an id, or null when a turn is already
   running — which is what makes a double tap, a duplicate speech-final event
   and a re-render structurally incapable of producing a second request. */
function beginTurn(){
 if(TURN!=='IDLE'&&TURN!=='LISTENING')return null;
 setTurn('PROCESSING');TURN_ID=uuid();return TURN_ID;}
function endTurn(){setTurn('IDLE');TURN_ID=null;}
/* A request id is issued once. Even if a caller is somehow entered twice with
   the same turn, the second call sends nothing. */
function issue(id){if(!id||ISSUED.has(id))return false;ISSUED.add(id);return true;}
/* Every answer ends the same way: on screen, out loud, back to IDLE — and the
   "back to IDLE" belongs to THIS utterance only. speechSynthesis.cancel()
   fires onend on the sentence it replaced, so a callback from an utterance
   David interrupted would otherwise end the turn that replaced it, and the
   microphone would unlock in the middle of a live request. */
let SPEAK_TOKEN=0;
function speakTurn(text,keepMode){
 setTurn('SPEAKING');if(!keepMode)setMode('idle');
 const tok=++SPEAK_TOKEN;
 speak(text,()=>{if(tok===SPEAK_TOKEN&&TURN==='SPEAKING')endTurn();});}
function deliverText(spoken){speakTurn(spoken,false);}
/* David typing is an explicit action and is never dropped: if she is still
   talking she stops and takes the question. The microphone is the opposite —
   it stays shut while she speaks, because a microphone can hear her and a
   keyboard cannot. A request still in flight (PROCESSING) blocks both: that is
   the one live turn, and this is the whole of rule 1. */
function shutUp(){

 if(window.speechSynthesis){try{speechSynthesis.cancel();}catch(e){}}

/* ── composer states ─────────────────────────────────────────────────────

   review  a spoken note read back before it is sent
   failed  nothing was transcribed; speak again                            */
let MODE='idle';
let PENDING_NOTE='';   // the note awaiting "לשמור?", so nothing else is filed as one
function setMode(m){
 MODE=m;
 const H=document.getElementById('capHint'),A=document.getElementById('capActions'),
       ta=document.getElementById('note'),S=document.getElementById('sendBtn');
 A.innerHTML='';H.style.display='none';ta.style.display='block';ta.rows=1;
 if(S){S.style.display='inline-block';S.disabled=false;S.textContent='שלח';}

  H.textContent='זה מה ששמעתי — קרא, תקן אם צריך, ושלח.';H.style.display='block';

/* One send button, and the same router the microphone uses: a question is asked,
   a report of something that happened is filed as a note. David never picks. */
function sendPrimary(){
 const ta=document.getElementById('note'),t=ta.value.trim();
 if(!t)return;
 if(TURN==='PROCESSING')return;    // a request is in flight — this would be a second turn
 if(TURN==='SPEAKING'||TTS)shutUp();  // he moved on mid-sentence: stop talking and listen to him
 /* While she is waiting for "לשמור?", the send button used to file WHATEVER was
    in the box as a note — so a question typed at that moment, or a plain "כן",
    became a note and came back "לא זיהיתי פריט עסקי חדש בפתק הזה". Only the
    note actually under review, or a yes to it, may be filed. Anything else
    means David moved on, and falls through to normal routing. */

  if(t===PENDING_NOTE){sendNote(t);return;}
  if(PENDING_NOTE&&YES.indexOf(norm(t))>=0){ta.value=PENDING_NOTE;sendNote(PENDING_NOTE);return;}

 }

 if(intent==='SIMPLIFY'){addTurn('me',t);ta.value='';ta.rows=1;VOICE={};setMode('idle');explainLast();return;}
 if(intent==='ASK'||intent==='DO'){
  /* The turn is taken here, before the message is echoed to the thread: a
     second click of שלח (or Enter held down) gets null and returns, so it
     cannot produce a second bubble OR a second request. */
  const id=beginTurn();if(!id)return;
  addTurn('me',t);ta.value='';ta.rows=1;VOICE={};setMode('thinking');
  (intent==='ASK'?doAsk:doAct)(t,id);

/* One submission_id per press of Save. A double-tap, a flaky network or a replayed
   request reuses it and is swallowed server-side; the SAME sentence sent again next
   week gets a fresh id and is correctly a new note. The id is cleared only on
   success, so a failed send retries as the same submission, not a second one. */
let SUBMIT_ID=null,SENDING=false;

  const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});}
async function sendNote(text){
 const ta=document.getElementById('note'),btn=document.getElementById('sendBtn');
 const t=String(text!==undefined?text:ta.value).trim();if(!t||SENDING)return;
 if(!SUBMIT_ID)SUBMIT_ID=uuid();
 SENDING=true;if(btn)btn.disabled=true;
 try{
  const b={action:'note',text:t,submission_id:SUBMIT_ID,
    ...(VOICE.model?{source:'voice_note',transcription:VOICE}:{source:'typed'})};
  const res=await api(b);
  if(!res||res.ok!==true)throw new Error('rejected');

  addTurn('me',t);
  WAITING={before:LAST_IDS.slice(),t:Date.now(),said:false};
  await load();
 }catch(e){stat('השליחה נכשלה — לחץ שוב');}

/* -- voice note ---------------------------------------------------------
   Two engines, one behaviour. The browser's OWN speech recognition is the
   default: no key, no upload, no recording at all - the phone hears the words
   and hands back text, exactly like the keyboard's dictation button. Only a
   browser without recognition of its own falls back to recording and sending
   the audio to Whisper (which needs OPENAI_API_KEY on the server).
   Either way: the microphone opens ONLY on an explicit tap, a red dot and a
   timer are visible the entire time, everything stops on stop / the 2-minute
   cap / an error / hiding or leaving the page, and no recording is ever kept. */
const MAX_REC_MS=120000;
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let MR=null,CHUNKS=[],STREAM=null,SR=null,T0=0,TIMER=null,BASE='',VOICE={},SERVER_VOICE=false;

function recorderSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function micSupported(){return !!SRC||(recorderSupported()&&SERVER_VOICE);}
function recording(){return !!SR||!!(MR&&MR.state==='recording');}
/* The ONLY way the microphone opens. Not a callback, not a timer, not the end
   of an utterance — a tap. While she is thinking or talking it says so and
   does nothing, which is the whole of rules 1 and 3 at the door. */
function micTap(){
 if(recording()){stopRec('user');return;}
 if(!micAllowed()){stat(TTS||TURN==='SPEAKING'?'רגע — אני עוד מדברת. לחץ שוב כשאסיים.':'רגע — אני עוד בודקת.');return;}
 setTurn('LISTENING');
 if(SRC)startSR();else startRecorder();}
/* Stop anything that is listening, right now, WITHOUT submitting what it heard.
   Killing a recognizer is not a user finishing a sentence: _killed makes both
   its onend and its onerror return before they can start a turn. */
function killRecognizer(why){
 if(SR){const r=SR;r._killed=true;SR=null;try{(r.abort||r.stop).call(r);}catch(e){}uiStop();}
 if(MR&&MR.state==='recording'){MR._killed=true;MR._why=why||'kill';try{MR.stop();}catch(e){releaseMic();}}}
function uiStart(label){T0=Date.now();stat('');SUBMITTED=false;BASE=document.getElementById('note').value.trim();
 document.getElementById('recLabel').textContent=label||'מקליט — לחץ ⏹ כשסיימת';
 const b=document.getElementById('mic');if(b){b.textContent='⏹ עצור';b.classList.add('on');}
 document.getElementById('recBar').style.display='flex';
 TIMER=setInterval(()=>{const el=Math.floor((Date.now()-T0)/1000);
  document.getElementById('recTime').textContent=String(Math.floor(el/60)).padStart(2,'0')+':'+String(el%60).padStart(2,'0');
  if(Date.now()-T0>=MAX_REC_MS)stopRec('limit');},250);}
function uiStop(){if(TIMER){clearInterval(TIMER);TIMER=null;}
 const b=document.getElementById('mic');if(b){b.textContent='🎤 דבר עם LIA';b.classList.remove('on');}
 document.getElementById('recBar').style.display='none';document.getElementById('recTime').textContent='00:00';
 /* The microphone closed. Unless a turn has already taken over (afterTranscript
    moves straight to PROCESSING), we are back to doing nothing. */
 if(TURN==='LISTENING')setTurn('IDLE');}
function stopRec(why){
 if(SR){try{SR.stop();}catch(e){SR=null;uiStop();}return;}
 if(MR&&MR.state==='recording'){MR._why=why;try{MR.stop();}catch(e){releaseMic();}}else releaseMic();}
/* engine 1: the browser transcribes. Nothing is recorded, so nothing can leak. */
/* Voice input must become ONE clean utterance.

   Some Android/Chrome speech services finalize an utterance PROGRESSIVELY:
   every result carries the whole sentence so far, not just the new words. The
   previous rebuild appended them, which is exactly what produced the string
   David saw in production — "איךאיך אנחנואיך אנחנו מתקדמים".

   So: merge, never append. A segment that extends what we already have replaces
   it; one already contained (or replayed verbatim by the recognition service)
   is dropped; only genuinely new speech is added. Pure, so test-speech.mjs can
   run it against the real corrupted transcript. */
function mergeSpeech(segments){
 let out='';
 for(const raw of segments||[]){
  const seg=(raw||'').trim();
  if(!seg)continue;
  if(!out){out=seg;continue;}
  if(seg===out)continue;                    // the same result replayed
  if(seg.startsWith(out)){out=seg;continue;} // a growing restatement of one utterance
  if(out.startsWith(seg))continue;           // an older, shorter state arriving late
  if(out.endsWith(seg))continue;             // already sitting at the tail
  out=out+' '+seg;                           // genuinely the next thing said
 }
 return out;
}
function startSR(){
 let r;try{r=new SRC();}catch(e){startRecorder();return;}
 r.lang='he-IL';r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
 let finals='';const conf=[];
 /* Rebuild the text from the WHOLE result list on every event. Accumulating
    instead (finals += …) duplicated every word: Chrome re-reports results that
    are already final, and resultIndex cannot be trusted to move past them.
    The SAME rule applies to the interim guess: some Android builds report
    several non-final entries for the SAME evolving utterance rather than one
    replacing the last, so summing them (interim += …) produced the repeated,
    garbled live text David saw on mobile. Only the LAST non-final entry is the
    current guess — take it, never add it to the ones before it. */
 r.onresult=e=>{const fins=[];let interimLast='';conf.length=0;
  for(let i=0;i<e.results.length;i++){const res=e.results[i];
   if(res.isFinal){fins.push(res[0].transcript);if(res[0].confidence>0)conf.push(res[0].confidence);}
   else interimLast=res[0].transcript;}
  finals=mergeSpeech(fins);
  /* The live guess goes through the same merge: on these services the interim
     is usually a superset of what is already final, so concatenating the two
     doubled the visible text mid-sentence. */
  document.getElementById('note').value=(BASE?BASE+'\n':'')+mergeSpeech([finals,interimLast]);};
 r.onerror=e=>{if(r._killed)return;const k=e.error;SR=null;uiStop();
  if((k==='language-not-supported'||k==='service-not-allowed'||k==='network')&&SERVER_VOICE&&recorderSupported()){startRecorder();return;}
  if(k==='no-speech'){setMode('failed');return;}
  if(k==='not-allowed'){stat('אין הרשאת מיקרופון — אשר בהגדרות הדפדפן');return;}
  /* Any other error (e.g. 'aborted', which Android's speech service can raise
     mid-recognition): never leave the live interim guess sitting in the box —
     it was never confirmed. Keep ONLY what actually finished recognizing; if
     nothing did, clear back to BASE so "דבר שוב" starts from a clean slate. */
  const ta=document.getElementById('note');
  if(finals.trim()){
   ta.value=(BASE?BASE+'\n':'')+finals.trim();
   const c=conf.length?conf.reduce((x,y)=>x+y,0)/conf.length:null;
   VOICE={model:'browser_speech',language:'he-IL',duration_s:Math.round((Date.now()-T0)/1000),low_confidence:true};
   stat('⚠ ההקלטה נעצרה באמצע ('+k+') — בדוק שהטקסט נכון');
   afterTranscript();
  }else{
   ta.value=BASE;
   setMode('failed');
  }};
 r.onend=()=>{if(r._killed||!SR)return;SR=null;uiStop();
  const secs=Math.round((Date.now()-T0)/1000);
  if(!finals.trim()){setMode('failed');return;}
  const ta=document.getElementById('note');ta.value=(BASE?BASE+'\n':'')+finals.trim();
  const c=conf.length?conf.reduce((x,y)=>x+y,0)/conf.length:null;
  VOICE={model:'browser_speech',language:'he-IL',duration_s:secs,low_confidence:c!==null&&c<0.6};
  if(VOICE.low_confidence)stat('⚠ חלק מהמילים לא ברורות — בדוק ותקן');
  afterTranscript();};
 SR=r;try{r.start();}catch(e){SR=null;startRecorder();return;}
 uiStart();}
/* engine 2: record and let Whisper transcribe. Used only where engine 1 is absent. */
async function startRecorder(){
 if(!recorderSupported()){stat('הדפדפן לא תומך בהקלטה');return;}
 if(!SERVER_VOICE){stat('התמלול לא מוגדר בשרת');return;}
 try{STREAM=await navigator.mediaDevices.getUserMedia({audio:true});}
 catch(e){stat(e&&e.name==='NotAllowedError'?'אין הרשאת מיקרופון — אשר בהגדרות הדפדפן':'המיקרופון לא זמין');return;}

 catch(e){try{MR=new MediaRecorder(STREAM);}catch(e2){releaseMic();stat('ההקלטה לא נתמכת');return;}}
 MR.ondataavailable=e=>{if(e.data&&e.data.size)CHUNKS.push(e.data);};

function pickMime(){for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'])

 if(!blob.size||secs<1){blob=null;setMode('failed');return;}
 stat('מתמלל…');
 try{const r=await fetch(API+'&transcribe=1',{method:'POST',
   headers:{'x-fresco-code':CODE,'x-audio-type':type,'Content-Type':'application/octet-stream'},body:blob});
  blob=null;                                               // the recording ends its life here
  if(r.status===401){localStorage.removeItem('lia_code');location.reload();return;}

   answers do not depend on a language model — only the free-text understanding
   does. What cannot be done without a model is said plainly, never faked. */
async function cap(name,args){return ccApi({action:'cap',name:name,args:args||{}});}
function said(answer,facts,sources,missing){
 return {answer:answer,facts:facts||[],inferences:[],sources:sources||[],
         risks_opportunities:[],missing_information:missing||[],
         recommended_next_action:'',confidence:missing&&missing.length?'INSUFFICIENT_EVIDENCE':'HIGH'};}
/* Money is a management fact, not a secret. It is spoken by default; PRIVACY is
   an explicit mode David turns on (in פרטים) for when someone else can hear. */
function privacyOn(){return localStorage.getItem('lia_privacy')==='1';}
function togglePrivacy(){localStorage.setItem('lia_privacy',privacyOn()?'0':'1');
 document.getElementById('privBtn').textContent=privacyOn()?'מצב פרטיות: פועל':'מצב פרטיות: כבוי';}
function money(n){if(privacyOn())return '—';
 const v=Math.round(Number(n)||0);
 return v>=1000?String(Math.round(v/100)/10).replace(/\.0$/,'')+' אלף ש"ח':v+' ש"ח';}
/* The state-of-projects road (recorded miss, 23.8): "מה את יודעת מה ריפו על
   הפרויקטים שנמצאים בעבודה" fell to the לא-זיהיתי menu — the only project
   route demanded a NAME, and voice transcription also writes the double-yud
   פרוייקטים which the old regex missed. Plural forms and "מה מתקדם" mean
   "read the projects source"; singular with a name stays capProject. */
const PROJ_STATE_RE=/פרוי{1,2}קטים|מה\s*מתקדם/;
const DIRECT=[
 {re:/(פוקוס|מה לעשות עכשיו|במה להתמקד)/,run:capFocus},
 {re:/(מכרנו|מכירות|הזמנות|הזמנה|מכירה|כמה כסף|מחזור)/,run:capSales},
 {re:/(הכי חשוב|מה דחוף|מה לטפל|מה אני צריך)/,run:capImportant},
 {re:/(התחייבות|התחייבויות|הבטחתי|מה פתוח|מה אני חייב|הבטחות)/,run:capOpen},
 {re:/(מה השתנה|מה חדש|מה קרה)/,run:capChanges},
 {re:PROJ_STATE_RE,run:capProjectsState},
 {re:/(פרוי{1,2}קט)/,run:capProject},
 {re:/(מוצר|מפרט|TDS|קטלוג|תעודה)/,run:capProduct},
 {re:/(מה קורה עם|לקוח|לקוחה)/,run:capCustomer},
 {re:/(מייל|מיילים|דואר|תגובה)/,run:capMail},
];
const CAN_DO='אני יכולה לענות על: מכירות היום או החודש · מה מחכה להחלטה · ההתחייבויות הפתוחות שלך · '
 +'מה קורה עם לקוח · פרויקט · מוצר או מפרט · חיפוש במייל · ופוקוס.';
async function askDirect(text,configSeen,turnId){
 const hit=DIRECT.find(d=>d.re.test(text));
 let res;
 try{res=hit?await hit.run(text):said(
   'לא זיהיתי את השאלה. '+CAN_DO,[],[],
   ['חיבור GPT — בלעדיו אני מבינה רק את הנושאים שמניתי, לא שאלה חופשית']);}
 catch(e){res=said('לא הצלחתי להביא את הנתונים ('+e.message+').',[],[],['חיבור']);}
 if(configSeen){
  const n=configSeen.model_config_names_visible||[];
  res.missing_information=(res.missing_information||[]).concat([
   'מה השרת רואה בפועל: '+(n.length?n.join(', '):'אף שם הגדרה של מודל'),
   'OPENAI_API_KEY: '+(configSeen.OPENAI_API_KEY?'נראה ✓':'לא נראה ✗')
    +' · MODEL_PROVIDER: '+(configSeen.MODEL_PROVIDER||'(unset)')]);
 }
 LAST={q:text,res:res};showAnswer(res);
 deliverText(res.answer);return res;}

/* Open promises come from LIA's own notebook — the objects the Bridge extracted. */
async function capOpen(){
 const st=await api({action:'state'});
 const q=(st.queue||[]).filter(o=>['COMMITMENT','TASK','DOCUMENT_REQUEST','FOLLOW_UP'].indexOf(o.object_type)>=0);
 if(!q.length)return said('אין לך התחייבויות פתוחות בפנקס.',[],['הפנקס של LIA']);
 const due=q.map(o=>({o:o,d:(o.payload.fields||{}).deadline||(o.payload.fields||{}).due||''}))
            .sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));
 const first=due[0];
 return said(q.length+' התחייבויות פתוחות. הקרובה: '+subject(first.o)+(first.d?' עד '+heDate(first.d):'')+'.',
   due.slice(0,5).map(x=>(TYPE_HE[x.o.object_type]||'')+': '+subject(x.o)+(x.d?' — '+heDate(x.d):'')),
   ['הפנקס של LIA']);}
async function capChanges(){
 const r=await cap('company_changes',{days:7});
 const rows=r.rows||[];
 return said(rows.length?'בשבוע האחרון נרשמו '+rows.length+' אירועים במערכת. האחרון: '+(rows[0].kind||'')+'.'
   :'לא נרשמו אירועים בשבוע האחרון.',
   rows.slice(0,5).map(x=>(x.kind||'')+' · '+String(x.created_at||'').slice(0,10)),[r.source]);}
function termAfter(text,re){const m=text.match(re);return m?m[1]:'';}
/* "איזה פרויקטים בעבודה" is a read of the projects source, not a request to
   name one. Empty query = the whole table (server caps at 15 rows, said
   honestly). publish_state is the status the source actually holds — what it
   does not hold (blockers, last activity) is named, never invented. */
async function capProjectsState(){
 const r=await cap('project_lookup',{query:''});
 const rows=r.rows||[];
 if(!rows.length)return said('אין פרויקטים רשומים במקור כרגע.',[],[r.source]);
 const by={};rows.forEach(x=>{const s=x.publish_state||'ללא סטטוס';by[s]=(by[s]||0)+1;});
 const head=(rows.length>=15?'לפחות 15':String(rows.length))+' פרויקטים במקור';
 return said(head+'. לפי מצב: '+Object.keys(by).map(s=>by[s]+' '+s).join(' · ')
   +'. חסמים ותנועה אחרונה עדיין לא נרשמים בטבלת הפרויקטים, אז אני לא קובעת מה תקוע.',
   rows.slice(0,10).map(x=>(x.name||'')+' · '+(x.city||'')+' · '+(x.publish_state||'')),
   [r.source]);}
async function capProject(text){
 const n=termAfter(text,/פרוי{1,2}קט\s+(?:ה)?([֐-׿A-Za-z][֐-׿A-Za-z\-' ]{1,20})/);
 if(!n)return said('איזה פרויקט? אמור "מה קורה בפרויקט ..."',[],[],['שם פרויקט']);
 const r=await cap('project_lookup',{query:n.trim()});
 const rows=r.rows||[];
 return said(rows.length?rows.length+' פרויקטים תואמים ל'+n+'. הראשון: '+(rows[0].name||'')
   +(rows[0].city?' ב'+rows[0].city:'')+'.':'לא מצאתי פרויקט בשם '+n+'.',
   rows.slice(0,5).map(x=>(x.name||'')+' · '+(x.city||'')+' · '+(x.publish_state||'')),[r.source]);}
async function capProduct(text){
 const n=termAfter(text,/(?:מוצר|מפרט|קטלוג|תעודה)\s+(?:של\s+)?(?:ה)?([֐-׿A-Za-z0-9][֐-׿A-Za-z0-9\-' ]{1,20})/);
 if(!n)return said('איזה מוצר? אמור "מוצר ..." או "מפרט של ..."',[],[],['שם מוצר']);
 const [p,k]=await Promise.all([cap('product_lookup',{query:n.trim()}),
                                cap('knowledge_lookup',{query:n.trim()})]);
 const po=p.rows||[],ko=k.rows||[];
 return said((po.length?po.length+' מוצרים תואמים. הראשון: '+(po[0].name||'')+'.':'לא מצאתי מוצר בשם '+n+'.')
   +(ko.length?' יש '+ko.length+' מסמכים קשורים.':''),
   po.slice(0,4).map(x=>(x.sku||'')+' · '+(x.name||''))
    .concat(ko.slice(0,4).map(x=>'מסמך: '+(x.title||''))),[p.source,k.source]);}
/* "תעשי לי פוקוס" — ranked from data, not from a model: what is overdue, what
   waits for a decision, and what the day actually did. Three things, no more. */
async function capFocus(){
 const [st,rec,sales]=await Promise.all([api({action:'state'}),cap('next_decision'),
                                         api({action:'sales'})]);
 const t=todayISO();
 const open=(st.queue||[]).map(o=>({o:o,d:(o.payload.fields||{}).deadline||(o.payload.fields||{}).due||''}))
   .filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));
 const late=open.filter(x=>x.d<t),soon=open.filter(x=>x.d>=t);
 const dec=rec.rows||[];
 const items=[];
 if(late.length)items.push('באיחור: '+subject(late[0].o)+' (היה '+heDate(late[0].d)+')');
 if(dec.length)items.push('מחכה להחלטה שלך: '+(dec[0].claim||''));
 if(soon.length)items.push('הכי קרוב: '+subject(soon[0].o)+' עד '+heDate(soon[0].d));
 if(!items.length)items.push('אין באיחור ואין החלטות תלויות');
 return said('פוקוס: '+items.slice(0,3).join('. ')+'. היום מכרנו '+money(sales.today_amount)
   +' ב-'+(sales.today_orders||0)+' הזמנות.',
   late.concat(soon).slice(0,5).map(x=>(TYPE_HE[x.o.object_type]||'')+': '+subject(x.o)+' — '+heDate(x.d))
     .concat(dec.slice(0,3).map(d=>'החלטה: '+(d.claim||''))),
   ['הפנקס של LIA','recommendation','ORDERS']);}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
async function capSales(text){
 const monthly=/(חודש|החודש)/.test(text);
 const r=await api({action:'sales',from:monthly?todayISO().slice(0,8)+'01':todayISO()});
 if(r.error)return said('פריוריטי לא זמין כרגע ('+(r.message||r.error)+').',[],[],['חיבור לפריוריטי']);
 const top=(r.top_customers||[]).map(c=>c.customer+' '+money(c.amount));
 let a=r.today_orders
  ?'היום מכרנו '+money(r.today_amount)+' ב-'+r.today_orders+' הזמנות.'
   +(r.biggest_order?' הגדולה: '+r.biggest_order.customer+' '+money(r.biggest_order.amount)+'.':'')
  :'היום עוד לא נכנסה הזמנה.';
 if(monthly)a+=' מתחילת החודש '+money(r.range_amount)+' ב-'+r.range_orders+' הזמנות.';
 return said(a,top.concat(['כולל מע\"מ: '+money(r.today_amount_incl_vat)]),[r.source]);}
async function capImportant(){
 const [rec,ch]=await Promise.all([cap('next_decision'),cap('company_changes',{days:3})]);
 const d=rec.rows||[];
 const a=d.length
  ?'יש '+d.length+' החלטות שמחכות לך. הראשונה: '+(d[0].claim||'')+'.'
  :'אין החלטות שמחכות לך. בשלושת הימים האחרונים נרשמו '+((ch.rows||[]).length)+' אירועים במערכת.';
 return said(a,d.slice(0,5).map(x=>(x.project_name?x.project_name+': ':'')+(x.claim||'')),
   [rec.source,ch.source]);}
function nameIn(text){
 const m=text.match(/(?:לקוח|לקוחה|עם)\s+([֐-׿A-Za-z][֐-׿A-Za-z\-']{1,})/);
 return m?m[1]:'';}
async function capCustomer(text){
 const n=nameIn(text);
 if(!n)return said('לא זיהיתי את שם הלקוח. אמור את השם שוב.',[],[],['שם לקוח']);
 const [s,m]=await Promise.all([cap('priority_sales',{customer:n,months_back:12}),
                                cap('mail_search',{query:n})]);
 const so=s.rows||[],mo=m.rows||[];
 let a=so.length?n+': '+so.length+' הזמנות בשנה האחרונה, האחרונה ב-'+(so[0].date||'')+'.'
                :n+': לא מצאתי הזמנות בשנה האחרונה.';
 a+=mo.length?' במייל יש '+mo.length+' התכתבויות, האחרונה '+String(mo[0].sent_at||'').slice(0,10)+'.'
             :' במייל לא מצאתי התכתבות.';
 return said(a,so.slice(0,4).map(o=>o.ORDNAME+' · '+o.date)
   .concat(mo.slice(0,4).map(x=>'מייל: '+(x.subject||''))),[s.source,m.source]);}
async function capMail(text){
 const m=text.match(/(?:על|בנושא|לגבי|מ)\s+([֐-׿A-Za-z][֐-׿A-Za-z\-']{2,})/);
 if(!m)return said('בלי GPT אני לא יכולה להכריע מה דורש תגובה — לזה צריך קריאה של תוכן ההודעות. '
   +'אני כן יכולה לחפש נושא: אמור "תבדקי מייל על ..." ואביא את ההתכתבויות.',[],[],
   ['חיבור GPT','הרשאות Graph לקריאת גוף הודעה']);
 const r=await cap('mail_search',{query:m[1]});
 const rows=r.rows||[];
 const a=rows.length?'מצאתי '+rows.length+' הודעות על '+m[1]+'. האחרונה מ'+(rows[0].from||'')+' ב-'
   +String(rows[0].sent_at||'').slice(0,10)+'.':'לא מצאתי הודעות על '+m[1]+'.';
 return said(a,rows.slice(0,5).map(x=>(x.subject||'')+' — '+(x.from||'')),[r.source]);}

/* listenFollowUp() lived here — the six-second window that opened after every
   single answer. It was the direct cause of what David reported: her own
   filler ("רגע, בודקת.") landed in it, matched none of the follow-up phrases,
   and fell through to `doAsk(t)` — a question he never asked, answered on top
   of the one he did. It also re-armed itself after each follow-up, so the loop
   never ended. The follow-up phrases it understood (פרטי / למה / ממליצה) are
   the פרטים button and the conversation itself. */

/* ── the explainer: model output translated before it reaches David ────── */
function plainWords(r){
 const n=(r.facts||[]).length,m=(r.inferences||[]).length;
 let t='במילים פשוטות: '+sentences(r.answer,2);
 if(n||m)t+=' '+n+' מהדברים מגיעים ישירות מהמערכות, ו'+m+' הם הערכה שלי.';
 const risk=(r.risks_opportunities||[])[0];if(risk)t+=' מה שחשוב פה: '+risk+'.';
 if(r.recommended_next_action)t+=' מה שהייתי עושה: '+r.recommended_next_action;
 if(r.confidence==='ACTION_REQUIRES_APPROVAL')t+=' יש כאן החלטה שרק אתה יכול לקבל.';
 else if(r.confidence==='INSUFFICIENT_EVIDENCE')t+=' חסר לי מידע כדי להיות בטוחה.';
 return t;}
/* "תסבירי פשוט" answers as a NEW turn, so the original answer stays visible
   above it in the thread instead of being overwritten by its own explanation. */
function explainTurn(i){
 /* Not a new question, so it must not act like one: it reads the answer that
    is already on the table (plainWords is pure — no capability call, no model
    call, no database read) and it cannot start while a turn is running. */
 if(busy())return;
 const turn=SESSION.turns[i];if(!turn||!turn.res)return;
 /* Pressing it again is not a second request. If the explanation is already
    the last thing she said, say that one again rather than generating a
    second copy of it — this is what made repeated taps look like she was
    re-running the whole conversation. */
 let lastLia=null;
 for(let k=SESSION.turns.length-1;k>=0;k--)if(SESSION.turns[k].role==='lia'){lastLia=SESSION.turns[k];break;}
 if(lastLia&&lastLia.res&&lastLia.res.__explains===i){speakTurn(lastLia.text,true);return;}
 const t=plainWords(turn.res);
 addTurn('lia',t,Object.assign({},turn.res,{__plain:t,__explains:i}));
 speakTurn(t,true);}
function explainLast(){
 /* Skip explanations when looking for what to explain, or a second "תסבירי"
    would simplify the simplification and drift away from the answer. */
 for(let i=SESSION.turns.length-1;i>=0;i--){
  const t=SESSION.turns[i];
  if(t.role==='lia'&&t.res&&t.res.__explains===undefined)return explainTurn(i);}
 speakTurn('אין לי תשובה פתוחה להסביר.',true);}

/* ── DO: voice never changes permissions ──────────────────────────────── */
async function doAct(text,turnId){
 const id=turnId||beginTurn();
 if(!id)return;
 const reqId=id+':act';
 if(!issue(reqId))return;
 const outward=OUTWARD_RE.test(text);
 try{
  const res=await ccApi({action:'kernel',body:text,history:historyForKernel(),
    retracted:retractedForKernel(),request_id:reqId});
  rememberRetracted(res);
  if(res.self_diagnosis){          // no model → record it for approval, do not pretend to draft
   await ccApi({action:'ask',kind:'change_request',body:text});
   const r2=said('רשמתי את הבקשה לאישור במסך. להכין ניסוח בעצמי אני צריכה GPT.',[],[],
     ['חיבור GPT']);
   LAST={q:text,res:r2};showAnswer(r2,'נרשם לאישור:');
   deliverText(r2.answer);return;}
  LAST={q:text,res:res};
  let spoken=spokenAnswer(res);
  if(outward){
   spoken+=' זו פעולה שיוצאת החוצה — אני לא מבצעת אותה באישור קולי. רשמתי אותה לאישור במסך.';
   await ccApi({action:'ask',kind:'change_request',body:text});
  }else{
   await ccApi({action:'ask',kind:'change_request',body:text});
   spoken+=' הכנתי את זה והשארתי לאישור שלך.';
  }
  res.__plain=spoken;showAnswer(res,outward?'מוכן לאישור במסך:':'הכנתי:');
  deliverText(spoken);
 }catch(e){stat('לא הצלחתי ('+e.message+')');deliverText('לא הצלחתי לבצע את זה.');}}
(function(){const ta=document.getElementById('note');
 const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,window.innerHeight*0.34)+'px';};
 ta.addEventListener('input',grow);
 ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendPrimary();}});})();

});}
