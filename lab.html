<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>עוזרת המעבדה</title>
<style>
:root{--bg:#0e1117;--card:#161b24;--line:#242a36;--txt:#e8ebf0;--dim:#8b93a3;--acc:#3b82f6;--accSoft:rgba(59,130,246,.16)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
 font:15px/1.55 -apple-system,'Segoe UI',Roboto,'Heebo',sans-serif;height:100%}
#app,#login{max-width:860px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;padding:10px 2px}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#a5c8ff,var(--acc));flex:none}
h1{font-size:18px;margin:0}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
#login{margin-top:18vh}
#login input{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);
 background:var(--bg);color:var(--txt);font-size:16px}
#login button,#composer button{margin-top:10px;padding:12px 16px;border-radius:10px;border:0;
 background:var(--acc);color:#fff;font-size:15px;font-weight:600;width:100%}
#loginStat{color:var(--dim);font-size:12.5px;margin-top:8px;min-height:1em}
#app{display:none;flex-direction:column;height:100dvh}
#thread{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.msg{margin:8px 0;display:flex}
.msg .bubble{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.me{justify-content:flex-start}
.me .bubble{background:var(--accSoft);border:1px solid rgba(59,130,246,.3)}
.her{justify-content:flex-end}
.her .bubble{background:var(--card);border:1px solid var(--line)}
.meta{display:block;margin-top:6px;color:var(--dim);font-size:11.5px}
#composer{display:flex;gap:8px;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
#composer textarea{flex:1;resize:none;padding:12px;border-radius:12px;border:1px solid var(--line);
 background:var(--card);color:var(--txt);font-size:16px;max-height:110px}
#composer button{width:auto;margin:0;padding:0 18px}
#composer button:disabled{opacity:.5}
#mic{background:var(--card);border:1px solid var(--line);color:var(--txt);width:auto;padding:0 14px}
#mic.rec{background:#c0392b;border-color:#c0392b;color:#fff;animation:micPulse 1.1s infinite}
@keyframes micPulse{0%,100%{opacity:1}50%{opacity:.55}}
.empty{color:var(--dim);text-align:center;margin-top:24px;font-size:13.5px}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
#chips button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:13.5px;width:auto;margin:0}
#clip{background:var(--card);border:1px solid var(--line);color:var(--txt);width:auto;padding:0 14px}
#attachBar{display:none;flex-wrap:wrap;gap:6px;padding:6px 0 0}
#attachBar.on{display:flex}
.att{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12.5px;max-width:100%}
.att img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.att .nm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .dim{color:var(--dim)}
.att.err{border-color:#c0392b}
.att .x{background:none;border:0;color:var(--dim);font-size:14px;padding:0 2px;margin:0;width:auto}
#composer.drag{outline:2px dashed var(--acc);outline-offset:4px;border-radius:12px}
</style>
</head>
<body>

<!-- THE LAB ASSISTANT (David, 19.10 — "רחל ומיטל יוכלו לבקש תיקונים בתוך מטריאה … ואת תוכלי לגרום לכך שהשינויים האלה
     יתבצעו"): the orna/yaeli page, desktop-first, for the lab's own codes (rachel, meital — each her own identity, her own
     conversation, her own requests). Server: accessCodes.GUEST_ROLE_CAPS (matriya_read_query · matriya_work · lab_request);
     a request is refined in the conversation and filed into MATRIYA's fix queue under her name, for David's merge.-->

<div id="login" class="card">
 <header><span class="orb"></span><div><h1>עוזרת המעבדה</h1>
  <div class="sub">מטריאה · נתוני המחקר ובקשות תיקון · דרך Fresco LIA</div></div></header>
 <input id="code" type="password" autocapitalize="characters" autocomplete="current-password" placeholder="קוד גישה (FR-…)">
 <button onclick="login()">כניסה</button>
 <div id="loginStat"></div>
</div>

<div id="app">
 <header><span class="orb"></span><div><h1>עוזרת המעבדה</h1>
  <div class="sub" id="sub">אלפא · מחוברת</div></div></header>
 <main id="thread"><p class="empty">שאלי אותי על ניסויים, מדידות, חומרים והכרעות במטריאה — או ספרי לי מה לא עובד במטריאה, ונדייק יחד בקשת תיקון.</p>
 <div id="chips"><button data-q="יש בעיה במטריאה: ">דווחי על בעיה במטריאה</button><button data-q="מה הסטטוס של הבקשות שלי?">הבקשות שלי</button><button data-q="מה הניסויים האחרונים בפרויקט ">ניסויים בפרויקט</button><button data-q="מה ידוע במטריאה על החומר ">חומר במטריאה</button><button data-q="מה הוכרע בניסוי ">הכרעת ניסוי</button></div></main>
 <div id="attachBar"></div>
 <footer id="composer">
  <textarea id="note" rows="1" placeholder="כתבי לי…"></textarea>
  <input type="file" id="filePick" multiple style="display:none">
  <button id="clip" onclick="document.getElementById('filePick').click()" title="צירוף תמונה או קובץ" aria-label="צירוף קובץ">📎</button>
  <button id="mic" onclick="toggleMic()" title="דברי אליי">🎤</button>
  <button id="send" onclick="send()">שלח</button>
 </footer>
</div>

<script>
const API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
const CC='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/command-center?api=1';
let CODE=localStorage.getItem('lab_code')||'';
let HIST=[];            // [{q,a}] — the last exchanges, sent with each ask
let INFLIGHT=0;         // ask-in-a-row (David, 1.9): questions never wait for each other
/* MEMORY UNDER ARIK'S OWN NAME (David, 18.10 — the Arik pilot). The conversation is no longer this tab's
   memory: every question and answer is stored on the server under the identity of the code that sent it
   (chat_sync + the durable kernel turn), so it survives a reload, follows Arik across devices, and never
   appears in David's conversation list — the server files it by user_id, not by this page. */
let CONV='';
const DEVICE=(()=>{let d='';try{d=localStorage.getItem('lab_device')||'';}catch(e){}
 if(!/^[0-9a-zA-Z-]{8,64}$/.test(d)){d='lb-'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);try{localStorage.setItem('lab_device',d);}catch(e){}}
 return d;})();
function rid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function post(url,body){
 const r=await fetch(url,{method:'POST',
  headers:{'Content-Type':'application/json','x-fresco-code':CODE},
  body:typeof body==='string'?body:JSON.stringify(body)});
 return {status:r.status,json:await r.json().catch(()=>null)};
}

async function login(){
 CODE=document.getElementById('code').value.trim();
 const st=document.getElementById('loginStat');
 st.textContent='בודקת…';
 try{
  const {status}=await post(API,'{"action":"state"}');
  if(status===401){st.textContent='קוד שגוי';return;}
  if(status<200||status>=300){st.textContent='השרת לא זמין כרגע ('+status+') — נסה שוב עוד רגע';return;}
  localStorage.setItem('lab_code',CODE);
  boot();
 }catch(e){st.textContent='אין חיבור — נסה שוב';}
}
function boot(){
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 restore();
}
/* the stored conversation comes back on every boot — the server's copy, not the tab's */
async function restore(){
 try{
  const {status,json}=await post(CC,{action:'chat_sync',device_id:DEVICE,messages:[]});
  if(status!==200||!json||!json.conversation_id)return;
  CONV=String(json.conversation_id);
  const msgs=(json.messages||[]).filter(m=>m&&m.content);
  if(!msgs.length)return;
  document.getElementById('thread').innerHTML='';
  let q='';
  for(const m of msgs){
   bubble(m.role==='me'?'me':'her',m.content);
   if(m.role==='me')q=m.content;else if(q){HIST.push({q,a:m.content});q='';}
  }
  if(HIST.length>12)HIST=HIST.slice(-12);
 }catch(e){/* history is a help — the page still asks without it */}
}
async function storeMine(text){
 if(!CONV)await restore();
 if(!CONV)return false;
 const {status,json}=await post(CC,{action:'chat_sync',device_id:DEVICE,conversation_id:CONV,
  messages:[{message_id:rid('ym'),role:'me',content:text,created_at:new Date().toISOString()}]});
 if(status===200&&json&&json.conversation_id)CONV=String(json.conversation_id);
 return status===200&&!!(json&&json.accepted);
}

function bubble(role,text,meta){
 const th=document.getElementById('thread');
 const e=th.querySelector('.empty');if(e)e.remove();
 const d=document.createElement('div');
 d.className='msg '+(role==='me'?'me':'her');
 d.innerHTML='<div class="bubble">'+esc(text)
  +(meta?'<span class="meta">'+esc(meta)+'</span>':'')+'</div>';
 th.appendChild(d);th.scrollTop=th.scrollHeight;
 return d;
}

/* Ask-in-a-row: every question gets its own "חושבת…" bubble the moment it is
   sent, and ITS answer replaces THAT bubble — so a second (or third) question
   can go out while the first is still thinking, and answers stay glued to
   their questions whatever order they return in. */
function fillBubble(w,text,meta){
 const b=w.querySelector('.bubble');
 b.innerHTML=esc(text)+(meta?'<span class="meta">'+esc(meta)+'</span>':'');
 const th=document.getElementById('thread');th.scrollTop=th.scrollHeight;}
/* ── FILES AND PHOTOS (Rachel + Meital, 20.10 — "על מנת להמשיך להזין לך נתונים אני חייבת שיהיה ניתן לשלוח לך תמונה או
   קבצים"). The same pipeline as lia.html: one whitelist, a picker, paste and drop; an image is shrunk to 1600px JPEG
   (enough to read a spectrophotometer screen or a lab sheet); the bytes travel with THIS turn's first request only —
   never with the re-asks while it runs, never into the stored conversation (that keeps the file's name). */
const ATT_KINDS={
 image:{exts:['png','jpg','jpeg','webp'],mimes:['image/png','image/jpeg','image/webp'],cap:10*1024*1024},
 doc:{exts:['pdf','docx','pptx','txt','md'],cap:15*1024*1024,
      mimes:['application/pdf','text/plain','text/markdown',
             'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
             'application/vnd.openxmlformats-officedocument.presentationml.presentation']},
 sheet:{exts:['xlsx','csv'],cap:10*1024*1024,
        mimes:['text/csv','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']}};
const ATT_ACCEPT=Object.values(ATT_KINDS).map(k=>k.exts.map(e=>'.'+e).join(',')).join(',');
function sanitizeName(n){return String(n||'').split(/[\\/]/).pop().replace(/[\x00-\x1f<>:"|?*]/g,'').trim().slice(0,120)||'קובץ';}
function attKind(mime,name){
 const base=String(name||'').toLowerCase(),dot=base.lastIndexOf('.');
 const ext=dot>0?base.slice(dot+1):'';
 for(const k in ATT_KINDS)if(ATT_KINDS[k].exts.indexOf(ext)>=0)return k;
 if(ext)return null;                   // an extension off the whitelist loses even with a friendly mime
 for(const k in ATT_KINDS)if(mime&&ATT_KINDS[k].mimes.indexOf(String(mime).toLowerCase())>=0)return k;
 return null;}
function attValidate(name,mime,size){
 const kind=attKind(mime,name);
 if(!kind)return {ok:false,reason:'סוג הקובץ לא נתמך'};
 if(size>ATT_KINDS[kind].cap)return {ok:false,reason:'גדול מדי (המקסימום '+Math.round(ATT_KINDS[kind].cap/1048576)+'MB)'};
 return {ok:true,kind:kind};}
let ATTACH=[],ATT_SEQ=0;
function fileB64(f){return new Promise((res,rej)=>{const rd=new FileReader();
 rd.onload=()=>res(String(rd.result).split(',')[1]||'');rd.onerror=rej;rd.readAsDataURL(f);});}
function shrinkImage(f){return new Promise((res,rej)=>{
 const img=new Image();const url=URL.createObjectURL(f);
 img.onload=()=>{URL.revokeObjectURL(url);
  const mx=Math.max(img.width,img.height),sc=mx>1600?1600/mx:1;
  const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const durl=c.toDataURL('image/jpeg',0.85),b64=durl.split(',')[1]||'';
  res({b64:b64,mime:'image/jpeg',preview:durl,size:Math.round(b64.length*0.75)});};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
 img.src=url;});}
async function addFiles(files){
 for(const f of Array.from(files||[])){
  const name=sanitizeName(f.name),v=attValidate(name,f.type,f.size);
  if(!v.ok){ATTACH.push({source_id:'s_'+Date.now().toString(36)+'_'+(++ATT_SEQ),filename:name,status:'ERROR',error:v.reason});continue;}
  const a={source_id:'s_'+Date.now().toString(36)+'_'+(++ATT_SEQ),source_type:v.kind==='image'?'CHAT_IMAGE':'CHAT_FILE',kind:v.kind,
           filename:name,mime:f.type||'',size:f.size,created_at:Date.now(),status:'READING'};
  ATTACH.push(a);renderAttachBar();
  try{
   if(v.kind==='image'){const r=await shrinkImage(f);a.data_b64=r.b64;a.mime=r.mime;a.preview=r.preview;a.size=r.size;}
   else a.data_b64=await fileB64(f);
   a.status='READY';
  }catch(e){a.status='ERROR';a.error='לא הצלחתי לקרוא את הקובץ';}
  renderAttachBar();}
 renderAttachBar();}                   // a refused file (continue above) shows too
function removeAtt(id){ATTACH=ATTACH.filter(a=>a.source_id!==id);renderAttachBar();}
function renderAttachBar(){
 const el=document.getElementById('attachBar');if(!el)return;
 el.classList.toggle('on',ATTACH.length>0);
 el.innerHTML=ATTACH.map(a=>{
  const x='<button class="x" onclick="removeAtt(\''+a.source_id+'\')" aria-label="הסר">✕</button>';
  if(a.status==='ERROR')return '<span class="att err"><span class="nm">'+esc(a.filename)+'</span><span class="dim">'+esc(a.error||'')+'</span>'+x+'</span>';
  const face=a.preview?'<img src="'+a.preview+'" alt="">':'<span>'+(a.kind==='sheet'?'📊':'📄')+'</span>';
  return '<span class="att">'+face+'<span class="nm">'+esc(a.filename)+'</span>'+(a.status==='READING'?'<span class="dim">קוראת…</span>':'')+x+'</span>';}).join('');}
/* this turn's files, as the server reads them (inputRoute.realSources: named, with bytes) — and only READY ones */
function takeSources(){
 const ready=ATTACH.filter(a=>a.status==='READY'&&a.data_b64);
 ATTACH=ATTACH.filter(a=>a.status==='READING');renderAttachBar();
 return ready.map(a=>({source_id:a.source_id,source_type:a.source_type,kind:a.kind,filename:a.filename,mime:a.mime,size:a.size,created_at:a.created_at,data_b64:a.data_b64}));}
async function send(text){
 const ta=document.getElementById('note');
 if(ATTACH.some(a=>a.status==='READING')){bubble('her','רגע — הקובץ עדיין נקרא. שלחי שוב בעוד שנייה.');return;}
 const srcs=text===undefined?takeSources():[];
 let t=String(text!==undefined?text:ta.value).trim();
 if(!t&&!srcs.length)return;
 if(text===undefined)ta.value='';
 const names=srcs.map(s=>'📎 '+s.filename).join('\n');
 bubble('me',[t,names].filter(Boolean).join('\n'));
 if(!t)t='';
 const w=bubble('her','חושבת…');
 INFLIGHT++;
 try{
  const saved=await storeMine([t,names].filter(Boolean).join('\n')).catch(()=>false);
  const turn=rid('yt');
  const ask={action:'kernel',body:t,history:HIST.slice(-6),turn_id:turn,conversation_id:CONV,device_id:DEVICE};
  const first=srcs.length?Object.assign({},ask,{sources:srcs}):ask;   // the bytes ride the first request only
  const durable=saved&&!!CONV;
  /* THE CONNECTION DROPS, THE TURN DOES NOT (yaeli.html #144, Arik 19.10): a dropped durable ask is asked again with
     the SAME turn_id — 202 while it runs, the stored answer once done, never a second run. */
  const dropped=e=>{if(durable)return {status:0,json:null};throw e;};
  let {status,json}=await post(CC,durable?first:Object.assign({action:'kernel',body:t,history:HIST.slice(-6)},srcs.length?{sources:srcs}:{})).catch(dropped);
  if(status===401){localStorage.removeItem('lab_code');location.reload();return;}
  /* a long answer is still being worked on server-side: the same turn_id is asked again, and it never runs twice */
  for(let i=0;(status===202||status===0)&&i<60;i++){
   await new Promise(r=>setTimeout(r,4000));
   ({status,json}=await post(CC,ask).catch(dropped));
  }
  if(status===0)throw new Error('Load failed');
  const r=json||{};
  const ans=String(r.answer||r.text||'לא התקבלה תשובה.');
  const src=(r.sources||[]).length;
  fillBubble(w,ans,src?('מקורות: '+src):null);
  HIST.push({q:[t,names].filter(Boolean).join('\n'),a:ans});if(HIST.length>12)HIST=HIST.slice(-12);
 }catch(e){
  fillBubble(w,'לא הצלחתי להגיע למערכת ('+(e&&e.message||'רשת')+') — נסה שוב.');
 }
 INFLIGHT=Math.max(0,INFLIGHT-1);
}

/* ── the microphone (Arik, 1.9): two engines, one behaviour ──────────────
   The browser's OWN speech recognition (he-IL) is the default — no upload,
   no recording kept. A browser without it (iPhone Safari) records and sends
   the audio to the server's existing transcribe route, which forwards to
   Whisper and keeps nothing. Either way the words land as a normal question
   and are sent — a talk, not a form. */
let REC=null,MEDIA=null,CHUNKS=[],MICON=false;
function micBtn(){return document.getElementById('mic');}
function setRec(on){MICON=on;micBtn().classList.toggle('rec',on);micBtn().textContent=on?'■':'🎤';}
function toggleMic(){MICON?stopMic():startMic();}
function startMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){
  REC=new SR();REC.lang='he-IL';REC.interimResults=false;REC.maxAlternatives=1;
  REC.onresult=ev=>{const t=(ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript||'').trim();
   setRec(false);if(t)send(t);};
  REC.onerror=()=>{setRec(false);recFallback();};
  REC.onend=()=>{if(MICON)setRec(false);};
  try{REC.start();setRec(true);return;}catch(e){/* fall through */}
 }
 recFallback();
}
async function recFallback(){
 if(!navigator.mediaDevices||!window.MediaRecorder){
  bubble('her','אין למכשיר הזה זיהוי דיבור זמין — כתוב לי במקום.');return;}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  MEDIA=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  CHUNKS=[];
  MEDIA.ondataavailable=ev=>{if(ev.data&&ev.data.size)CHUNKS.push(ev.data);};
  MEDIA.onstop=async()=>{
   stream.getTracks().forEach(tr=>tr.stop());
   const blob=new Blob(CHUNKS,{type:MEDIA.mimeType||mime||'audio/webm'});
   if(!blob.size){setRec(false);return;}
   const w=bubble('her','מתמללת…');
   try{
    const r=await fetch(API+'&transcribe',{method:'POST',
     headers:{'x-fresco-code':CODE,'x-audio-type':blob.type||'audio/webm'},body:blob});
    const j=await r.json().catch(()=>null);
    w.remove();
    const t=(j&&j.text||'').trim();
    if(t)send(t);
    else bubble('her',(j&&j.message)||'לא זיהיתי דיבור — נסה שוב קרוב יותר למיקרופון.');
   }catch(e){w.remove();bubble('her','התמלול לא הצליח ('+(e&&e.message||'רשת')+').');}
  };
  MEDIA.start();setRec(true);
 }catch(e){bubble('her','אין גישה למיקרופון — אשר הרשאה בדפדפן ונסה שוב.');setRec(false);}
}
function stopMic(){
 setRec(false);
 if(REC){try{REC.stop();}catch(e){}REC=null;}
 if(MEDIA&&MEDIA.state==='recording'){try{MEDIA.stop();}catch(e){}}
}
document.getElementById('note').addEventListener('keydown',ev=>{
 if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}});
if(CODE){post(API,'{"action":"state"}').then(({status})=>{if(status>=200&&status<300)boot();
 else if(status===401)localStorage.removeItem('lab_code');}).catch(()=>{});}
(function(){const fp=document.getElementById('filePick');fp.setAttribute('accept',ATT_ACCEPT);
 fp.addEventListener('change',()=>{addFiles(fp.files);fp.value='';});
 document.addEventListener('paste',e=>{const items=(e.clipboardData&&e.clipboardData.files)||[];if(items.length){e.preventDefault();addFiles(items);}});
 const comp=document.getElementById('composer');
 for(const ev of ['dragover','dragenter'])document.addEventListener(ev,e=>{e.preventDefault();comp.classList.add('drag');});
 for(const ev of ['dragleave','dragend'])document.addEventListener(ev,e=>{if(!e.relatedTarget)comp.classList.remove('drag');});
 document.addEventListener('drop',e=>{e.preventDefault();comp.classList.remove('drag');
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});})();
/* the five things the lab does most (David, 19.10): one tap asks; a chip that ends with a space waits for her to finish it */
document.querySelectorAll('#chips button').forEach(function(b){b.onclick=function(){var q=b.getAttribute('data-q');var n=document.getElementById('note');n.value=q;if(/\s$/.test(q)){n.focus();}else{send();}};});
</script>
</body>
