<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIA Next</title>
<link rel="icon" type="image/png" href="lia-icon-192.png">
<link rel="apple-touch-icon" href="lia-icon-180.png">
<meta name="theme-color" content="#f7f8fa">
<style>
/* ── LIA NEXT — the same engine, a visible process ───────────────────────────
   A second face on the SAME command-center: same code header, same actions
   (kernel · cap · work_decide), same authority gate on the server. Nothing here
   decides anything about the business. What is new is that every answer and
   every work package shows the path it actually took — THINK → DECIDE →
   EXECUTE → VERIFY — and every value on that path is something the server
   returned or this page measured. The server does not stream a turn's inner
   steps, so while a turn is in flight the first three stages are lit together
   and are only told apart once the response says what happened.

   lia.html is untouched. Tokens are lia.html's own (blue accent, the orb). */
:root{
 --bg:#f7f8fa;--card:#ffffff;--card2:#f2f4f7;--line:#e4e7ec;--line2:#d0d5dd;
 --txt:#16181d;--dim:#667085;--acc:#2f6bff;--accSoft:#eaf0ff;--accInk:#ffffff;
 --ok:#12a150;--okSoft:#e4f6ec;--warn:#b86e00;--warnSoft:#fdf1dc;--bad:#c53030;--badSoft:#fdeaea;--unk:#667085;--unkSoft:#eef0f3;
 --r:18px;--rs:12px;--ease:cubic-bezier(.23,1,.32,1);
 --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -14px rgba(16,24,40,.22);
 --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0e1116;--card:#171b22;--card2:#1e232c;--line:#272d38;--line2:#394150;
 --txt:#e9ecf1;--dim:#98a2b3;--acc:#6d95ff;--accSoft:#1b2540;--accInk:#0b1020;
 --ok:#4ccf86;--okSoft:#12301f;--warn:#f0b455;--warnSoft:#33270f;--bad:#ff8a80;--badSoft:#3a1917;--unk:#98a2b3;--unkSoft:#222833;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.8);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,'Segoe UI','Arial Hebrew',Arial,sans-serif;
 display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.dim{color:var(--dim)}
[hidden]{display:none!important}
.wrap{width:100%;max-width:820px;margin:0 auto;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}

/* ── login ── */
#login{flex:1;display:grid;place-items:center;padding:24px}
.loginCard{width:100%;max-width:360px;display:grid;gap:14px;justify-items:center;text-align:center}
.loginCard input{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--card);color:var(--txt);font:inherit;font-size:16px;text-align:center}
.loginCard input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.orb{flex:0 0 auto;border-radius:50%;background:radial-gradient(closest-side at 34% 30%,#9db6ff 0%,#5b7cff 45%,#2f6bff 100%)}
.orb.sm{width:26px;height:26px}.orb.lg{width:64px;height:64px}
.orb.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.09);filter:brightness(1.12)}}
.pri{min-height:48px;padding:0 18px;border-radius:var(--rs);background:var(--acc);color:var(--accInk);font-weight:700;transition:transform .12s var(--ease),opacity .15s}
.pri:active:not(:disabled){transform:scale(.97)}
.sec{min-height:42px;padding:0 14px;border-radius:var(--rs);border:1px solid var(--line2);font-weight:600;font-size:.92rem;transition:background-color .15s,transform .12s var(--ease)}
.sec:hover{background:var(--card2)}.sec:active:not(:disabled){transform:scale(.97)}
.sec.no{color:var(--bad)}

/* ── app shell ── */
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line)}
.barIn{display:flex;align-items:center;gap:10px;height:56px}
.brand{font-weight:800;letter-spacing:.04em}
.tag{font-size:.68rem;font-weight:700;color:var(--acc);background:var(--accSoft);border-radius:99px;padding:2px 8px}
.tabs{position:relative;margin-inline-start:auto;display:flex;padding:3px;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.tabs button{position:relative;z-index:1;min-height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--dim);transition:color .2s}
.tabs button[aria-selected="true"]{color:var(--txt)}
.tabPill{position:absolute;top:3px;left:0;height:36px;border-radius:9px;background:var(--card);box-shadow:var(--shadow);transition:transform .32s var(--ease),width .32s var(--ease)}
.count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--warn);color:#fff;font:600 .68rem var(--mono)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ── the run rail ── */
.rail{flex:none;padding-block:10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.stages{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);direction:ltr}
.stage{position:relative;min-width:0;--i:0}
.stage button{position:relative;z-index:1;width:100%;display:grid;justify-items:center;gap:2px;padding:2px 2px 4px;border-radius:10px}
.stage button[aria-pressed="true"]{background:var(--accSoft)}
.stage .en{font:600 .66rem var(--mono);letter-spacing:.05em;color:var(--dim)}
.stage .he{font-size:.72rem;color:var(--dim);direction:rtl}
.stage:not(:last-child)::before,.stage:not(:last-child)::after{content:"";position:absolute;z-index:2;pointer-events:none;top:16px;left:calc(50% + 19px);width:calc(100% - 38px);height:2px;border-radius:2px}
.stage:not(:last-child)::before{background:var(--line2)}
.stage:not(:last-child)::after{background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);transition-delay:calc(var(--i)*110ms + 120ms)}
.stage:is([data-s="done"],[data-s="warn"],[data-s="unk"]):not(:last-child)::after{transform:scaleX(1)}
.stage[data-s="active"]:not(:last-child)::after{transform:none;transition:none;background:linear-gradient(90deg,transparent,var(--acc),transparent) no-repeat;background-size:50% 100%;animation:travel 1.1s linear infinite}
@keyframes travel{from{background-position:-100% 0}to{background-position:200% 0}}
.node{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line2);color:var(--dim);font:600 .74rem var(--mono);transition:background-color .3s var(--ease),border-color .3s,color .3s;transition-delay:calc(var(--i)*110ms)}
.node svg{width:15px;height:15px}
.stage[data-s="done"] .node{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.stage[data-s="warn"] .node{background:var(--warnSoft);border-color:var(--warn);color:var(--warn)}
.stage[data-s="unk"] .node{background:var(--unkSoft);border-color:var(--unk);color:var(--unk);border-style:dashed}
.stage[data-s="fail"] .node{background:var(--badSoft);border-color:var(--bad);color:var(--bad);animation:shake .4s var(--ease)}
.stage[data-s="active"] .node{border-color:var(--acc);color:var(--acc);background:var(--accSoft)}
.stage[data-s="active"] .node::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc);animation:spin .9s linear infinite}
.draw{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s var(--ease) forwards;animation-delay:calc(var(--i)*110ms + 80ms)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
.caption{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:.86rem;color:var(--dim);animation:swap .26s var(--ease) both}
.caption b{color:var(--txt)}.caption small{display:block;font-size:.78rem;margin-top:2px}
@keyframes swap{from{opacity:0;transform:translateY(-3px)}}
.clock{font-weight:600;color:var(--acc)}

.badge{display:inline-block;font:600 .64rem var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:6px;direction:ltr;white-space:nowrap;vertical-align:middle}
.badge.ok{color:var(--ok);background:var(--okSoft)}.badge.warn{color:var(--warn);background:var(--warnSoft)}
.badge.unk{color:var(--unk);background:var(--unkSoft)}.badge.bad{color:var(--bad);background:var(--badSoft)}.badge.acc{color:var(--acc);background:var(--accSoft)}

/* ── thread ── */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.thread{display:grid;gap:12px;padding-block:14px 18px;align-content:start}
.empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:34px 16px;color:var(--dim)}
.empty h2{font-size:1.15rem;color:var(--txt)}.empty p{max-width:46ch;font-size:.92rem}
.msg{display:flex;animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.me{justify-content:flex-start}
.bubble{max-width:min(86%,600px);padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--acc);color:var(--accInk);white-space:pre-wrap;overflow-wrap:anywhere}
.ans{width:100%;min-width:0;display:grid;gap:10px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.ansText{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.pend{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.92rem}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,70%,100%{opacity:.25;transform:none}35%{opacity:1;transform:translateY(-3px)}}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--ease)}
.fold>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .34s}
[data-open="true"]>.fold{grid-template-rows:1fr}[data-open="true"]>.fold>div{visibility:visible;transition:none}
.chev{width:18px;height:18px;flex:none;color:var(--dim);transition:transform .28s var(--ease)}
[data-open="true"]>button .chev{transform:rotate(180deg)}
.trace{border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.traceRow{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;text-align:start}
.tdots{display:inline-flex;gap:3px;direction:ltr;flex:none}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.tdots i.warn{background:var(--warn)}.tdots i.unk{background:transparent;border:1.5px dashed var(--unk)}.tdots i.fail{background:var(--bad)}
.tsum{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.84rem;font-weight:600;color:var(--dim)}
.chain{margin:0 12px;padding:8px 0;border-top:1px dashed var(--line2);display:grid}
.step{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:7px 0;opacity:0;transform:translateY(6px);transition:opacity .3s var(--ease),transform .3s var(--ease);transition-delay:calc(var(--s)*70ms + 80ms)}
[data-open="true"]>.fold .step{opacity:1;transform:none}
.step dt{display:grid;align-content:start;font:600 .68rem var(--mono);color:var(--dim)}
.step dt small{font:400 .72rem system-ui,sans-serif}
.step dd{margin:0;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.step ul{margin:4px 0 0;padding-inline-start:18px;color:var(--dim);font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font:500 .72rem var(--mono);padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);direction:ltr}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.next{display:grid;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2)}
.next p{font-size:.9rem}.next small{color:var(--dim)}

/* ── composer ── */
.dock{flex:none;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;gap:6px}
.err{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--badSoft);color:var(--bad);font-size:.9rem;animation:rise .3s var(--ease) both}
.err span{flex:1;min-width:0;overflow-wrap:anywhere}
.composer{display:flex;align-items:flex-end;gap:8px;padding:6px;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s}
.composer:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft),var(--shadow)}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:160px;padding:10px 12px;border:0;background:transparent;color:var(--txt);font:inherit;font-size:16px;resize:none}
.composer textarea:focus{outline:none}
.send{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--acc);color:var(--accInk);transition:transform .12s var(--ease),background-color .18s}
.send svg{width:20px;height:20px}.send:active:not(:disabled){transform:scale(.94)}.send:disabled{background:var(--line2);opacity:1}
.foot{font-size:.74rem;color:var(--dim);text-align:center}

/* ── work ── */
.work{display:grid;gap:18px;padding-block:14px 28px;align-content:start}
.grp{display:grid;gap:8px}
.grp h2{display:flex;align-items:baseline;gap:8px;font-size:1rem}
.grp h2 .mono{font-size:.8rem;color:var(--dim)}
.grp>p{font-size:.82rem;color:var(--dim);margin-top:-4px}
.wk{border:1px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .18s,box-shadow .18s;animation:rise .4s var(--ease) both;animation-delay:calc(var(--n,0)*40ms)}
.wk[data-open="true"]{border-color:var(--line2);box-shadow:var(--shadow)}
.wkRow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px;text-align:start;border-radius:14px}
.light{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--line2)}
.light.green{background:var(--ok)}.light.amber{background:var(--warn)}.light.red{background:var(--bad)}
.light.blue{background:var(--acc);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 22%,transparent)}}
.wkT{min-width:0;display:grid;gap:5px}
.wkT b{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.wkMeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.8rem;color:var(--dim)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;direction:ltr}
.track i{height:4px;border-radius:2px;background:var(--line)}
.track i.done{background:var(--acc)}.track i.warn{background:var(--warn)}.track i.fail{background:var(--bad)}.track i.unk{background:repeating-linear-gradient(-45deg,var(--line) 0 4px,var(--line2) 4px 6px)}
.track i.active{background:linear-gradient(90deg,var(--accSoft),var(--acc),var(--accSoft));background-size:200% 100%;animation:slide 1.4s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
.bar2{height:5px;border-radius:99px;background:var(--line);overflow:hidden;direction:ltr}
.bar2 span{display:block;height:100%;border-radius:inherit;background:var(--acc);transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.wkBody{display:grid;gap:10px;margin:0 12px;padding:10px 0 12px;border-top:1px dashed var(--line2);font-size:.9rem}
.wkBody dl{display:grid;gap:6px}.wkBody dt{font-size:.74rem;font-weight:700;color:var(--dim)}.wkBody dd{margin:0;overflow-wrap:anywhere}
.wkBody textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--txt);font:inherit;font-size:16px;resize:vertical}
.confirm{display:grid;gap:8px;padding:10px 12px;border-radius:12px;background:var(--warnSoft);color:var(--txt);animation:rise .25s var(--ease) both}
.res{font-size:.86rem;color:var(--dim)}
a.lnk{color:var(--acc);font-weight:600;font-size:.88rem}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--card2),var(--card),var(--card2));background-size:200% 100%;animation:slide 1.3s linear infinite}

@media (max-width:480px){.stage .he{display:none}.barIn{gap:8px}.tabs button{padding:0 11px}.step{grid-template-columns:66px 1fr;gap:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
 .stage[data-s="active"] .node::after{display:none}.draw{stroke-dashoffset:0}}
</style></head><body>

<div id="login" hidden>
 <form class="loginCard" id="loginForm">
  <span class="orb lg"></span>
  <h1>LIA Next</h1>
  <p class="dim">אותו קוד כניסה של LIA. הקוד נבדק בשרת.</p>
  <input id="code" type="password" autocomplete="current-password" placeholder="קוד כניסה" aria-label="קוד כניסה">
  <button class="pri" type="submit" style="width:100%">כניסה</button>
  <p class="dim" id="loginStat" role="status"></p>
 </form>
</div>

<div id="app" hidden>
 <header class="bar"><div class="wrap barIn">
  <span class="orb sm" id="orb"></span><span class="brand">LIA</span><span class="tag">NEXT</span>
  <nav class="tabs" role="tablist" aria-label="תצוגה">
   <span class="tabPill" id="pill"></span>
   <button role="tab" id="tabChat" data-view="chat" aria-selected="true">שיחה</button>
   <button role="tab" id="tabWork" data-view="work" aria-selected="false">עבודה<span class="count" id="needCount" hidden></span></button>
  </nav>
 </div></header>

 <section class="view" id="viewChat">
  <div class="rail"><div class="wrap">
   <ol class="stages" id="stages"></ol>
   <p class="caption" id="caption" role="status" aria-live="polite"></p>
  </div></div>
  <div class="scroll" id="chatScroll"><div class="wrap thread" id="thread"></div></div>
  <div class="dock"><div class="wrap" style="display:grid;gap:6px">
   <div class="err" id="err" hidden role="alert"><span id="errText"></span><button class="sec" id="errX" style="min-height:32px;padding:0 10px">סגור</button></div>
   <div class="composer">
    <textarea id="input" rows="1" placeholder="כתוב לליה…" aria-label="הודעה לליה"></textarea>
    <button class="send" id="send" aria-label="שלח" disabled>
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
    </button>
   </div>
   <p class="foot">מחובר למנוע האמיתי. שיחה מכאן לא מסונכרנת לשרשור של <a class="lnk" href="lia.html" style="font-size:inherit">הממשק הקיים</a>.</p>
  </div></div>
 </section>

 <section class="view" id="viewWork" hidden>
  <div class="scroll"><div class="wrap work" id="work"></div></div>
 </section>
</div>

<script>
/* ── transport: the same two functions, the same header, the same body fields as lia.html ── */
var LIA_API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/lia?api=1';
var CC_API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/command-center?api=1';
/* NOT a dated build (YYYY-MM-DD.N) on purpose: the server learns the newest dated panel build it sees and tells every
   other device to reload onto it. This page must never teach it anything — lia.html stays the panel of record. */
var NEXT_BUILD='next-1';
var SURFACE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)?'phone':'desktop';
var CODE='';try{CODE=localStorage.getItem('lia_code')||'';}catch(e){}
var TRANSIENT=[502,503,504,522,524];
var $=function(q){return document.querySelector(q);};
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,function(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':'&quot;';});}
async function post(url,body){
 var payload=JSON.stringify(Object.assign({},body,{surface:SURFACE,client_build:NEXT_BUILD}));
 var last={status:0};
 for(var i=0;i<2;i++){
  var r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-fresco-code':CODE},body:payload});}

 if(st==='FAILED'||st==='CANCELLED')return ['done','done','fail','idle'];
 if(st==='DONE')return ['done','done','done',!c?'unk':c.key==='DONE_VERIFIED'?'done':'warn'];
 if(r.parked_for_david&&disp==='AWAITING_LAUNCH')return ['done','active','idle','idle'];
 if(r.parked_for_david&&disp==='PRODUCT_REVIEW')return ['done','done','done','active'];
 if(m.tone==='needs')return ['done','active','idle','idle'];
 if(m.tone==='moving')return ['done','done','active','idle'];
 if(m.track==='OFF')return ['done','done','fail','idle'];
 return ['done','done','idle','idle'];
}
function decisionOf(r){
 if(!(r&&r.parked_for_david===true))return null;
 var disp=String(r.disposition||'').toUpperCase(),dc=r.david_decision||{},p=r.product_review||{},sh=p.ship||null,o=arr(dc.options);
 if(disp==='PRODUCT_REVIEW'&&r.partial&&r.partial.davids&&r.david_decision)
  return {title:dc.question||'ההכרעה שלך',because:dc.because,note:'רוצה להוסיף הנחיה? (לא חובה)',
   btns:[['ACCEPT',o[0]||'אשרי להמשיך','לאשר לליה להמשיך? העבודה חוזרת אליה עם ההנחיה שלך.'],['RETURN',o[1]||'תחזירי לתיקון',''],['REJECT',o[2]||'סגרי','לסגור את החבילה?']]};
 if(disp==='PRODUCT_REVIEW')
  return {title:'התוצר מוכן לאישורך',because:sh?'המסלול סיים את השינוי ועצר לפני ההעלאה לאוויר.':'העבודה הסתיימה אצל המבצע, אבל היא לא "בוצעה" עד שתאשר את התוצר.',note:'תיקונים לתוצר? כתוב אותם כאן, והמבצע יתקן ויגיש שוב.',
   btns:[['ACCEPT',sh?'זה מה שביקשתי — העלי לאוויר':'זה מה שביקשתי — סגרי',sh?'לאשר את השינוי ולהעלות אותו לאוויר עכשיו?':'לאשר שהתוצר עונה על מה שביקשת ולסגור את החבילה?'],['RETURN','תקני לפי ההערות ותגישי שוב',''],['REJECT',sh?'סגרי בלי להעלות':'סגרי בלי לאשר','לסגור את החבילה בלי לאשר?']]};
 if(disp==='AWAITING_LAUNCH'){var L=r.launch||{};
  return {title:'לזה התכוונת?',because:'העבודה עוד לא יצאה לדרך. זה מה שליה הבינה: '+(L.understood||r.objective||''),deliverable:L.deliverable,
   btns:[['LAUNCH','שגרי — לזה התכוונתי','לשגר את העבודה כפי שליה הבינה אותה?'],['REJECT','סגרי','לסגור את החבילה?']]};}
 return {title:dc.question||'ההכרעה שלך',because:dc.because||'החבילה ממתינה לך.',
  btns:[['ACCEPT','אשר — זה מה שביקשתי','לאשר שהתוצר עונה על מה שביקשת ולסגור את החבילה?'],['RETRY','נסי שוב','להחזיר את החבילה לביצוע?'],['REJECT','סגרי','לסגור את החבילה?']]};
}
var DEC_DONE={ACCEPT:'אושרה',RETRY:'הוחזרה לביצוע',REJECT:'נסגרה',LAUNCH:'יצאה לדרך'};
async function loadWork(){
 try{
  var a=await Promise.all([cap('work_status',{limit:200}),cap('work_status',{closed_since:new Date(Date.now()-864e5).toISOString(),limit:200})]);
  W.alive=rowsOf(a[0]);W.closed=rowsOf(a[1]);W.err='';
 }catch(e){if(String(e.message)==='401')return;W.err=String(e&&e.message||e).slice(0,200);if(!W.alive)W.alive=[];}
 renderWork();
}
function workRows(){
 var now=Date.now(),raw={};
 var all=(W.alive||[]).concat(recentDone(W.closed,now));
 var rows=all.map(function(r){var m=meterRowOf(r,now);if(m){raw[m.work_id]=r;m.raw=r;}return m;}).filter(Boolean).sort(function(a,b){return a.order-b.order;});
 var seen={};return rows.filter(function(m){if(seen[m.work_id])return false;seen[m.work_id]=1;return true;});
}
function renderWork(){
 var el=$('#work');
 if(W.alive===null){el.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';return;}
 var rows=workRows(),groups=meterGroups(rows),need=rows.filter(function(m){return m.group==='david';}).length;
 var nc=$('#needCount');nc.hidden=!need;nc.textContent=need;movePill();
 var h=W.err?'<div class="err"><span>לא הצלחתי לקרוא את העבודה מהשרת: '+esc(W.err)+'</span></div>':'';
 if(!rows.length&&!W.err)h+='<div class="empty"><h2>אין חבילות עבודה פתוחות</h2><p>הוראה שתיתן לליה בשיחה תופיע כאן עם המסלול שלה.</p></div>';
 var n=0;
 h+=groups.map(function(g){
  return '<section class="grp"><h2>'+esc(g.he)+' <span class="mono">'+g.rows.length+'</span></h2>'+(g.hint?'<p>'+esc(g.hint)+'</p>':'')
   +g.rows.map(function(m){
    var open=W.open===m.work_id,tk=trackOf(m.raw,m),dec=decisionOf(m.raw);
    var row='<article class="wk" data-open="'+open+'" style="--n:'+(n++)+'"><button type="button" class="wkRow" data-wk="'+esc(m.work_id)+'" aria-expanded="'+open+'">'
     +'<span class="light '+m.light+'"></span><span class="wkT"><b title="'+esc(m.title)+'">'+esc(m.short)+'</b>'
     +'<span class="track" aria-hidden="true">'+tk.map(function(s){return '<i class="'+(s==='idle'?'':s)+'"></i>';}).join('')+'</span>'
     +'<span class="wkMeta"><span>'+esc(m.label)+'</span>'+(m.gauge?'<span class="mono">'+esc(m.gauge)+'</span>':'')+(m.stage&&m.stage!==m.label?'<span>'+esc(m.stage)+'</span>':'')+'</span></span>'+CHEV+'</button>';
    row+='<div class="fold"><div><div class="wkBody">';
    if(open){
     if(m.pct!=null&&m.gauge)row+='<div class="bar2" role="img" aria-label="'+esc(m.gauge)+'"><span style="width:'+m.pct+'%"></span></div>';
     row+='<dl>'
      +'<div><dt>THINK · מה הוגדר</dt><dd>'+esc(cleanT(m.title).slice(0,420))+'</dd></div>'
      +(m.done_so_far?'<div><dt>EXECUTE · מה כבר בוצע</dt><dd>'+esc(m.done_so_far)+'</dd></div>':'')
      +(m.next?'<div><dt>'+(m.group==='stuck'?'למה זה תקוע':'הצעד הבא')+'</dt><dd>'+esc(m.next)+'</dd></div>':'')
      +(m.why?'<div><dt>מה אומר המשגר</dt><dd>'+esc(m.why)+'</dd></div>':'')
      +(m.product?'<div><dt>VERIFY · התוצר</dt><dd>'+esc(String(m.product).slice(0,600))+' <span class="badge '+(m.verified?'ok':'unk')+'">'+(m.verified?'VERIFIED':'NOT VERIFIED')+'</span></dd></div>':'')
      +(m.ref&&/^https?:\/\//.test(m.ref)?'<div><dd><a class="lnk" href="'+esc(m.ref)+'" target="_blank" rel="noopener">פתח את התוצר</a></dd></div>':'')
      +'</dl>';
     if(dec){
      row+='<dl><div><dt>DECIDE · '+esc(dec.title)+'</dt><dd>'+esc(String(dec.because||'').replace(/\*\*/g,'').slice(0,500))+(dec.deliverable?'<br><span class="dim">התוצר: '+esc(dec.deliverable)+'</span>':'')+'</dd></div></dl>';
      if(dec.note)row+='<textarea id="wkNote" placeholder="'+esc(dec.note)+'" aria-label="'+esc(dec.note)+'">'+esc(W.note)+'</textarea>';
      if(W.confirm&&W.confirm.id===m.work_id)
       row+='<div class="confirm"><b>'+esc(W.confirm.q)+'</b><div class="acts"><button type="button" class="pri" data-go="1" style="min-height:42px">כן</button><button type="button" class="sec" data-cancel="1">ביטול</button></div></div>';
      else row+='<div class="acts">'+dec.btns.map(function(b,k){return '<button type="button" class="'+(k===0?'pri':b[0]==='REJECT'?'sec no':'sec')+'" style="min-height:42px" data-dec="'+b[0]+'" data-q="'+esc(b[2])+'">'+esc(b[1])+'</button>';}).join('')+'</div>';
     }
     row+='<p class="res" role="status">'+esc(W.res[m.work_id]||'')+'</p>'
      +'<a class="lnk" href="index.html">פתח במרכז הבקרה</a>';
    }
    return row+'</div></div></div></article>';}).join('')+'</section>';}).join('');
 el.innerHTML=h;
}
function cleanT(t){return String(t||'').replace(/^\s*>\s*/,'').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();}
/* work_decide — the same call the command center makes, the same decisions, a confirmation before each */
async function decide(id,dec){
 var note=String(W.note||'').trim();
 if(dec==='RETURN'){if(!note){W.res[id]='כדי להחזיר לתיקון צריך לכתוב מה לתקן.';W.confirm=null;renderWork();var n=$('#wkNote');if(n)n.focus();return;}dec='RETRY';}
 W.confirm=null;W.res[id]='שולח…';renderWork();
 try{
  var x=await cc({action:'work_decide',work_id:id,decision:dec,note:note});
  W.res[id]=(x&&x.ok)?(DEC_DONE[dec]||'בוצע'):('לא הושלם: '+((x&&(x.summary||x.reason))||''));W.note='';
 }catch(e){W.res[id]='לא הושלם: '+String(e&&e.message||e).slice(0,200);}
 await loadWork();
}

/* ── wiring ── */
function movePill(){var b=$('.tabs button[aria-selected="true"]'),p=$('#pill');if(!b||!b.offsetWidth)return;p.style.width=b.offsetWidth+'px';p.style.transform='translateX('+b.offsetLeft+'px)';}
function setView(v){S.view=v;$('#viewChat').hidden=v!=='chat';$('#viewWork').hidden=v!=='work';
 $('#tabChat').setAttribute('aria-selected',v==='chat');$('#tabWork').setAttribute('aria-selected',v==='work');movePill();
 if(v==='work'){renderWork();loadWork();}}
function grow(){var t=$('#input');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';setSend();}
function setSend(){$('#send').disabled=S.busy||!$('#input').value.trim();$('#input').disabled=S.busy;}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-view],[data-stage],[data-trace],[data-next],[data-copy],[data-wk],[data-dec],[data-go],[data-cancel]');if(!t)return;
 if(t.dataset.view)setView(t.dataset.view);
 else if(t.dataset.stage){S.openStage=S.openStage===t.dataset.stage?null:t.dataset.stage;renderRail();}
 else if(t.dataset.trace!=null){var tr=S.turns[+t.dataset.trace];tr.open=!tr.open;var box=t.parentNode;box.dataset.open=!!tr.open;t.setAttribute('aria-expanded',!!tr.open);}
 else if(t.dataset.next!=null)runNext(+t.dataset.next,t);
 else if(t.dataset.copy!=null){var txt=S.turns[+t.dataset.copy].text;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){t.textContent='הועתק';setTimeout(function(){t.textContent='העתק';},1500);}).catch(function(){});}
 else if(t.dataset.wk){var n0=$('#wkNote');W.open=W.open===t.dataset.wk?null:t.dataset.wk;W.confirm=null;W.note='';renderWork();}
 else if(t.dataset.dec){var n1=$('#wkNote');W.note=n1?n1.value:'';W.res[W.open]='';if(t.dataset.q){W.confirm={id:W.open,dec:t.dataset.dec,q:t.dataset.q};renderWork();}else decide(W.open,t.dataset.dec);}
 else if(t.dataset.go&&W.confirm)decide(W.confirm.id,W.confirm.dec);
 else if(t.dataset.cancel){W.confirm=null;renderWork();}
});
document.addEventListener('input',function(e){if(e.target.id==='wkNote')W.note=e.target.value;if(e.target.id==='input')grow();});
$('#input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&SURFACE==='desktop'){e.preventDefault();var v=$('#input').value;$('#input').value='';grow();sendTurn(v);}});
$('#send').addEventListener('click',function(){var v=$('#input').value;$('#input').value='';grow();sendTurn(v);});
$('#errX').addEventListener('click',function(){showErr('');S.fail=null;renderRail();});
window.addEventListener('resize',movePill);
$('#loginForm').addEventListener('submit',async function(e){e.preventDefault();
 CODE=$('#code').value.trim();if(!CODE)return;$('#loginStat').textContent='בודק…';
 var o=await post(LIA_API,{action:'state'});var j=null;if(o.status===200){try{j=await o.r.json();}catch(x){}}
 if(j){try{localStorage.setItem('lia_code',CODE);}catch(x){}boot();return;}
 $('#loginStat').textContent=o.status===401?'קוד שגוי':'לא הצלחתי להגיע לשרת כרגע ('+(o.status||'אין חיבור')+'). הקוד כנראה בסדר; נסה שוב בעוד רגע.';
});
function boot(){
 $('#login').hidden=true;$('#app').hidden=false;
 renderRail();renderThread();setSend();movePill();loadWork();
 if(!window._wkPoll)window._wkPoll=setInterval(function(){if(CODE&&!document.hidden)loadWork();},60000);
}
if(CODE)boot();else{$('#login').hidden=false;}
</script></body></html>
