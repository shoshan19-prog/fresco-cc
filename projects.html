<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fresco · הפרויקטים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="lia-icon-192.png">
<link rel="apple-touch-icon" href="lia-icon-180.png">
<meta name="theme-color" content="#f7f8fa">
<!--
  THE PROJECTS SCREEN (David, 4.10 — WORK 27d03f59, "המסך הניהולי"). What he approved:
    "לבנות מנגנון ניהולי שמחבר מידע ממקורות החברה, מזהה חריגים והזדמנויות, ומציג לך
     רק מה ודאי, צפוי ודורש החלטה."
  One read, project_snapshot, renders everything: Priority by its own keys (ודאי), waiting
  quotes (צפוי), the office's project workbook attached by name/address (לא מאומת), and the
  named rules that put each project under דורש החלטה / תקוע / תקין. This page judges nothing
  and adds no number: every line is a field the server returned, with its certainty shown.
  Static page, no credential inside — the same code as the chat and the Command Center.
-->
<style>
/* tokens: mirrored from index.html / lia.html :root — one visual language */
:root{
 --bg:#f7f8fa;--bg2:#ffffff;
 --card:#ffffff;--card2:#f2f4f7;
 --line:#e4e7ec;--line2:#d0d5dd;
 --txt:#16181d;--dim:#667085;
 --acc:#2f6bff;--acc2:#2f6bff;--accSoft:#eaf0ff;
 --ok:#12a150;--warn:#c77700;--me:#eaf0ff;
 --r:18px;--rs:14px;
 --glow:0 0 0 3px rgba(47,107,255,.13);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,'Segoe UI',Arial,sans-serif;min-height:100dvh;overflow-x:hidden;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

#login{max-width:380px;margin:22vh auto 0;padding:16px;display:none}
#login .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
#login h1{font-size:21px;margin-bottom:4px}
#login input{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
#login button{width:100%;margin-top:10px;background:var(--acc);color:#fff;border-radius:12px;padding:12px 20px}

#topbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
 padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
#topbar .back,#topbar .re{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--dim)}
#topbar .re.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#topbar h1{font-size:18px;letter-spacing:-.2px;line-height:1.2}
#topbar .when{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

main{padding:12px 16px calc(32px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.lead{font-size:15px;line-height:1.55;margin:2px 2px 10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum a{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-height:70px}
.sum b{font-size:24px;line-height:1.05;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--dim);line-height:1.25}
.sum .d b{color:var(--warn)} .sum .s b{color:#475467} .sum .o b{color:var(--ok)}
.money{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--dim);margin:10px 2px 0}
.money b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin:8px 2px 0}

.cert{display:inline-block;font-size:11.5px;font-weight:600;line-height:1;padding:3px 7px;border-radius:9px;white-space:nowrap;vertical-align:1px}
.cert.c1{background:#eaf7ee;color:var(--ok)} .cert.c2{background:var(--accSoft);color:var(--acc)} .cert.c3{background:#fdf3e3;color:var(--warn)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 2px 8px}
.sec h2{font-size:17px;letter-spacing:-.2px}
.sec .dim{font-size:12.5px;color:var(--dim)}

.pj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 8px}
.pj.d{border-inline-start:3px solid var(--warn)} .pj.s{border-inline-start:3px solid #98a2b3}
.pj .nm{font-weight:700;font-size:16px;line-height:1.3}
.pj .who{font-size:13px;color:var(--dim);margin-top:1px}
.pj .fl{display:flex;gap:8px;margin-top:8px;font-size:14.5px;line-height:1.5}
.pj .fl .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:8px;flex:0 0 auto}
.pj .fl.s .dot{background:#98a2b3}
.pj .fl .rule{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.pj .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.pj .facts b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.pj .facts .f{white-space:nowrap}
.pj .wb{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--card2);font-size:13px;line-height:1.5}
.pj .wb .h{color:var(--dim)}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--acc);font-size:13.5px;font-weight:600;list-style:none;min-height:32px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
.ord{font-size:13px;line-height:1.5;padding:6px 0;border-top:1px dashed var(--line)}
.ord:first-of-type{border-top:0}
.ord .n{font-variant-numeric:tabular-nums;color:var(--dim)}

.okl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.okl .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.okl .r:first-child{border-top:0}
.okl .r .m{color:var(--dim);font-size:12.5px;grid-column:1/-1}
.okl .r .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.showall{display:block;width:100%;min-height:44px;margin-top:8px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--acc);font-weight:600;font-size:14px}

.note{color:var(--dim);font-size:12.5px;line-height:1.5;margin:6px 2px 0}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--rs);padding:14px;color:var(--dim);font-size:14px;text-align:center}
.foot{margin-top:24px;font-size:12.5px;color:var(--dim);line-height:1.6}
.foot ul{margin:4px 0 0;padding-inline-start:18px}
.src a{color:var(--acc);font-weight:600}
@media(max-width:380px){.sum b{font-size:21px}.pj{padding:11px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>

<div id="login"><div class="card"><h1>הפרויקטים</h1>
<p class="note" style="margin:0">קוד הכניסה של מרכז הפיקוד</p>
<input id="code" type="password" placeholder="קוד" autocomplete="current-password">
<button id="lb" type="button">כניסה</button>
<p class="note" id="le"></p></div></div>

<div id="app" hidden>
<header id="topbar">
 <a class="back" href="index.html" aria-label="חזרה למרכז הפיקוד" title="מרכז הפיקוד"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
 <div><h1>הפרויקטים</h1><div class="when" id="when">טוען…</div></div>
 <button class="re" id="re" type="button" aria-label="רענון מפריוריטי" title="רענון מפריוריטי"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></button>
</header>
<main id="m" aria-live="polite"><p class="empty">טוען את תמונת הפרויקטים מפריוריטי…</p></main>
</div>

<script>
var API='https://bkgukulvjfvkubvuvwwz.supabase.co/functions/v1/command-center?api=1';
var PS_BUILD='2026-10-05.1';
var B=function(q){return document.querySelector(q);};
var CODE_FROM='';
function code(){
  try{var s=sessionStorage.getItem('fc');if(s){CODE_FROM='fc';return s;}
      var l=localStorage.getItem('lia_code');if(l){CODE_FROM='lia_code';return l;}}catch(e){}
  CODE_FROM='';return '';
}
function showLogin(msg){B('#app').hidden=true;B('#login').style.display='block';if(msg)B('#le').textContent=msg;}
function api(b){
  b=Object.assign({surface:'command-center',client_build:PS_BUILD},b||{});
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-fresco-code':code()},body:JSON.stringify(b)}).then(function(r){
    if(r.status===401){try{sessionStorage.removeItem('fc');if(CODE_FROM==='lia_code')localStorage.removeItem('lia_code');}catch(e){}showLogin('הקוד לא התקבל');throw new Error('401');}
    if(!r.ok)return r.text().then(function(t){throw new Error(t.slice(0,200));});
    return r.json();});
}
function cap(name,args){return api({action:'cap',name:name,args:args||{}});}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,function(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':'&quot;';});}

/* ── PS_RENDER_BEGIN — pure: the server's snapshot in, HTML out (test-projects.mjs drives it) ── */
function shekel(n){if(n==null||!isFinite(n))return '—';return '₪'+Math.round(n).toLocaleString('he-IL');}
function heDay(iso){var p=String(iso||'').slice(0,10).split('-');return p.length===3?(Number(p[2])+'.'+Number(p[1])+'.'+p[0].slice(2)):'';}
function cert(c){var k=c==='ודאי'?'c1':c==='צפוי'?'c2':'c3';return '<span class="cert '+k+'">'+esc(c)+'</span>';}
function plural(n,one,many){return n===1?one:(n+' '+many);}
function factsOf(p){
  var f=[];
  if(p.open&&p.open.orders&&p.open.orders.length)f.push('יתרה פתוחה <b>'+shekel(p.open.balance)+'</b>'+(p.open.unverified?' (+'+p.open.unverified+' לא מאומתות)':''));
  if(p.delivered&&p.delivered.count)f.push('יצא ב-90 יום <b>'+shekel(p.delivered.gross)+'</b> ('+plural(p.delivered.count,'תעודה אחת','תעודות')+')');
  if(p.unbilled&&p.unbilled.count)f.push('לא חויב <b>'+shekel(p.unbilled.gross)+'</b>');
  if(p.quotes&&p.quotes.count)f.push('הצעות שמחכות <b>'+shekel(p.quotes.value)+'</b> '+cert('צפוי'));
  if(p.last_activity)f.push('פעילות אחרונה '+heDay(p.last_activity));
  return f;
}
function wbBlock(p,wb){
  if(!p.workbook||!p.workbook.length)return '';
  var when=wb&&wb.updated?heDay(wb.updated):'';
  return p.workbook.map(function(w){
    var bits=[];
    if(w.est_end!=null)bits.push('אומדן לסיום '+shekel(w.est_end));
    if(w.next_month!=null)bits.push('חודש הבא '+shekel(w.next_month));
    if(w.notes)bits.push(esc(w.notes));
    return '<div class="wb"><span class="h">בדוח הפרויקטים'+(when?' ('+when+')':'')+':</span> '+esc(w.address||w.customer)
      +(bits.length?' · '+bits.join(' · '):'')+' '+cert('לא מאומת')
      +'<div class="h">הותאם לפי '+esc(w.basis)+'</div></div>';
  }).join('');
}
function ordersBlock(p){
  var os=(p.open&&p.open.orders)||[];
  var refs=[].concat(p.unbilled&&p.unbilled.docs||[]).slice(0,8);
  if(!os.length&&!refs.length)return '';
  var h=os.map(function(o){
    var d=o.deliveries==null?'היסטוריית המשלוחים לא נקראה':(o.deliveries?('משלוח אחרון '+heDay(o.last_delivery)+' · '+plural(o.deliveries,'תעודה אחת','תעודות')):'לא יצא ממנה משלוח');
    return '<div class="ord"><span class="n">'+esc(o.order)+'</span> · '+heDay(o.date)+' · יתרה '+(o.balance==null?'לא מאומתת':shekel(o.balance))
      +(o.framework?' · הזמנת מסגרת'+(o.remaining_pct!=null?' ('+o.remaining_pct+'% נשאר)':''):'')+'<br>'+d+'</div>';
  }).join('');
  if(refs.length)h+='<div class="ord">תעודות שלא חויבו: <span class="n">'+refs.map(esc).join(', ')+'</span></div>';
  return '<details class="more"><summary>ההזמנות והמסמכים</summary>'+h+'</details>';
}
function projCard(p,wb){
  var cls=p.status==='DECISION'?'d':p.status==='STUCK'?'s':'';
  /* the customer is the name when Priority holds no project name — never said twice */
  var who=(p.customers||[]).filter(function(c){return c!==p.name;}).join(' · ');
  if(p.basis==='CUSTOMER')who+=(who?' · ':'')+'אין שם פרויקט בפריוריטי — לפי הלקוח';
  var fl=(p.flags||[]).map(function(f){
    return '<div class="fl'+(f.level==='STUCK'?' s':'')+'"><span class="dot" aria-hidden="true"></span><div>'+esc(f.text)+' '+cert(f.certainty)
      +'<span class="rule">'+(f.level==='DECISION'?'דורש החלטה':'תקוע')+' · כלל: '+esc(f.rule_he)+'</span></div></div>';
  }).join('');
  var facts=factsOf(p);
  return '<article class="pj '+cls+'"><div class="nm">'+esc(p.name)+'</div>'+(who?'<div class="who">'+esc(who)+'</div>':'')
    +fl+(facts.length?'<div class="facts">'+facts.map(function(f){return '<span class="f">'+f+'</span>';}).join('<span aria-hidden="true">·</span>')+'</div>':'')
    +wbBlock(p,wb)+ordersBlock(p)+'</article>';
}
function okRow(p){
  var v=p.open&&p.open.balance?shekel(p.open.balance):(p.delivered&&p.delivered.count?shekel(p.delivered.gross):'');
  var m=[(p.customers||[]).filter(function(c){return c!==p.name;}).join(' · ')];
  if(p.delivered&&p.delivered.count)m.push('יצא '+plural(p.delivered.count,'פעם אחת','פעמים'));
  if(p.unbilled&&p.unbilled.count)m.push('לא חויב '+shekel(p.unbilled.gross));
  if(p.last_activity)m.push('אחרון '+heDay(p.last_activity));
  if(p.workbook&&p.workbook.length)m.push('בדוח הפרויקטים');
  return '<div class="r"><div>'+esc(p.name)+'</div><div class="v">'+v+'</div><div class="m">'+esc(m.filter(Boolean).join(' · '))+'</div></div>';
}
var OK_SHOWN=8;
function renderProjects(S,opt){
  opt=opt||{};
  var r=S.snapshot,sm=r.summary,wb=r.workbook,h='';
  var dec=r.projects.filter(function(p){return p.status==='DECISION';}),st=r.projects.filter(function(p){return p.status==='STUCK';}),ok=r.projects.filter(function(p){return p.status==='OK';});
  var decN=dec.length+(r.ancient&&r.ancient.count?1:0);
  h+='<p class="lead">'+sm.projects+' פרויקטים זזו בפריוריטי ב-90 הימים האחרונים.</p>';
  h+='<div class="sum"><a class="d" href="#dec"><b>'+decN+'</b><span>דורשים החלטה שלך</span></a>'
    +'<a class="s" href="#stuck"><b>'+st.length+'</b><span>תקועים</span></a>'
    +'<a class="o" href="#ok"><b>'+ok.length+'</b><span>תקינים</span></a></div>';
  h+='<div class="money"><span>יתרות פתוחות <b>'+shekel(sm.open_balance)+'</b> לפני מע״מ '+cert('ודאי')+'</span>'
    +'<span>לא חויב <b>'+shekel(sm.unbilled_gross)+'</b> כולל מע״מ '+cert('ודאי')+'</span>'
    +(sm.quotes_count?'<span>הצעות שמחכות <b>'+shekel(sm.quotes_value)+'</b> '+cert('צפוי')+'</span>':'')+'</div>';
  h+='<div class="legend">'+cert('ודאי')+' מפריוריטי, לפי מספרי המסמכים '+cert('צפוי')+' הצעה או אומדן '+cert('לא מאומת')+' מדוח הפרויקטים, הותאם לפי שם</div>';

  h+='<div class="sec" id="dec"><h2>דורש החלטה שלך</h2><span class="dim">'+decN+'</span></div>';
  if(!decN)h+='<p class="empty">שום פרויקט לא מחכה להחלטה שלך</p>';
  h+=dec.map(function(p){return projCard(p,wb);}).join('');
  if(r.ancient&&r.ancient.count){
    h+='<article class="pj d"><div class="nm">הזמנות ישנות שעדיין פתוחות</div><div class="who">רישום, לא פרויקט</div>'
      +'<div class="fl"><span class="dot" aria-hidden="true"></span><div>'+r.ancient.count+' הזמנות משנים '+esc(String(r.ancient.years).replace('–',' עד '))+' עדיין רשומות כפתוחות בפריוריטי — לסגור אותן? '+cert('ודאי')
      +'<span class="rule">כלל: הזמנה פתוחה בת יותר משלוש שנים</span></div></div>'
      +'<details class="more"><summary>מספרי ההזמנות</summary><div class="ord"><span class="n">'+r.ancient.orders.map(esc).join(', ')+'</span></div></details></article>';
  }

  h+='<div class="sec" id="stuck"><h2>תקוע</h2><span class="dim">'+st.length+'</span></div>';
  h+=st.length?st.map(function(p){return projCard(p,wb);}).join(''):'<p class="empty">שום פרויקט לא תקוע</p>';

  h+='<div class="sec" id="ok"><h2>תקין</h2><span class="dim">'+ok.length+'</span></div>';
  if(ok.length){
    var shown=opt.allOk?ok:ok.slice(0,OK_SHOWN);
    h+='<div class="okl">'+shown.map(okRow).join('')+'</div>';
    if(ok.length>shown.length)h+='<button class="showall" id="showOk" type="button">הצג את כל '+ok.length+' הפרויקטים התקינים</button>';
  }

  if(wb){
    h+='<div class="sec"><h2>בדוח הפרויקטים בלבד</h2><span class="dim">'+wb.only.length+'</span></div>';
    h+='<p class="note">'+wb.matched+' מתוך '+wb.rows+' השורות של "'+esc(wb.name||'דוח פרויקטים פעילים')+'"'+(wb.updated?' (עודכן '+heDay(wb.updated)+')':'')
      +' הותאמו לפרויקט בפריוריטי. השאר לא נמצאו בפעילות של 90 הימים האחרונים — אולי לא התחילו, אולי נעצרו, ואולי רשומים בפריוריטי בשם אחר. '+cert('לא מאומת')
      +(wb.url?' · <span class="src"><a href="'+esc(wb.url)+'" target="_blank" rel="noopener">פתיחת הדוח</a></span>':'')+'</p>';
    if(wb.only.length){
      h+='<details class="more"><summary>הצג את '+wb.only.length+' השורות</summary><div class="okl">'+wb.only.map(function(w){
        var m=[w.customer];if(w.notes)m.push(w.notes);if(w.basis&&/חלשה|פרויקטים, לא שויך/.test(w.basis))m.push(w.basis);
        return '<div class="r"><div>'+esc(w.address||w.customer)+'</div><div class="v">'+(w.est_end!=null?shekel(w.est_end):'')+'</div><div class="m">'+esc(m.join(' · '))+'</div></div>';
      }).join('')+'</div></details>';
    }
  }

  h+='<div class="foot"><b>איך זה נקבע.</b> כל פרויקט נשפט לפי כללים קבועים, לא לפי תחושה:<ul>'
    +(r.rules||[]).map(function(x){return '<li>'+esc(x.text)+'</li>';}).join('')+'</ul>'
    +'<p style="margin-top:6px">מקורות: הזמנות, תעודות משלוח והצעות מחיר מפריוריטי; "דוח פרויקטים פעילים" מהשרפוינט. פרויקט = שם הפרויקט שרשום בפריוריטי, ובלעדיו — הלקוח.'
    +' תעודות שלא חויבו נספרות מ-'+heDay(r.unbilled_from)+', כמו במסך היומי.</p>'
    +((S.failures&&S.failures.length)?'<p style="margin-top:6px;color:var(--warn)">לא נקרא הפעם: '+S.failures.map(esc).join(' · ')+'</p>':'')
    +'<p style="margin-top:6px">build '+PS_BUILD+'</p></div>';
  return h;
}
/* ── PS_RENDER_END ── */

var S=null,ALL_OK=false,BUSY=false;
function whenText(at,cached){
  if(!at)return '';
  var t=new Date(at);
  var hm=t.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  var same=t.toDateString()===new Date().toDateString();
  return 'נכון ל-'+(same?hm:t.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '+hm);
}
function render(){
  if(!S||!S.snapshot)return;
  B('#m').innerHTML=renderProjects(S,{allOk:ALL_OK});
  B('#when').textContent=whenText(S.at,S.cached);
  var b=B('#showOk');if(b)b.onclick=function(){ALL_OK=true;render();};
}
function take(x){
  var r=(x&&x.rows&&x.rows[0])||{};
  if(r.snapshot&&r.snapshot.projects){S=r;render();return true;}
  if(!S)B('#m').innerHTML='<p class="empty">'+esc(r.answer||'לא הצלחתי לבנות את תמונת הפרויקטים עכשיו')+'</p>';
  return false;
}
function spin(on){BUSY=on;B('#re').classList.toggle('spin',on);if(on&&S)B('#when').textContent='מעדכן מפריוריטי…';}
function load(force){
  if(BUSY)return;
  B('#login').style.display='none';B('#app').hidden=false;
  spin(true);
  var first=force?cap('project_snapshot',{refresh:true,full:true}):cap('project_snapshot',{stale_ok:true,full:true});
  first.then(function(x){
    take(x);
    var age=S&&S.at?Date.now()-Date.parse(S.at):Infinity;
    if(!force&&age>10*60000)return cap('project_snapshot',{full:true}).then(take);
  }).catch(function(e){
    if(String(e.message)==='401')return;
    if(!S)B('#m').innerHTML='<p class="empty">לא הצלחתי להגיע לשרת: '+esc(e.message)+'</p>';
  }).then(function(){spin(false);if(S)B('#when').textContent=whenText(S.at,S.cached);});
}
B('#re').onclick=function(){load(true);};
B('#lb').onclick=function(){var c=B('#code').value.trim();if(!c)return;try{sessionStorage.setItem('fc',c);}catch(e){}load(false);};
B('#code').addEventListener('keydown',function(e){if(e.key==='Enter')B('#lb').click();});
if(code())load(false);else showLogin('');
</script>
