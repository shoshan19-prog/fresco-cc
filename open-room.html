<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>החדר של דוד</title>
  <style>
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f6f2ea;color:#202020;display:grid;place-items:center}
    main{width:min(92vw,720px);padding:32px;box-sizing:border-box}
    .card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 8px 32px #0001}
    h1{margin-top:0} button{border:0;border-radius:10px;padding:12px 18px;font-size:16px;background:#202020;color:white;cursor:pointer}
  </style>
</head>
<body>
  <main><section class="card">
    <h1>החדר של דוד</h1>
    <h2>בוקר טוב דוד</h2>
    <h3>מה דורש אותי היום</h3>
    <h3>מה מצאתי בשבילך</h3>
    <button type="button" aria-label="שאל">🎤 שאל</button>
  </section></main>
</body>
</html>
